<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOPTRANS · Pricing Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --g0:#ffffff; --g50:#f7f8f7; --g75:#eef1ee; --g100:#e4e8e4; --g150:#d6dcd6;
  --g200:#c3ccc4; --g300:#9aa69c; --g400:#6f7d72; --g500:#4a564d; --g600:#323b35; --g700:#1c2420;
  --green:#00C566; --green-d:#16A34A; --green-dd:#0f7a37; --green-l:#e7f9ef; --green-ll:#f1fcf6;
  --amber:#d97706; --amber-l:#fef3e2; --red:#dc2626; --red-l:#fde8e8; --blue:#2563eb; --blue-l:#e8f0fe;
  --shadow-sm:0 1px 2px rgba(28,36,32,.05),0 1px 3px rgba(28,36,32,.07);
  --shadow:0 4px 6px -1px rgba(28,36,32,.07),0 2px 4px -2px rgba(28,36,32,.06);
  --shadow-lg:0 20px 40px -12px rgba(28,36,32,.22),0 8px 16px -8px rgba(28,36,32,.12);
  --r:11px; --r-sm:8px; --r-lg:18px;
  --sans:'Geist',system-ui,sans-serif; --mono:'Geist Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--g700)}
body{font-family:var(--sans);color:var(--g700);background:var(--g50);background-image:radial-gradient(var(--g150) 1px,transparent 1px);background-size:22px 22px;background-attachment:fixed;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
::selection{background:var(--green);color:#fff}
.mono{font-family:var(--mono)}

.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--g100);display:flex;align-items:center;gap:18px;padding:0 24px;height:62px}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.brand-mark{width:34px;height:34px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,var(--green),var(--green-d));display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;box-shadow:0 4px 12px rgba(0,197,102,.35)}
.brand-name{font-weight:800;font-size:16px;letter-spacing:-.02em}
.brand-name span{color:var(--green-d)}
.brand-sub{font-size:10.5px;color:var(--g400);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.topbar .spacer{flex:1}
.tb-label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--g400)}

/* country dropdown */
.country-dd{position:relative}
.cdd-btn{display:flex;align-items:center;gap:9px;padding:9px 14px;border:1px solid var(--g150);border-radius:11px;background:#fff;font-size:13.5px;font-weight:600;min-width:190px;box-shadow:var(--shadow-sm);transition:.14s}
.cdd-btn:hover{border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}
.cdd-btn img{width:22px;height:15px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.cdd-btn span{flex:1;text-align:left}
.cdd-btn .chev{width:16px;height:16px;color:var(--g300);transition:.2s}
.country-dd.open .cdd-btn .chev{transform:rotate(90deg)}
.cdd-menu{position:absolute;top:calc(100% + 6px);right:0;width:240px;background:#fff;border:1px solid var(--g100);border-radius:13px;box-shadow:var(--shadow-lg);padding:6px;max-height:360px;overflow-y:auto;display:none;z-index:60}
.cdd-menu.show{display:block;animation:pop .16s ease}
.cdd-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--g600);text-align:left;transition:.1s}
.cdd-item img{width:22px;height:15px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.cdd-item svg{width:15px;height:15px;margin-left:auto;color:var(--green-d)}
.cdd-item:hover{background:var(--g50)}
.cdd-item.on{background:var(--green-l);color:var(--green-dd);font-weight:600}

.shell{display:flex;min-height:calc(100vh - 62px)}
.sidebar{width:262px;flex-shrink:0;border-right:1px solid var(--g100);background:rgba(255,255,255,.5);padding:16px 12px;position:sticky;top:62px;height:calc(100vh - 62px);overflow-y:auto}
.sidebar::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-thumb{background:var(--g150);border-radius:6px}
.nav-group{margin-bottom:6px}
.nav-head{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--g400);transition:.12s;box-shadow:inset 0 0 0 0 var(--green)}
.nav-head:hover{background:var(--green-ll);color:var(--green-dd);box-shadow:inset 3px 0 0 0 var(--green-d)}
.nav-head:hover .ni{color:var(--green-d)}
.nav-head .ni{width:16px;height:16px;flex-shrink:0;color:var(--g300)}
.nav-head .chev{margin-left:auto;width:13px;height:13px;flex-shrink:0;transition:.2s;color:var(--g300)}
.nav-group.open .chev{transform:rotate(90deg)}
.nav-items{display:none;padding:3px 0 6px 0}.nav-group.open .nav-items{display:block}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;padding:8px 11px 8px 36px;border-radius:7px;font-size:13px;color:var(--g500);font-weight:500;text-align:left;transition:.12s;position:relative}
.nav-item:hover:not(.active){background:var(--green-ll);color:var(--green-dd);box-shadow:inset 3px 0 0 0 var(--green-d)}
.nav-item.active{background:var(--green-l);color:var(--green-dd);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:18px;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:var(--green-d)}
.nav-badge{margin-left:auto;font-size:10px;font-weight:600;color:var(--g400);background:var(--g75);padding:1px 7px;border-radius:20px;font-family:var(--mono)}
.nav-item.active .nav-badge{background:var(--g0);color:var(--green-dd)}

/* editable menu controls */
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 10px;margin-bottom:6px;border-bottom:1px solid var(--g75)}
.side-top-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g300)}
.edit-toggle{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--g500);border:1px solid var(--g150);background:#fff;transition:.12s}
.edit-toggle svg{width:13px;height:13px}
.edit-toggle:hover{border-color:var(--green);color:var(--green-dd)}
.edit-toggle.on{background:var(--green-d);color:#fff;border-color:var(--green-d);box-shadow:0 3px 10px rgba(22,163,74,.28)}
.nav-head{cursor:pointer}
.nav-head .nh-label{flex:1;text-align:left}
.nh-actions,.ni-actions{display:inline-flex;gap:2px;margin-left:auto}
.nh-act,.ni-act{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--g400);transition:.12s;flex-shrink:0}
.nh-act svg,.ni-act svg{width:13px;height:13px}
.nh-act:hover,.ni-act:hover{background:var(--g100);color:var(--g700)}
.nh-act.del:hover,.ni-act.del:hover{background:var(--red-l);color:var(--red)}
.nh-lock{display:inline-grid;place-items:center;width:24px;height:24px;margin-left:auto;color:var(--g300);flex-shrink:0}
.nh-lock svg{width:13px;height:13px}
.nav-item-row{display:flex;align-items:center;gap:2px;padding-right:6px}
.nav-item-row .nav-item{flex:1;min-width:0}
.sidebar.edit .nav-item{padding-left:30px}
.sidebar.edit .nav-item.active::before{left:12px}
.ni-actions{opacity:0;transition:.12s}
.nav-item-row:hover .ni-actions,.sidebar.edit .ni-actions{opacity:1}
.nav-add{display:flex;align-items:center;gap:6px;width:calc(100% - 30px);margin:4px 0 6px 30px;padding:7px 10px;border-radius:7px;font-size:12px;font-weight:600;color:var(--green-dd);background:var(--green-ll);border:1px dashed #bfe9cf;transition:.12s}
.nav-add svg{width:13px;height:13px}
.nav-add:hover{background:var(--green-l)}
.nav-add-group{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:12px;padding:11px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--g500);background:#fff;border:1px dashed var(--g200);transition:.12s}
.nav-add-group svg{width:14px;height:14px}
.nav-add-group:hover{border-color:var(--green);color:var(--green-dd);background:var(--green-ll)}
.nav-dust{display:flex;align-items:center;gap:9px;width:100%;margin-top:14px;padding:10px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--g500);background:#fff;border:1px solid var(--g100);transition:.12s}
.nav-dust svg{width:16px;height:16px;color:var(--g400);flex-shrink:0}
.nav-dust span{flex:1;text-align:left}
.nav-dust:hover{border-color:transparent;background:var(--green-ll);color:var(--green-dd);box-shadow:inset 3px 0 0 0 var(--green-d)}
.nav-dust:hover svg{color:var(--green-d)}
.nav-dust.active{background:var(--green-l);color:var(--green-dd);border-color:transparent}
.nav-dust.active svg{color:var(--green-d)}
.dust-badge{font-size:10.5px;font-weight:700;font-family:var(--mono);color:#fff;background:var(--g400);padding:1px 8px;border-radius:20px}
.nav-dust.active .dust-badge{background:var(--green-d)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-sm svg{width:13px;height:13px}
.m-select{padding:12px 14px;border:1px solid var(--g150);border-radius:11px;background:#fff;outline:none;transition:.14s;width:100%;font-size:14px;cursor:pointer}
.m-select:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}
.m-select:disabled{background:var(--g50);color:var(--g400);cursor:not-allowed}

.main{flex:1;padding:26px 30px 60px;min-width:0;max-width:1560px}
.crumb{font-size:11.5px;color:var(--g400);margin-bottom:6px;font-weight:500}
.crumb b{color:var(--green-d)}
.page-head{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap;min-height:50px}
.page-head>div:first-child{flex:1 1 auto;min-width:0}
.page-title{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.page-desc{font-size:13px;color:var(--g400);margin-top:3px;max-width:760px}
.page-head .spacer{flex:1}
.page-head .scope-pill{flex-shrink:0;align-self:center}
.scope-pill{display:flex;align-items:center;gap:8px;padding:7px 13px;background:#fff;border:1px solid var(--g100);border-radius:30px;box-shadow:var(--shadow-sm);font-size:12.5px;font-weight:600}
.scope-pill img{width:22px;height:15px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.scope-pill small{color:var(--g400);font-weight:500}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--g300);width:15px;height:15px}
.search input{width:100%;padding:9px 12px 9px 33px;border:1px solid var(--g100);border-radius:10px;background:#fff;outline:none;transition:.15s}
.search input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}
.seg{display:inline-flex;background:var(--g75);border-radius:10px;padding:3px}
.seg button{padding:6px 14px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--g400);transition:.12s}
.seg button.on{background:#fff;color:var(--green-dd);box-shadow:var(--shadow-sm)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-size:13px;font-weight:600;transition:.14s;border:1px solid transparent}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--green-d);color:#fff;box-shadow:0 4px 12px rgba(22,163,74,.28)}
.btn-primary:hover{background:var(--green-dd);transform:translateY(-1px);box-shadow:0 6px 16px rgba(22,163,74,.34)}
.btn-ghost{background:#fff;border-color:var(--g100);color:var(--g600)}
.btn-ghost:hover{border-color:var(--g200);background:var(--g50)}
.btn-danger{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(220,38,38,.26)}
.btn-danger:hover{background:#b91c1c;transform:translateY(-1px);box-shadow:0 6px 16px rgba(220,38,38,.32)}
.modal-confirm{max-width:460px}
.confirm-msg{font-size:14px;color:var(--g600);line-height:1.55}

.card{background:#fff;border:1px solid var(--g100);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--g400);padding:10px 16px;background:var(--g50);border-bottom:1px solid var(--g100);white-space:nowrap}
tbody td{padding:10px 16px;border-bottom:1px solid var(--g75);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--green-ll)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.tag-fcl{background:var(--blue-l);color:var(--blue)}
.tag-lcl{background:var(--amber-l);color:var(--amber)}
.tag-flat{background:var(--g75);color:var(--g500)}
.tag-type{background:var(--green-l);color:var(--green-dd)}
.rates{display:flex;flex-wrap:wrap;gap:5px}
.rate-chip{font-family:var(--mono);font-size:11.5px;background:var(--g50);border:1px solid var(--g100);border-radius:6px;padding:2px 7px;white-space:nowrap}
.rate-chip b{color:var(--green-dd);font-weight:600}
.valid{font-size:11.5px;color:var(--g400);white-space:nowrap}
.valid b{color:var(--g600);font-weight:600}
.code-cell{font-family:var(--mono);font-weight:600;color:var(--green-dd)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.icon-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--g400);transition:.12s}
.icon-btn svg{width:15px;height:15px}
.icon-btn:hover{background:var(--g75);color:var(--g700)}
.icon-btn.del:hover{background:var(--red-l);color:var(--red)}
.note-text{font-size:12px;color:var(--g400);max-width:200px}
.empty{padding:60px 20px;text-align:center;color:var(--g300)}
.empty svg{width:42px;height:42px;margin-bottom:12px;opacity:.5}
.empty p{font-size:14px;font-weight:500;color:var(--g400)}
.empty span{font-size:12.5px}
.tbl-foot{padding:9px 16px;border-top:1px solid var(--g75);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--g400);gap:14px;flex-wrap:wrap}
.tbl-foot .pager{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbl-foot .psel{display:flex;align-items:center;gap:7px}
.tbl-foot .psel select{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--g600);border:1px solid var(--g150);border-radius:8px;padding:4px 8px;background:#fff;outline:none;cursor:pointer;transition:.14s}
.tbl-foot .psel select:hover{border-color:var(--green)}
.tbl-foot .psel select:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}
.pg-info{font-family:var(--mono);font-size:11.5px;color:var(--g400)}
.pg-nav{display:flex;gap:4px}
.pg-btn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;border:1px solid var(--g150);background:#fff;color:var(--g500);transition:.12s}
.pg-btn:hover:not(:disabled){border-color:var(--green);color:var(--green-dd);background:var(--green-ll)}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}
.pg-btn svg{width:14px;height:14px}
.callout{display:flex;gap:10px;align-items:flex-start;background:var(--amber-l);border:1px solid #f4dca8;border-radius:11px;padding:9px 13px;margin-bottom:10px;font-size:12.5px;color:#8a5a06;line-height:1.45}
.callout svg{width:17px;height:17px;flex-shrink:0;margin-top:1px;color:var(--amber)}
.callout.green{background:var(--green-ll);border-color:#bfe9cf;color:var(--green-dd)}
.callout.green svg{color:var(--green-d)}
.sel-col{width:38px;text-align:center;padding-left:14px!important}
table input.rsel,.sel-all input{width:16px;height:16px;cursor:pointer;accent-color:var(--green-d);margin:0;vertical-align:middle}
tr.row-sel{background:var(--green-ll)}
.bulk-tools{display:contents}
.btn[disabled],.btn:disabled{opacity:.45;cursor:not-allowed}
.th-sort{all:unset;display:inline-flex;align-items:center;gap:4px;cursor:pointer;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;user-select:none;border-radius:6px;padding:1px 3px;transition:.12s}
.th-sort:hover{color:var(--green-d)}
.th-sort.on{color:var(--green-dd)}
.th-ar{font-size:9px;line-height:1;color:var(--green-d)}
.th-idle{color:var(--g300);font-size:11px;font-weight:700;transition:.12s}
.th-sort:hover .th-idle{color:var(--green)}
.th-sort{position:relative}
.th-clock svg{width:13px;height:13px;vertical-align:middle}
.th-clock{color:var(--g300)}
.th-clock.on{color:var(--green-dd)}
.entered-cell{white-space:nowrap;font-family:var(--mono)}
.ts-date{display:block;font-size:12px;color:var(--g600);font-weight:600}
.ts-time{display:block;font-size:11px;color:var(--g400)}
.ts-na{color:var(--g300)}
.sort-status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--green-dd);background:var(--green-l);border:1px solid #bfe9cf;border-radius:99px;padding:4px 6px 4px 12px;font-weight:600}
.sort-status b{font-weight:700}
.sort-clear{all:unset;display:inline-flex;align-items:center;gap:3px;cursor:pointer;font-size:11px;font-weight:600;color:var(--green-d);background:#fff;border:1px solid #bfe9cf;border-radius:99px;padding:2px 9px 2px 7px}
.sort-clear:hover{background:var(--green-ll)}
.sort-clear svg{width:11px;height:11px}
.sort-hint{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--g400);font-weight:600;letter-spacing:.01em}
.bb-count{font-weight:700;font-size:13px;color:var(--green-dd);display:inline-flex;align-items:center;padding:0 4px 0 2px}
.btn.bb-del{background:#fdecec;color:#c0392b;border:1px solid #f3c4c0}
.btn.bb-del:hover{background:#f9dada}
.fx-rate{font-family:var(--mono);font-weight:600;color:var(--g700)}
.fx-base{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--green-dd);background:var(--green-l);border:1px solid #bfe9cf;padding:2px 8px;border-radius:99px}
.fx-sym{font-size:15px;font-weight:700;color:var(--g600)}
.fx-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--g400)}
.fx-dot{width:7px;height:7px;border-radius:99px;background:var(--green);display:inline-block}
.fx-datepick{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--g500);font-weight:600;background:#fff;border:1px solid var(--g150);border-radius:11px;padding:7px 12px}
.fx-datepick svg{width:15px;height:15px;color:var(--green-d)}
.fx-date{border:none;background:transparent;font-family:var(--mono);font-weight:600;font-size:12.5px;color:var(--g700);outline:none;cursor:pointer}
.fx-bar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--g150);border-radius:12px;padding:8px 10px 8px 14px;margin-bottom:12px}
.fx-bar-label{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--green-d);white-space:nowrap}
.fx-bar-label svg{width:14px;height:14px}
.fx-bar input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:var(--mono);font-size:13px;color:var(--g700)}
.fx-bar input::placeholder{color:var(--g300)}

.overlay{position:fixed;inset:0;background:rgba(20,28,24,.42);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.overlay.show{display:flex}
#modalHost{display:contents}
.modal{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:100%;max-width:680px;margin:auto;animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{max-width:960px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{padding:15px 28px 12px;border-bottom:1px solid var(--g100);display:flex;align-items:flex-start;gap:12px}
.modal-head h3{font-size:18px;font-weight:700;letter-spacing:-.02em}
.modal-head p{font-size:12.5px;color:var(--g400);margin-top:2px}
.modal-head .x{margin-left:auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--g400)}
.modal-head .x:hover{background:var(--g75);color:var(--g700)}
.modal-body{padding:15px 28px;max-height:80vh;overflow-y:auto}
.modal-foot{padding:12px 28px;border-top:1px solid var(--g100);display:flex;gap:10px;justify-content:flex-end;background:var(--g50);border-radius:0 0 var(--r-lg) var(--r-lg)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px 16px}
.fgrid.three{grid-template-columns:1fr 1fr 1fr}
.fgrid.four{grid-template-columns:1fr 1fr 1fr 1fr}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field.span2{grid-column:span 2}
.field label{font-size:11.5px;font-weight:600;color:var(--g500);letter-spacing:.01em}
.field label .req{color:var(--red);margin-left:3px}
.field input,.field select,.field textarea{padding:9px 13px;border:1px solid var(--g150);border-radius:11px;background:#fff;outline:none;transition:.14s;width:100%;font-size:14px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}
.field textarea{resize:vertical;min-height:46px}
.field .hint{font-size:10.5px;color:var(--g400)}
.field input[type=date]{cursor:pointer}
.field input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.55;width:18px}
/* ===== custom date picker (English / Gregorian, locale-independent) ===== */
.dp{position:relative}
.dp .dp-input{cursor:pointer;padding-right:40px;font-family:var(--mono);letter-spacing:.02em}
.dp .dp-input.editing{cursor:text;background:#fff;border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}
.dp-ico{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--g400);display:grid;place-items:center;cursor:pointer}
.dp-ico svg{width:18px;height:18px;display:block}
.dp .dp-input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}
.dp-pop{position:absolute;z-index:140;bottom:calc(100% + 6px);left:0;width:272px;background:#fff;border:1px solid var(--g150);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:12px;display:none}
.dp-pop.show{display:block}
.dp-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}
.dp-title{font-weight:700;font-size:13.5px;color:var(--g700);font-family:var(--sans);padding:6px 12px;border-radius:8px;transition:.12s}
.dp-title:hover{background:var(--green-ll);color:var(--green-dd)}
.dp-grid-my{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:2px}
.dp-my-cell{height:46px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:500;color:var(--g600);background:#fff;border:1px solid var(--g75);transition:.12s;font-family:var(--sans);cursor:pointer}
.dp-my-cell:hover{background:var(--green-l);color:var(--green-dd);border-color:transparent}
.dp-my-cell.sel{background:var(--green-d);color:#fff;font-weight:600;border-color:transparent}
.dp-my-cell.sel:hover{background:var(--green-dd);color:#fff}
.dp-my-cell.today{box-shadow:inset 0 0 0 1.5px var(--green)}
.dp-nav{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--g500);border:1px solid var(--g100);background:#fff;transition:.14s}
.dp-nav:hover{border-color:var(--green);color:var(--green-dd);background:var(--green-ll)}
.dp-nav svg{width:15px;height:15px}
.dp-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.dp-dow span{text-align:center;font-size:10px;font-weight:600;color:var(--g400);font-family:var(--mono);padding:4px 0;text-transform:uppercase;letter-spacing:.03em}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;align-content:start;grid-auto-rows:32px}
.dp-cell{height:32px;border-radius:8px;display:grid;place-items:center;font-size:12.5px;color:var(--g600);background:#fff;transition:.12s;font-family:var(--mono);cursor:pointer}
.dp-cell:hover{background:var(--green-l);color:var(--green-dd)}
.dp-cell.sel{background:var(--green-d);color:#fff;font-weight:600}
.dp-cell.sel:hover{background:var(--green-dd);color:#fff}
.dp-cell.today{box-shadow:inset 0 0 0 1.5px var(--green)}
.dp-cell.empty{visibility:hidden;pointer-events:none}
.dp-cell.off{color:var(--g200);background:var(--g50);cursor:not-allowed;pointer-events:none;opacity:.55;text-decoration:line-through;text-decoration-thickness:1px}
.dp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--g75)}
.dp-foot button{font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:8px;font-family:var(--sans);transition:.12s}
.dp-clear{color:var(--g500)}.dp-clear:hover{color:var(--red);background:var(--red-l)}
.dp-now{color:var(--green-dd)}.dp-now:hover{background:var(--green-l)}
.modal-section{margin-top:13px;padding-top:12px;border-top:1px dashed var(--g100)}
.modal-section:first-child{margin-top:0;padding-top:0;border-top:none}
.modal-section h4{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green-d);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.modal-section h4 svg{width:14px;height:14px}
.rate-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.rate-input{display:flex;flex-direction:column;gap:4px}
.rate-input label{font-size:11px;font-weight:600;color:var(--g400);font-family:var(--mono)}
.rate-input .wrap{position:relative}
.rate-input .cur{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--g300);font-family:var(--mono);font-weight:600}
.rate-input input{padding:9px 13px 9px 34px;border:1px solid var(--g150);border-radius:11px;background:#fff;outline:none;font-family:var(--mono);font-weight:500;width:100%;transition:.14s}
.rate-input input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}
.mode-toggle{display:inline-flex;background:var(--g75);border-radius:10px;padding:3px;margin-bottom:10px}
.tick-group{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.tick-opt{display:flex;align-items:center;gap:11px;flex:1;min-width:210px;padding:9px 13px;border:1.5px solid var(--g150);border-radius:11px;background:#fff;cursor:pointer;transition:.14s;text-align:left}
.tick-opt:hover{border-color:var(--green);background:var(--green-ll)}
.tick-opt.on{border-color:var(--green-d);background:var(--green-l);box-shadow:0 0 0 3px var(--green-l)}
.tick-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--g200);display:grid;place-items:center;flex-shrink:0;transition:.14s;color:#fff}
.tick-opt.on .tick-box{background:var(--green-d);border-color:var(--green-d)}
.tick-box svg{width:12px;height:12px;opacity:0;transition:.12s}
.tick-opt.on .tick-box svg{opacity:1}
.tk-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.tk-title{font-size:13px;font-weight:600;color:var(--g700)}
.tk-sub{font-size:11px;color:var(--g400)}
.mode-toggle button{padding:7px 20px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--g400)}
.mode-toggle button.on{background:#fff;box-shadow:var(--shadow-sm)}
.mode-toggle button.on[data-m=FCL]{color:var(--blue)}
.mode-toggle button.on[data-m=LCL]{color:var(--amber)}

.ac{position:relative}
.ac-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--g150);border-radius:11px;box-shadow:var(--shadow-lg);max-height:240px;overflow-y:auto;z-index:10;display:none}
.ac-list.show{display:block}
.ac-item{padding:8px 13px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--g75)}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:var(--green-l)}
.ac-item .ac-zip{font-family:var(--mono);font-weight:600;color:var(--green-dd);font-size:12.5px}
.ac-item .ac-name{font-size:12px;color:var(--g500);text-align:right}
.ac-empty{padding:12px;font-size:12px;color:var(--g300);text-align:center}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--g700);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);z-index:200;opacity:0;transition:.3s;display:flex;align-items:center;gap:9px;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast svg{width:17px;height:17px;color:var(--green);flex-shrink:0}
.toast.warn svg{color:#fbbf24}

@media(max-width:920px){.sidebar{display:none}.main{padding:20px 16px}.rate-grid{grid-template-columns:repeat(2,1fr)}.fgrid,.fgrid.three,.fgrid.four{grid-template-columns:1fr 1fr}}
</style>
</head>

let TRASH=[];
const TRASH_KEY='shoptrans_pricing_trash_v1';
function loadTrash(){try{const r=localStorage.getItem(TRASH_KEY);TRASH=r?JSON.parse(r):[];}catch(e){TRASH=[];}if(!Array.isArray(TRASH))TRASH=[];}
function persistTrash(){try{localStorage.setItem(TRASH_KEY,JSON.stringify(TRASH));}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o));}
function pushTrash(entry){entry.tid='t'+uid().slice(1);entry.deletedAt=new Date().toISOString();TRASH.unshift(entry);persistTrash();}
function recLabel(r){
  if(!r)return 'record';
  if(r.code)return r.code+(r.name?' · '+r.name:'');
  if(r.zip&&r.prov)return r.zip+' · '+r.prov;
  if(r.pol)return r.pol+' → '+(r.pod||'');
  if(r.port)return r.port+(r.zip?' · '+r.zip:'');
  if(r.feeType)return r.feeType+(r.mode?' · '+r.mode:'');
  if(r.scope)return r.scope+(r.mode?' · '+r.mode:'');
  return (r.mode||'rate')+(r.unit?' /'+r.unit:'');
}
function fmtWhen(iso){try{const d=new Date(iso);return d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}}

function restoreTrash(tid){
  const i=TRASH.findIndex(t=>t.tid===tid);if(i<0)return;const e=TRASH[i];
  if(e.type==='record'){
    if(!PAGES[e.page]){toast('Parent item no longer exists — restore it first',true);return;}
    if(!DB[e.country])DB[e.country]={};if(!DB[e.country][e.page])DB[e.country][e.page]=[];
    DB[e.country][e.page].push(clone(e.payload));persist();
  }else if(e.type==='item'){
    const pid=e.page;PAGES[pid]=clone(e.config);
    let g=NAV.find(x=>x.id===e.group)||NAV[0];if(!g){toast('No category to restore into',true);return;}
    if(!findNavItem(pid))g.items.push({id:pid,label:e.label});
    COUNTRIES.forEach(c=>{if(!DB[c.id])DB[c.id]={};DB[c.id][pid]=clone((e.data&&e.data[c.id])||[]);});
    persistMeta();persist();
  }else if(e.type==='group'){
    const G=clone(e.group);
    if(!NAV.find(x=>x.id===G.id))NAV.push(G);else NAV.find(x=>x.id===G.id).items=G.items;
    Object.keys(e.pages).forEach(pid=>PAGES[pid]=clone(e.pages[pid]));
    COUNTRIES.forEach(c=>{if(!DB[c.id])DB[c.id]={};Object.keys((e.data&&e.data[c.id])||{}).forEach(pid=>DB[c.id][pid]=clone(e.data[c.id][pid]));});
    persistMeta();persist();
  }
  TRASH.splice(i,1);persistTrash();renderAll();toast('Restored');
}
function purgeTrash(tid){const i=TRASH.findIndex(t=>t.tid===tid);if(i<0)return;const e=TRASH[i];
  confirmModal({title:'Delete permanently?',message:`“${esc(e.label||'this entry')}” will be permanently removed from the Dustbin. This cannot be undone.`,confirmLabel:'Delete forever',onConfirm:()=>{
    const j=TRASH.findIndex(t=>t.tid===tid);if(j>=0)TRASH.splice(j,1);persistTrash();renderAll();toast('Permanently deleted',true);}});}
function emptyTrash(){if(!TRASH.length)return;
  confirmModal({title:'Empty the Dustbin?',message:`All ${TRASH.length} item(s) in the Dustbin will be permanently deleted. This cannot be undone.`,confirmLabel:'Empty dustbin',onConfirm:()=>{
    TRASH=[];persistTrash();renderAll();toast('Dustbin emptied',true);}});}

function fmt6(v){const n=Number(v);if(!isFinite(n))return'—';return n>=100?n.toLocaleString('en-US',{maximumFractionDigits:2}):n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:6});}

function delFx(code){const c=META.currencies.find(x=>x.code===code);if(!c||c.base)return;
  const used=fxUsageCount(code);
  confirmModal({title:'Delete currency?',message:`“${esc(code)}” will be removed from the currency list.${used?` It is currently used by <b>${used}</b> rate record(s); those keep their stored code but it will no longer appear as an option.`:''}`,confirmLabel:'Delete currency',onConfirm:()=>{
    META.currencies=META.currencies.filter(x=>x.code!==code);persistMeta();renderAll();toast('Currency deleted',true);}});}
function fxUsageCount(code){let n=0;Object.keys(DB).forEach(cn=>Object.keys(DB[cn]||{}).forEach(p=>{(DB[cn][p]||[]).forEach(r=>{if(r&&r.cur===code)n++;});}));return n;}
function parseFxJson(d){
  if(!d||typeof d!=='object')return null;
  let rates=d.rates||d.conversion_rates||d.data||d.quotes||null;
  if(!rates||typeof rates!=='object')return null;
  const out={};Object.keys(rates).forEach(k=>{const code=k.length===6&&k.slice(0,3)==='USD'?k.slice(3):k;const v=Number(rates[k]);if(isFinite(v))out[code]=v;});
  if(out.USD&&out.USD!==1){const u=out.USD;Object.keys(out).forEach(k=>out[k]=out[k]/u);}
  return out;
}
function fetchRates(){
  const url=(META.fxSource||'').trim();
  if(!url){toast('Enter a source link first',true);return;}
  if(!/^https?:\/\//i.test(url)){toast('Source must be a valid http(s) link',true);return;}
  const btn=document.getElementById('fxFetchBtn');if(btn){btn.disabled=true;btn.style.opacity='.6';btn.innerHTML=I.refresh+' Fetching…';}
  fetch(url).then(r=>r.json()).then(d=>{
    const rates=parseFxJson(d);if(!rates||!Object.keys(rates).length)throw new Error('bad');
    let upd=0,miss=[];META.currencies.forEach(c=>{if(c.base){c.rate=1;return;}const v=rates[c.code];if(v!=null&&isFinite(v)){c.rate=v;upd++;}else miss.push(c.code);});
    META.fxUpdated=new Date().toISOString();state.fxDate=fxToday();snapshotFx();persistMeta();renderAll();
    toast(`Rates saved for ${fxToday()} · ${upd} updated${miss.length?' · no data for '+miss.join(', '):''}`);
  }).catch(()=>{
    if(btn){btn.disabled=false;btn.style.opacity='';btn.innerHTML=I.refresh+' Fetch &amp; save today';}
    toast('Could not fetch from that source — check the link/connection, or edit rates manually',true);
  });
}

function sortRows(arr,def){const s=state.sort;if(!s||s.col==null)return arr;
  const order=new Map(rows().map((r,i)=>[r.id,i]));let getter,num;
  if(s.col==='ts'){getter=r=>(r.ts!=null?r.ts:order.get(r.id));num=true;}
  else{const d=sortDefs(def)[s.col];if(!d)return arr;getter=d.get;num=d.num;}
  const dir=s.dir;return arr.slice().sort((x,y)=>{
    let vx=getter(x),vy=getter(y);const ex=(vx==null||vx===''),ey=(vy==null||vy==='');
    if(ex&&ey)return order.get(x.id)-order.get(y.id);

  }

    const defs=sortDefs(def);const nc=head.length-1;const labels=head.slice(0,nc);

    head=[selAllInner(),...cols,enteredTh,''];
    body=body.map((tr,i)=>{const r=view[i];
      const t2=tr.replace('<td>'+actions(r.id)+'</td>',enteredCell(r)+'<td>'+actions(r.id)+'</td>');
      return t2.replace('<tr>',`<tr class="${state.selected.has(r.id)?'row-sel':''}">`+selCell(r.id));});
    const s=state.sort;

      sortStatus=`<span class="sort-status">Sorted by <b>${esc(lbl)}</b> · ${s.dir>0?'ascending ▲':'descending ▼'}<button class="sort-clear" onclick="clearSort()">${I.x}clear</button></span>`;}
    else sortStatus=`<span class="sort-hint">⇅ Click a column header to sort</span>`;
  }
  if(!total)return emptyState();
  const ps2=state.pageSize;
  const sizeOpts=[10,25,50,100].map(n=>`<option value="${n}" ${ps2===n?'selected':''}>${n}</option>`).join('')+`<option value="all" ${ps2==='all'?'selected':''}>All</option>`;
  const showFrom=ps2==='all'?1:start+1, showTo=ps2==='all'?total:end;
  const chevL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
  const chevR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
  const nav=ps2==='all'?'':`<div class="pg-nav">
      <button class="pg-btn" ${state.pageIndex<=0?'disabled':''} onclick="gotoPage(${state.pageIndex-1})" title="Previous">${chevL}</button>
      <button class="pg-btn" ${state.pageIndex>=pageCount-1?'disabled':''} onclick="gotoPage(${state.pageIndex+1})" title="Next">${chevR}</button>
    </div>`;
  return `<div class="tbl-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body.join('')}</tbody></table></div>
    <div class="tbl-foot">

        <span class="pg-info">${showFrom}–${showTo} of ${total}${ps2==='all'?'':` · page ${state.pageIndex+1}/${pageCount}`}</span>
        ${nav}
      </div>
    </div>`;
}

/* ===== Custom date picker — always English month/weekday names + Gregorian, value stored as ISO yyyy-mm-dd (locale-independent) ===== */
const DP={
  MON:['January','February','March','April','May','June','July','August','September','October','November','December'],
  DOW:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],   /* ISO week start = Monday */
  CHEVL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
  CHEVR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
  id:null,y:0,m:0,view:'days',decadeStart:0
};
function dpPad(n){return n<10?'0'+n:''+n}
function dpClose(){document.querySelectorAll('.dp-pop.show').forEach(p=>{p.classList.remove('show');p.style.left='';p.style.right=''});DP.id=null}
function dpOpen(id){
  const _inp=document.getElementById(id);if(_inp&&!_inp.readOnly)dpCommit(id);
  if(DP.id===id){dpClose();return}
  if(id==='f_to'){const f=document.getElementById('f_from');if(_inp)_inp.dataset.dpmin=(f&&f.value)?f.value:'';}
  if(id==='f_from'){const tEl=document.getElementById('f_to');if(_inp)_inp.dataset.dpmax=(tEl&&tEl.value)?tEl.value:'';}
  dpClose();DP.id=id;
  const inp=document.getElementById(id);const v=(inp.value||'').trim();let d=new Date();
  const mt=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);if(mt)d=new Date(+mt[1],+mt[2]-1,+mt[3]);
  DP.y=d.getFullYear();DP.m=d.getMonth();DP.view='days';
  dpRender();
  const pop=document.getElementById(id+'_pop');pop.classList.add('show');
  const r=pop.getBoundingClientRect();
  if(r.right>window.innerWidth-8){pop.style.left='auto';pop.style.right='0'}
}
function dpShift(n){
  if(DP.view==='months'){DP.y+=n;}
  else if(DP.view==='years'){DP.decadeStart+=n*12;}
  else{DP.m+=n;if(DP.m<0){DP.m=11;DP.y--}else if(DP.m>11){DP.m=0;DP.y++}}
  dpRender();
}
function dpToMonths(){DP.view='months';dpRender();}
function dpToYears(){DP.decadeStart=DP.y-((DP.y%12+12)%12);DP.view='years';dpRender();}
function dpPickMonth(m){DP.m=m;DP.view='days';dpRender();}
function dpPickYear(y){DP.y=y;DP.view='months';dpRender();}
function dpRender(){
  const pop=document.getElementById(DP.id+'_pop');if(!pop)return;
  const sel=((document.getElementById(DP.id)||{}).value||'').trim();
  const smt=/^(\d{4})-(\d{2})-(\d{2})$/.exec(sel);
  const selY=smt?+smt[1]:null,selM=smt?+smt[2]-1:null;
  const t=new Date();const tY=t.getFullYear(),tM=t.getMonth();
  const tIso=tY+'-'+dpPad(tM+1)+'-'+dpPad(t.getDate());

  if(DP.view==='months'){
    let cells='';for(let i=0;i<12;i++){
      let c='dp-my-cell';if(DP.y===selY&&i===selM)c+=' sel';if(DP.y===tY&&i===tM)c+=' today';
      cells+=`<div class="${c}" onclick="dpPickMonth(${i})">${DP.MON[i].slice(0,3)}</div>`;
    }
    pop.innerHTML=`
     <div class="dp-head">
       <button type="button" class="dp-nav" onclick="dpShift(-1)">${DP.CHEVL}</button>
       <button type="button" class="dp-title" onclick="dpToYears()">${DP.y}</button>
       <button type="button" class="dp-nav" onclick="dpShift(1)">${DP.CHEVR}</button>
     </div>
     <div class="dp-grid-my">${cells}</div>`;
    return;
  }
  if(DP.view==='years'){
    const start=DP.decadeStart;let cells='';
    for(let i=0;i<12;i++){const y=start+i;let c='dp-my-cell';if(y===selY)c+=' sel';if(y===tY)c+=' today';
      cells+=`<div class="${c}" onclick="dpPickYear(${y})">${y}</div>`;}
    pop.innerHTML=`
     <div class="dp-head">
       <button type="button" class="dp-nav" onclick="dpShift(-1)">${DP.CHEVL}</button>
       <div class="dp-title">${start} – ${start+11}</div>
       <button type="button" class="dp-nav" onclick="dpShift(1)">${DP.CHEVR}</button>
     </div>
     <div class="dp-grid-my">${cells}</div>`;
    return;
  }

  const inpEl=document.getElementById(DP.id)||{};const dmin=(inpEl.dataset&&inpEl.dataset.dpmin)||'';const dmax=(inpEl.dataset&&inpEl.dataset.dpmax)||'';
  const lead=(new Date(DP.y,DP.m,1).getDay()+6)%7;          /* shift so Monday=0 */
  const days=new Date(DP.y,DP.m+1,0).getDate();
  let cells='';
  for(let d=1;d<=days;d++){
    const iso=DP.y+'-'+dpPad(DP.m+1)+'-'+dpPad(d);
    const off=(dmin&&iso<dmin)||(dmax&&iso>dmax);
    let c='dp-cell';if(iso===sel)c+=' sel';if(iso===tIso)c+=' today';if(off)c+=' off';
    const st=d===1?` style="grid-column:${lead+1}"`:'';
    cells+=off?`<div class="${c}"${st}>${d}</div>`:`<div class="${c}"${st} onclick="dpPick('${iso}')">${d}</div>`;
  }
  pop.innerHTML=`
   <div class="dp-head">
     <button type="button" class="dp-nav" onclick="dpShift(-1)">${DP.CHEVL}</button>
     <button type="button" class="dp-title" onclick="dpToMonths()">${DP.MON[DP.m]} ${DP.y}</button>
     <button type="button" class="dp-nav" onclick="dpShift(1)">${DP.CHEVR}</button>
   </div>
   <div class="dp-dow">${DP.DOW.map(x=>`<span>${x}</span>`).join('')}</div>
   <div class="dp-grid">${cells}</div>
   <div class="dp-foot">
     <button type="button" class="dp-clear" onclick="dpClear()">Clear</button>
     <button type="button" class="dp-now" onclick="dpPick('${tIso}')">Today</button>
   </div>`;
}
/* ===== manual typing (double-click) ===== */
function dpEdit(id){
  dpClose();
  const inp=document.getElementById(id);if(!inp)return;
  inp.dataset.prev=inp.value;
  inp.readOnly=false;inp.classList.add('editing');
  inp.focus();inp.select();
}
function dpNormalize(s){
  s=(s||'').trim();if(s==='')return '';
  let m=/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/.exec(s);          /* yyyy-mm-dd */
  if(!m){const d=/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/.exec(s); /* dd-mm-yyyy (year last = day first) */
    if(d)m=[null,d[3],d[2],d[1]];}
  if(!m)return null;
  const y=+m[1],mo=+m[2],dd=+m[3];
  if(mo<1||mo>12||dd<1||dd>31)return null;
  const dt=new Date(y,mo-1,dd);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==dd)return null;
  return y+'-'+dpPad(mo)+'-'+dpPad(dd);
}
function dpCommit(id){
  const inp=document.getElementById(id);if(!inp||inp.readOnly)return;
  const norm=dpNormalize(inp.value);
  const mn=inp.dataset.dpmin||'',mx=inp.dataset.dpmax||'';
  if(norm===null){inp.value=inp.dataset.prev||'';toast('Invalid date — use yyyy-mm-dd',true);}
  else if(norm!==''&&((mn&&norm<mn)||(mx&&norm>mx))){inp.value=inp.dataset.prev||'';toast('Date is outside the allowed range',true);}
  else inp.value=norm;
  inp.readOnly=true;inp.classList.remove('editing');delete inp.dataset.prev;
}
function dpKey(e,id){
  if(e.key==='Enter'){e.preventDefault();document.getElementById(id).blur();}
  else if(e.key==='Escape'){const inp=document.getElementById(id);inp.value=inp.dataset.prev||'';inp.blur();}
}
function dpPick(iso){
  const inp=document.getElementById(DP.id);
  if(inp&&inp.dataset){const mn=inp.dataset.dpmin||'',mx=inp.dataset.dpmax||'';
    if((mn&&iso<mn)||(mx&&iso>mx)){toast('Date is outside the allowed range',true);return;}}
  if(inp)inp.value=iso;dpClose();
}
function dpClear(){const inp=document.getElementById(DP.id);if(inp)inp.value='';dpClose()}

/* ===== numeric input guards: block impossible values (negatives, exponent, decimals on integers) ===== */
document.addEventListener('keydown',function(e){
  const t=e.target;if(!t||t.tagName!=='INPUT'||!t.dataset||!t.dataset.num)return;
  if(['e','E','+','-'].includes(e.key))e.preventDefault();
  if(t.dataset.num==='int'&&(e.key==='.'||e.key===','))e.preventDefault();
});
document.addEventListener('input',function(e){
  const t=e.target;const kind=t&&t.dataset&&t.dataset.num;if(!kind)return;
  let v=t.value;
  if(kind==='int'){v=v.replace(/[^\d]/g,'');}
  else{v=v.replace(/[^\d.]/g,'');const i=v.indexOf('.');if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,'');}
  if(v!==t.value)t.value=v;
},true);

    <div class="field span2"><label>Item name<span class="req">*</span></label><input id="m_iname" value="${navItem?esc(navItem.label):''}" placeholder="e.g. Quarantine Fee" autocomplete="off"></div>

  <div id="m_typeopts"></div>`;
  metaModal(pageId?'Edit item':'Add item',pageId?'Update name, category, description & options':'Create a new fee / item',body,()=>saveItem(pageId));
  itemTypeOpts(p);}
function itemTypeOpts(p){
  const t=document.getElementById('m_itype').value;const host=document.getElementById('m_typeopts');let h='';
  if(t==='fee'){const fee=p&&p.kind==='fee';
    h=`<div class="modal-section"><h4>${I.box} Standard fee options</h4><div class="fgrid">
      <div class="field"><label>LCL unit</label><input id="m_lclunit" value="${fee?(p.lclUnit==null?'':esc(p.lclUnit)):'set'}" placeholder="set / W/M / tons — leave blank for FCL only"><span class="hint">Blank = FCL only (no LCL row).</span></div>
      <div class="field"><label>Behaviour</label>
        <label style="display:flex;align-items:center;gap:8px;font-weight:500;color:var(--g600)"><input type="checkbox" id="m_scope" ${(fee?p.scope:true)?'checked':''} style="width:auto;flex:none"> Port / scope selector</label>
        <label style="display:flex;align-items:center;gap:8px;font-weight:500;color:var(--g600);margin-top:6px"><input type="checkbox" id="m_inspect" ${fee&&p.inspect?'checked':''} style="width:auto;flex:none"> Inspection note column</label></div>
    </div></div>`;
  }else if(t==='flat'){const fl=p&&p.kind==='flat';
    h=`<div class="modal-section"><h4>${I.tag} Flat fee options</h4><div class="fgrid"><div class="field"><label>Charging unit<span class="req">*</span></label><input id="m_flatunit" value="${fl?esc(p.flatUnit||''):'B/L'}" placeholder="B/L / SET"></div></div></div>`;
  }else if(t==='localcharge'){
    h=`<div class="hint" style="margin-top:6px;color:var(--g400)">A flexible “Other fee…” set is created — you can record FCL or LCL (W/M) entries with custom names from the entry form.</div>`;
  }else{
    h=`<div class="hint" style="margin-top:6px;color:var(--g400)">Fixed structure — no extra options.</div>`;
  }

function saveItem(pageId){
  const name=document.getElementById('m_iname').value.trim();if(!name){toast('Enter an item name',true);return;}
  const groupId=document.getElementById('m_igroup').value;const desc=document.getElementById('m_idesc').value.trim();
  if(pageId){
    const p=PAGES[pageId];const oldGroup=p.group;
    p.title=name;p.desc=desc;p.group=groupId;
    if(p.kind==='fee'){const u=document.getElementById('m_lclunit').value.trim();p.lclUnit=u===''?null:u;
      if(document.getElementById('m_scope').checked)p.scope='port';else delete p.scope;
      if(document.getElementById('m_inspect').checked)p.inspect=true;else delete p.inspect;}
    if(p.kind==='flat')p.flatUnit=document.getElementById('m_flatunit').value.trim()||'unit';
    const item=findNavItem(pageId);item.label=name;
    if(oldGroup!==groupId){removeNavItem(pageId);NAV.find(g=>g.id===groupId).items.push(item);}
    persistMeta();closeForm();state.page=pageId;renderAll();toast('Item updated');return;
  }
  const type=document.getElementById('m_itype').value;const pid='p_'+uid().slice(1);
  const cfg={kind:type,title:name,desc:desc,group:groupId,validity:true};
  if(type==='fee'){const u=document.getElementById('m_lclunit').value.trim();cfg.fcl=true;cfg.lclUnit=u===''?null:u;
    if(document.getElementById('m_scope').checked)cfg.scope='port';
    if(document.getElementById('m_inspect').checked)cfg.inspect=true;}
  if(type==='flat')cfg.flatUnit=document.getElementById('m_flatunit').value.trim()||'unit';
  if(type==='localcharge')cfg.lcset=[{v:'Other',label:'Other fee…',fcl:true,lclUnit:'W/M',free:true}];
  PAGES[pid]=cfg;NAV.find(g=>g.id===groupId).items.push({id:pid,label:name});
  ensureDB();persistMeta();persist();closeForm();state.page=pid;state.pageIndex=0;state.editMenu=false;renderAll();toast('Item added');}
function delItem(pid){const it=findNavItem(pid);if(!it)return;
  confirmModal({title:'Move item to Dustbin?',message:`“${esc(it.label)}” and its data in every country will be moved to the Dustbin. You can restore it later.`,confirmLabel:'Move to Dustbin',onConfirm:()=>{
    const data={};COUNTRIES.forEach(c=>{data[c.id]=clone((DB[c.id]&&DB[c.id][pid])||[]);});
    pushTrash({type:'item',page:pid,label:it.label,group:PAGES[pid]?PAGES[pid].group:null,config:clone(PAGES[pid]),data:data});
    removeNavItem(pid);delete PAGES[pid];COUNTRIES.forEach(c=>{if(DB[c.id])delete DB[c.id][pid];});
    if(state.page===pid)state.page=firstPage();
    persistMeta();persist();renderAll();toast('Moved to Dustbin');}});}

    <div class="modal-body">${body}</div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeForm()">Cancel</button><button class="btn btn-primary" onclick="${saveFn||'saveForm()'}">${I.check} Save</button></div></div>`;}

/* ===== save ===== */
function gv(id){const e=document.getElementById(id);return e?e.value.trim():''}
function gnum(id){const v=gv(id);return v===''?null:Number(v)}
function collectFCL(){const o={};CONTAINERS.forEach(k=>{const v=gnum('r_'+k);if(v!=null)o[k]=v;});return o;}
function collectTruck(){const o={};TRUCKS.forEach(([k])=>{const v=gnum('r_'+k);if(v!=null)o[k]=v;});return o;}
function saveForm(){
  const def=PAGES[state.page];const list=rows();let r={};let ok=true;
  const need=(v,msg)=>{if(!v){toast(msg,true);ok=false;}return v;};
  switch(def.kind){
    case 'master-ports':need(gv('f_code'),'Enter UN/LOCODE');need(gv('f_name'),'Enter port name');
      r={code:gv('f_code').toUpperCase(),name:gv('f_name'),city:gv('f_city')};break;
    case 'master-cfs':need(gv('f_code'),'Enter CFS code');need(gv('f_name'),'Enter warehouse name');
      r={code:gv('f_code').toUpperCase(),name:gv('f_name'),addr:gv('f_addr'),port:gv('f_port')};break;
    case 'master-admin':need(gv('f_prov'),'Enter province');need(gv('f_dist'),'Enter district');need(gv('f_zip'),'Enter postal code');
      r={prov:gv('f_prov'),dist:gv('f_dist'),ward:gv('f_ward'),zip:gv('f_zip')};break;
    case 'fee':r={mode:def.lclUnit===null?'FCL':currentMode,cur:gv('f_cur')};
      if(def.scope){if(scopeMode==='port'){r.scope=parseCode(gv('f_scope'));need(r.scope,'Select a port / CFS, or switch to “Apply to all ports”');}else r.scope='';}if(def.feeTypes)r.feeType=gv('f_feeType');
      if(r.mode==='FCL'){r.r=collectFCL();need(Object.keys(r.r).length,'Enter at least 1 container rate');}
      else{r.r={val:gnum('r_val')};r.unit=def.lclUnit;need(r.r.val!=null,'Enter LCL unit price');}
      if(def.inspect)r.note=gv('f_note');r.from=gv('f_from');r.to=gv('f_to');break;
    case 'trucking':need(gv('f_port'),'Select port/CFS');need(gv('f_zip'),'Enter/select postal code');
      r={port:parseCode(gv('f_port')),zip:gv('f_zip'),adm:gv('f_adm'),mode:currentMode,cur:gv('f_cur')};
      if(currentMode==='FCL'){r.r=collectFCL();need(Object.keys(r.r).length,'Enter container rate');}
      else{r.r=collectTruck();need(Object.keys(r.r).length,'Enter rate per truck type');}
      r.from=gv('f_from');r.to=gv('f_to');break;
    case 'ocean':need(gv('f_pol'),'Select POL');need(gv('f_pod'),'Enter POD');
      r={pol:parseCode(gv('f_pol')).toUpperCase(),pod:gv('f_pod').toUpperCase(),carrier:gv('f_carrier'),mode:currentMode,cur:gv('f_cur'),etd:gv('f_etd'),transit:gv('f_transit'),via:gv('f_via'),ftO:gv('f_ftO'),ftD:gv('f_ftD')};
      if(currentMode==='FCL'){r.r=collectFCL();need(Object.keys(r.r).length,'Enter container freight');}
      else{r.r={val:gnum('r_val')};r.unit='set';need(r.r.val!=null,'Enter LCL freight');}
      r.from=gv('f_from');r.to=gv('f_to');break;
    case 'localcharge':{const t=lcDescriptor(def,gv('f_feeType'));need(gv('f_feeType'),'Enter fee type');r={feeType:gv('f_feeType'),cur:gv('f_cur')};
      if(t.flatUnit){r.mode='FLAT';r.unit=t.flatUnit;r.r={val:gnum('r_val')};need(r.r.val!=null,'Enter rate');}
      else if(currentMode==='FCL'){r.mode='FCL';r.r=collectFCL();need(Object.keys(r.r).length,'Enter container rate');}
      else{r.mode='LCL';r.unit=t.lclUnit;r.r={val:gnum('r_val')};need(r.r.val!=null,'Enter LCL unit price');}
      r.from=gv('f_from');r.to=gv('f_to');break;}
    case 'flat':r={mode:'FLAT',unit:def.flatUnit,cur:gv('f_cur'),r:{val:gnum('r_val')}};need(r.r.val!=null,'Enter rate');r.from=gv('f_from');r.to=gv('f_to');break;
  }
  if(r.r){const vals=(r.r.val!=null)?[r.r.val]:Object.values(r.r);
    if(vals.some(v=>v!=null&&!(Number(v)>0))){toast('Rates must be greater than 0',true);ok=false;}}
  if(r.from&&r.to&&r.to<r.from){toast('“Valid to” cannot be earlier than “Valid from”',true);ok=false;}
  if(!ok)return;
  if(editId){const i=list.findIndex(x=>x.id===editId);const old=list[i]||{};list[i]=Object.assign({id:editId,ts:old.ts},r);toast('Record updated');}
  else{list.push(Object.assign({id:uid(),ts:nowTs()},r));toast('New record added');}
  persist();closeForm();renderAll();
}
function delRow(id){const list=rows();const i=list.findIndex(x=>x.id===id);if(i<0)return;
  const r=list[i];const def=PAGES[state.page];
  confirmModal({title:'Move to Dustbin?',message:`“${esc(recLabel(r))}” will be moved to the Dustbin. You can restore it later.`,confirmLabel:'Move to Dustbin',onConfirm:()=>{
    const lst=rows();const j=lst.findIndex(x=>x.id===id);if(j<0)return;
    pushTrash({type:'record',country:state.country,page:state.page,pageTitle:def?def.title:state.page,label:recLabel(r),payload:clone(r)});
    lst.splice(j,1);persist();renderAll();toast('Moved to Dustbin');}});}

/* ===== EXCEL import / template ===== */
function excelCols(def){
  const rateFCL=CONTAINERS.map(k=>({k,h:k}));
  const truckCols=TRUCKS.map(([k])=>({k,h:k}));
  switch(def.kind){
    case 'master-ports':return [{k:'code',h:'code'},{k:'name',h:'name'},{k:'city',h:'city'}];
    case 'master-cfs':return [{k:'code',h:'code'},{k:'name',h:'name'},{k:'addr',h:'address'},{k:'port',h:'linked_port'}];
    case 'master-admin':return [{k:'prov',h:'province'},{k:'dist',h:'district'},{k:'ward',h:'ward'},{k:'zip',h:'zipcode'}];
    case 'fee':return [...(def.feeTypes?[{k:'feeType',h:'fee_type'}]:[]),...(def.scope?[{k:'scope',h:'scope_code'}]:[]),{k:'mode',h:'mode'},...rateFCL,{k:'val',h:'lcl_value'},{k:'unit',h:'unit'},{k:'cur',h:'currency'},...(def.inspect?[{k:'note',h:'note'}]:[]),{k:'from',h:'valid_from'},{k:'to',h:'valid_to'}];
    case 'trucking':return [{k:'port',h:'port_or_cfs_code'},{k:'zip',h:'zipcode'},{k:'adm',h:'admin_unit'},{k:'mode',h:'mode'},...rateFCL,...truckCols,{k:'cur',h:'currency'},{k:'from',h:'valid_from'},{k:'to',h:'valid_to'}];
    case 'ocean':return [{k:'pol',h:'pol'},{k:'pod',h:'pod'},{k:'carrier',h:'carrier'},{k:'mode',h:'mode'},...rateFCL,{k:'val',h:'lcl_value'},{k:'cur',h:'currency'},{k:'etd',h:'etd'},{k:'transit',h:'transit_days'},{k:'via',h:'via'},{k:'ftO',h:'freetime_origin'},{k:'ftD',h:'freetime_dest'},{k:'from',h:'valid_from'},{k:'to',h:'valid_to'}];
    case 'localcharge':return [{k:'feeType',h:'fee_type'},{k:'mode',h:'mode'},...rateFCL,{k:'val',h:'lcl_value'},{k:'unit',h:'unit'},{k:'cur',h:'currency'},{k:'from',h:'valid_from'},{k:'to',h:'valid_to'}];
    case 'flat':return [{k:'unit',h:'unit'},{k:'val',h:'value'},{k:'cur',h:'currency'},{k:'from',h:'valid_from'},{k:'to',h:'valid_to'}];
  }
  return [];
}
function ensureXLSX(){if(typeof XLSX==='undefined'){toast('Excel library not loaded — needs internet access',true);return false;}return true;}
function downloadTemplate(){
  if(!ensureXLSX())return;const def=PAGES[state.page];const cols=excelCols(def);
  const ex=sampleRow(def);
  const aoa=[cols.map(c=>c.h),cols.map(c=>ex[c.k]!=null?ex[c.k]:'')];
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=cols.map(()=>({wch:16}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Template');
  XLSX.writeFile(wb,`SHOPTRANS_${state.country}_${state.page}_template.xlsx`);
  toast('Template downloaded');
}
function sampleRow(def){
  const s={mode:'FCL','20GP':100,'40GP':150,'40HC':150,'45HC':170,val:'',unit:'',cur:cc().cur,from:'2026-01-01',to:'2026-12-31'};
  if(def.kind==='master-ports')return {code:'VNSGN',name:'Cat Lai',city:'Ho Chi Minh City'};
  if(def.kind==='master-cfs')return {code:'VN-CFS-SNP',name:'Tan Cang CFS',addr:'Nguyen Thi Dinh, HCMC',port:'VNSGN'};
  if(def.kind==='master-admin')return {prov:'Ho Chi Minh City',dist:'District 7',ward:'Tan Thuan Dong',zip:'72915'};
  if(def.scope)s.scope='VNSGN';if(def.feeTypes)s.feeType=def.feeTypes[0];
  if(def.kind==='trucking'){s.port='VNSGN';s.zip='75358';s.adm='Tan Dong Hiep, Di An, Binh Duong';TRUCKS.forEach(([k])=>s[k]='');}
  if(def.kind==='ocean'){s.pol='VNSGN';s.pod='USLAX';s.carrier='ONE';s.etd='Mon/Thu';s.transit=18;s.via='Direct';s.ftO=7;s.ftD=14;}
  if(def.kind==='localcharge')s.feeType=def.lcset[0].v;
  if(def.kind==='flat'){return {unit:def.flatUnit,val:30,cur:cc().cur,from:'2026-01-01',to:'2026-12-31'};}
  if(def.inspect)s.note='per invoice';
  return s;
}
function triggerImport(){if(!ensureXLSX())return;const inp=document.getElementById('xlsxFile');inp.value='';inp.click();}
document.getElementById('xlsxFile').addEventListener('change',handleImport);
function handleImport(e){
  const file=e.target.files[0];if(!file)return;const reader=new FileReader();
  reader.onload=ev=>{try{
    const wb=XLSX.read(ev.target.result,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const json=XLSX.utils.sheet_to_json(ws,{defval:''});
    const def=PAGES[state.page];const cols=excelCols(def);const list=rows();let added=0;
    json.forEach(row=>{
      const norm={};Object.keys(row).forEach(h=>norm[h.toString().trim().toLowerCase()]=row[h]);
      const get=hk=>{const c=cols.find(c=>c.h===hk);return c?(norm[hk]!==undefined?norm[hk]:''):'';};
      const rec=rowToRec(def,norm);if(rec){list.push(Object.assign({id:uid(),ts:nowTs()},rec));added++;}
    });
    persist();renderAll();toast(`Imported <b>${added}</b> record(s) from Excel`);
  }catch(err){console.error(err);toast('Import failed — check the file format',true);}};
  reader.readAsArrayBuffer(file);
}
function val(norm,h){const v=norm[h];return v===undefined||v===null?'':String(v).trim();}
function numOrNull(norm,h){const v=norm[h];if(v===''||v===undefined||v===null)return null;const n=Number(v);return isNaN(n)?null:n;}
function rowToRec(def,norm){
  const r={};
  const fclRates=()=>{const o={};CONTAINERS.forEach(k=>{const n=numOrNull(norm,k.toLowerCase());if(n!=null)o[k]=n;});return o;};
  const truckRates=()=>{const o={};TRUCKS.forEach(([k])=>{const n=numOrNull(norm,k.toLowerCase());if(n!=null)o[k]=n;});return o;};
  switch(def.kind){
    case 'master-ports':if(!val(norm,'code'))return null;return {code:val(norm,'code').toUpperCase(),name:val(norm,'name'),city:val(norm,'city')};
    case 'master-cfs':if(!val(norm,'code'))return null;return {code:val(norm,'code').toUpperCase(),name:val(norm,'name'),addr:val(norm,'address'),port:val(norm,'linked_port').toUpperCase()};
    case 'master-admin':if(!val(norm,'zipcode'))return null;return {prov:val(norm,'province'),dist:val(norm,'district'),ward:val(norm,'ward'),zip:val(norm,'zipcode')};
    case 'fee':{const mode=def.lclUnit===null?'FCL':(val(norm,'mode').toUpperCase()||'FCL');r.mode=mode;r.cur=val(norm,'currency')||cc().cur;
      if(def.scope)r.scope=val(norm,'scope_code').toUpperCase();if(def.feeTypes)r.feeType=val(norm,'fee_type');
      if(mode==='FCL'){r.r=fclRates();if(!Object.keys(r.r).length)return null;}else{const v=numOrNull(norm,'lcl_value');if(v==null)return null;r.r={val:v};r.unit=val(norm,'unit')||def.lclUnit;}
      if(def.inspect)r.note=val(norm,'note');r.from=val(norm,'valid_from');r.to=val(norm,'valid_to');return r;}
    case 'trucking':{const mode=val(norm,'mode').toUpperCase()||'FCL';r.mode=mode;r.cur=val(norm,'currency')||cc().cur;
      r.port=val(norm,'port_or_cfs_code').toUpperCase();r.zip=val(norm,'zipcode');r.adm=val(norm,'admin_unit');if(!r.port)return null;
      if(mode==='FCL'){r.r=fclRates();if(!Object.keys(r.r).length)return null;}else{r.r=truckRates();if(!Object.keys(r.r).length)return null;}
      r.from=val(norm,'valid_from');r.to=val(norm,'valid_to');return r;}
    case 'ocean':{const mode=val(norm,'mode').toUpperCase()||'FCL';r.mode=mode;r.cur=val(norm,'currency')||cc().cur;
      r.pol=val(norm,'pol').toUpperCase();r.pod=val(norm,'pod').toUpperCase();if(!r.pol||!r.pod)return null;r.carrier=val(norm,'carrier');
      r.etd=val(norm,'etd');r.transit=val(norm,'transit_days');r.via=val(norm,'via');r.ftO=val(norm,'freetime_origin');r.ftD=val(norm,'freetime_dest');
      if(mode==='FCL'){r.r=fclRates();if(!Object.keys(r.r).length)return null;}else{const v=numOrNull(norm,'lcl_value');if(v==null)return null;r.r={val:v};r.unit='set';}
      r.from=val(norm,'valid_from');r.to=val(norm,'valid_to');return r;}
    case 'localcharge':{const t=lcDescriptor(def,val(norm,'fee_type'));if(!val(norm,'fee_type'))return null;r.feeType=val(norm,'fee_type');r.cur=val(norm,'currency')||cc().cur;
      let mode=val(norm,'mode').toUpperCase();if(t.flatUnit)mode='FLAT';else if(!mode)mode=t.fcl?'FCL':'LCL';r.mode=mode;
      if(mode==='FCL'){r.r=fclRates();if(!Object.keys(r.r).length)return null;}
      else if(mode==='FLAT'){const v=numOrNull(norm,'lcl_value');if(v==null)return null;r.r={val:v};r.unit=t.flatUnit;}
      else{const v=numOrNull(norm,'lcl_value');if(v==null)return null;r.r={val:v};r.unit=val(norm,'unit')||t.lclUnit;}
      r.from=val(norm,'valid_from');r.to=val(norm,'valid_to');return r;}
    case 'flat':{const v=numOrNull(norm,'value');if(v==null)return null;return {mode:'FLAT',unit:def.flatUnit,cur:val(norm,'currency')||cc().cur,r:{val:v},from:val(norm,'valid_from'),to:val(norm,'valid_to')};}
  }
  return null;
}

/* ===== util + boot ===== */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
let toastT;
function toast(msg,warn){const t=document.getElementById('toast');t.className='toast show'+(warn?' warn':'');
  t.innerHTML=(warn?I.info:I.check)+'<span>'+msg+'</span>';clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function renderAll(){renderCountryDropdown();renderSidebar();renderMain();}
loadMeta();loadDB();loadTrash();renderAll();
