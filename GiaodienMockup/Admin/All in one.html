<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOPTRANS · Operation Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f3; --surface:#ffffff; --surface-2:#fafbf9;
  --ink:#0e1512; --ink-soft:#3a463f; --muted:#7a847d; --faint:#a3aca5;
  --line:#e4e9e2; --line-strong:#d3dacf;
  --green:#00C566; --green-i:#00B85F; --green-d:#008F4C; --green-t:#009E54; --green-bright:#00E676; --green-wash:#e8f8ef;
  --nav:#eef2ec; --nav-2:#ffffff; --nav-line:#dde3d9; --nav-ink:#3a463f; --nav-muted:#869089;
  --shadow:0 1px 2px rgba(14,21,18,.05),0 10px 30px rgba(14,21,18,.06);
  --mono:'Geist Mono',ui-monospace,Menlo,monospace;
  --sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --colw:158px; --gutw:48px; --barh:30px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:grid;grid-template-columns:var(--sidew,262px) 1fr;grid-template-rows:100vh;height:100vh}
.app.side-collapsed{grid-template-columns:0 1fr}
.app.side-collapsed .side{opacity:0;pointer-events:none}

/* ---------- SIDEBAR ---------- */
.side{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;min-height:0;overflow:hidden;border-right:1px solid var(--line-strong);position:relative}
.side-resizer{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:30}
.side-resizer:hover,.side-resizer.drag{background:var(--green)}
.side-head{padding:18px 18px 14px;border-bottom:1px solid var(--nav-line)}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--green),var(--green-d));display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,197,102,.3)}
.logo svg{width:19px;height:19px}
.brand h1{font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:-.01em;line-height:1.1}
.brand .sub{font-size:10.5px;color:var(--nav-muted);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.side-search{padding:12px 14px 8px}
.side-search input{width:100%;background:var(--nav-2);border:1px solid var(--nav-line);border-radius:8px;color:var(--nav-ink);
  padding:8px 11px;font-family:var(--sans);font-size:12px;transition:.15s}
.side-search input::placeholder{color:var(--nav-muted)}
.side-search input:focus{outline:none;border-color:var(--green-d)}
.sheetlist{flex:1;min-height:0;overflow-y:scroll;padding:4px 10px 16px}
.sheetlist::-webkit-scrollbar{width:10px}
.sheetlist::-webkit-scrollbar-track{background:var(--nav-2)}
.sheetlist::-webkit-scrollbar-thumb{background:var(--nav-line);border-radius:8px;border:2px solid var(--nav-2)}
.grouplbl{display:flex;align-items:center;justify-content:space-between;font-size:9.5px;font-weight:600;color:var(--nav-muted);text-transform:uppercase;letter-spacing:.09em;padding:12px 8px 5px;cursor:pointer;user-select:none}
.grouplbl .gl{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden}
.grouplbl .gi{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;flex-shrink:0;opacity:.85;color:var(--green-d)}
.grouplbl .gi svg{width:100%;height:100%}
.grouplbl.sub .gi{width:12px;height:12px}
.grouplbl:hover{color:var(--ink-soft)}
.grouplbl .chev{width:13px;height:13px;transition:transform .18s;opacity:.7}
.grouplbl.collapsed .chev{transform:rotate(180deg)}
.sheet-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;transition:.12s;margin-bottom:1px}
.sheet-item:hover{background:var(--nav-2)}
.sheet-item.active{background:linear-gradient(90deg,rgba(0,197,102,.14),rgba(0,197,102,.03));box-shadow:inset 2px 0 0 var(--green)}
.sheet-item .nm{flex:1;font-size:12.5px;font-weight:500;color:var(--ink-soft);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-item.active .nm{color:var(--green-d);font-weight:600}
.sheet-item .nm .suf{color:var(--faint);font-weight:400}
.grouplbl.sub{padding:7px 8px 4px 22px;font-size:9px}
.grouplbl.sub .chev{width:11px;height:11px}
.sheet-item.lvl2{padding-left:38px;margin-bottom:0}
.sheet-item.lvl2 .nm{font-size:11.5px}
.sheet-item.dustrow{padding-left:20px}
.sheet-item .li{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;flex-shrink:0;opacity:.85;color:var(--green-d)}
.sheet-item .li svg{width:100%;height:100%}
.sheet-item.active .nm .suf{color:var(--green-t)}
.sheet-item .ct{font-family:var(--mono);font-size:10px;color:var(--nav-muted);background:#e6ebe3;padding:1px 7px;border-radius:99px}
.cl-tabs{display:flex;gap:6px;align-items:flex-end;padding:8px 14px 0;border-bottom:1px solid var(--line-strong);background:var(--surface)}
.cl-tab{font-family:var(--sans,inherit);font-size:12.5px;font-weight:600;color:var(--nav-muted,#869089);background:transparent;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;padding:8px 16px;cursor:pointer;transition:.12s;margin-bottom:-1px}
.cl-tab:hover{color:var(--green-d,#008F4C);background:var(--nav-2,#fff)}
.cl-tab.on{color:var(--green-d,#008F4C);background:var(--nav-2,#fff);border-color:var(--line-strong);border-bottom:1px solid var(--nav-2,#fff)}
.sheet-item.active .ct{color:var(--green-d);background:rgba(0,197,102,.14)}
.side-foot{padding:12px 14px;border-top:1px solid var(--nav-line);display:flex;gap:8px}
.side-foot button{flex:1;background:var(--nav-2);border:1px solid var(--nav-line);color:var(--nav-ink);border-radius:8px;
  padding:8px;font-family:var(--sans);font-size:11.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.side-foot button:hover{border-color:var(--green);color:var(--green-d);background:#fff}
.side-foot button svg{width:13px;height:13px}
.saved{font-size:10px;color:var(--nav-muted);text-align:center;padding:0 0 10px}
.saved b{color:var(--green-d)}

/* ---------- MAIN ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
.main-head{padding:16px 22px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.crumb{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.crumb .sheetname{font-size:17px;font-weight:600;letter-spacing:-.01em}
.crumb .dims{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:3px 9px;border-radius:7px}
.toolbar{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden}
.toolbar::-webkit-scrollbar{height:6px}
.toolbar::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px}
.toolbar>.btn,.toolbar .div,.toolbar .selinfo{flex:0 0 auto}
.search{position:relative;flex:1 1 180px;min-width:110px;max-width:340px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--faint)}
.search input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 11px 8px 33px;font-family:var(--sans);font-size:12.5px;transition:.15s}
.search input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-wash);background:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:8px;padding:6px 9px;
  font-family:var(--sans);font-size:11.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.btn.active{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important}
.btn.active svg{stroke:#fff}
.btn svg{width:13px;height:13px}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 3px 10px rgba(0,143,76,.2)}
.btn-primary:hover{background:var(--green-i);border-color:var(--green-i)}

/* ---------- SPREADSHEET ---------- */
.sheetwrap{flex:1;min-height:0;min-width:0;margin:0 22px 18px;border:1px solid var(--line-strong);border-radius:0;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.salesframe{flex:1;min-height:0;min-width:0;width:100%;margin:0 22px 18px;border:1px solid var(--line-strong);background:#fff;display:none}
.main.sales .toolbar{display:none}
.btn.icn{padding:6px 6px}
.btn.icn svg{width:14px;height:14px;display:block}
.datepop{position:fixed;z-index:200;display:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;box-shadow:var(--shadow);padding:12px;width:240px;font-family:inherit}
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dp-title{font-size:13px;font-weight:600;color:var(--ink)}
.dp-nav{width:26px;height:26px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;cursor:pointer;font-size:15px;color:var(--ink-soft);line-height:1}
.dp-nav:hover{border-color:var(--green);color:var(--green-d)}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-w{font-size:9.5px;font-weight:600;color:var(--faint);text-align:center;text-transform:uppercase;padding:3px 0}
.dp-d{height:28px;border:none;background:none;border-radius:7px;cursor:pointer;font-size:12px;color:var(--ink-soft);font-family:inherit}
.dp-d:hover{background:var(--bg)}
.dp-d.today{box-shadow:inset 0 0 0 1px var(--line-strong)}
.dp-d.sel{background:var(--green);color:#fff;font-weight:600}
.dp-foot{display:flex;justify-content:space-between;margin-top:9px}
.dp-foot button{font-size:11.5px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:5px 11px;cursor:pointer;color:var(--ink-soft);font-family:inherit}
.dp-foot button:hover{border-color:var(--green);color:var(--green-d)}
.countrydd{position:relative;margin-left:auto}
.cdd-btn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:6px 10px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer}
.cdd-btn:hover{border-color:var(--green)}
.cdd-btn img{width:20px;height:14px;object-fit:cover;border-radius:2px}
.cdd-btn .chev{width:14px;height:14px;opacity:.55;transition:transform .18s}
.countrydd.open .cdd-btn .chev{transform:rotate(180deg)}
.cdd-menu{position:absolute;top:calc(100% + 6px);right:0;z-index:60;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:210px;max-height:340px;overflow-y:auto;display:none}
.countrydd.open .cdd-menu{display:block}
.cdd-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;border-radius:7px;padding:7px 9px;font-family:inherit;font-size:12.5px;color:var(--ink-soft);cursor:pointer}
.cdd-item:hover{background:var(--bg)}
.cdd-item.on{color:var(--green-d);font-weight:600;background:rgba(0,197,102,.08)}
.cdd-item img{width:20px;height:14px;object-fit:cover;border-radius:2px;flex-shrink:0}
.main.sales .sheetwrap{display:none}
.main.sales .salesframe{display:block}
/* ===== DOCS CHECKLIST (sheet HQ) — card view replaces grid ===== */
#docsChecklist{display:none}
.main.docs .toolbar{display:none}
.main.docs .sheetwrap{display:none}
.main.docs .salesframe{display:none}
.main.docs #docsChecklist{display:flex;flex-direction:column;flex:1;min-height:0;margin:0 22px 18px;border:1px solid var(--line-strong);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.dckl-head{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.dckl-bar{flex:1;max-width:300px;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.dckl-bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--green-bright));transition:width .35s cubic-bezier(.4,0,.2,1)}
.dckl-pct{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--green-d);font-variant-numeric:tabular-nums;white-space:nowrap}
.dckl-reset{margin-left:auto;font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 13px;cursor:pointer;transition:.16s}
.dckl-reset:hover{color:var(--ink);border-color:var(--line-strong);transform:translateY(-1px)}
.dckl-scroll{flex:1;min-height:0;overflow-y:auto;padding:18px}
.dckl-grid{column-count:2;column-gap:16px}
@media(max-width:1100px){.dckl-grid{column-count:1}}
.dckl-grid.one{column-count:1;max-width:760px;margin:0 auto}
.colorpop{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);padding:9px;display:none;grid-template-columns:repeat(6,1fr);gap:6px;width:188px}
.colorpop.show{display:grid}
.colorsw{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.14);cursor:pointer;transition:transform .12s}
.colorsw:hover{transform:scale(1.14)}
.colorpop .none{grid-column:1/-1;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px;cursor:pointer;text-align:center;font-family:var(--sans)}
.colorpop .none:hover{color:var(--ink);border-color:var(--line-strong)}
.dckl-card{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px 16px 7px;margin:0 0 16px}
.dckl-chead{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.dckl-badge{width:25px;height:25px;border-radius:7px;background:var(--green-wash);color:var(--green-d);font-family:var(--mono);font-weight:600;font-size:12.5px;display:grid;place-items:center;flex:0 0 auto}
.dckl-ctitle{font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.dckl-cmeta{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.dckl-intro{font-size:12px;color:var(--muted);font-style:italic;padding:7px 2px 3px;line-height:1.4}
.dckl-intro.hot{color:#d63a3a;font-weight:700;font-style:normal}
.dckl-subhead{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--green-d);padding:12px 2px 4px;margin-top:3px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:7px}
.dckl-subhead::before{content:"";width:5px;height:5px;border-radius:99px;background:var(--green);flex:0 0 auto}
.dckl-item{display:flex;gap:10px;align-items:flex-start;padding:7px 6px;border-radius:9px;cursor:pointer;transition:background .14s;user-select:none}
.dckl-item:hover{background:var(--surface-2)}
.dckl-box{flex:0 0 auto;width:18px;height:18px;border-radius:5px;border:1.8px solid var(--line-strong);background:var(--surface);margin-top:1px;display:grid;place-items:center;transition:.16s}
.dckl-box svg{width:11px;height:11px;color:#fff;opacity:0;transform:scale(.4);transition:.16s}
.dckl-txt{font-size:13px;line-height:1.42;color:var(--ink-soft);transition:.16s}
.dckl-txt b{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--green-d);margin-right:2px}
.dckl-hint{display:block;font-size:11px;color:var(--faint);margin-top:2px;line-height:1.35}
.dckl-item.done .dckl-box{background:var(--green);border-color:var(--green)}
.dckl-item.done .dckl-box svg{opacity:1;transform:scale(1)}
.dckl-item.done .dckl-txt{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.dckl-item.done .dckl-txt b{color:var(--faint)}
.ssgrid{flex:1;min-height:0;min-width:0;display:grid;grid-template-columns:var(--gutw) 1fr;grid-template-rows:var(--barh) 1fr;overflow:hidden;background:var(--surface)}
.corner{grid-area:1/1;background:#e7ece5;border-right:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);z-index:6;cursor:cell}
.colbar{grid-area:1/2;overflow-x:hidden;overflow-y:scroll}
.colbar::-webkit-scrollbar{width:14px;height:0;background:transparent}
.colbar::-webkit-scrollbar-thumb,.colbar::-webkit-scrollbar-track{background:transparent}
.rowbar{grid-area:2/1;overflow-x:scroll;overflow-y:hidden;border-right:1px solid var(--line-strong)}
.rowbar::-webkit-scrollbar{width:0;height:14px;background:transparent}
.rowbar::-webkit-scrollbar-thumb,.rowbar::-webkit-scrollbar-track{background:transparent}
.ssheet{grid-area:2/2;min-height:0;min-width:0;overflow-x:auto;overflow-y:scroll;position:relative}
.ssheet::-webkit-scrollbar{width:14px;height:14px}
.ssheet::-webkit-scrollbar-track{background:#eef2ec}
.ssheet::-webkit-scrollbar-thumb{background:#9fb0a4;border-radius:8px;border:3px solid #eef2ec}
.ssheet::-webkit-scrollbar-thumb:hover{background:#7f968a}
.ssheet::-webkit-scrollbar-corner{background:#eef2ec}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:10px}
col.gut{width:var(--gutw)}
.colbar table,.rowbar table,.ssheet table{margin:0}
.rowbar td.rownum{width:var(--gutw)}
/* column-letter bar */
thead th{height:var(--barh);background:#eef2ec;border-right:1px solid var(--line);border-bottom:1px solid var(--line-strong);
  font-family:var(--mono);font-size:10px;font-weight:600;color:var(--muted);position:relative;text-align:center;letter-spacing:.03em}
th .rsz{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:9}
th .rsz:hover,th .rsz.drag{background:var(--green)}
/* row number gutter */
td.rownum{width:var(--gutw);background:#eef2ec;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:10px;color:var(--faint);text-align:center;position:relative;vertical-align:middle;
  user-select:none;cursor:default}
td.rownum.hdrn{background:#d3e8db;color:#5f7a6a;border-bottom:2px solid var(--green)}
td.rownum .rrz{position:absolute;left:0;bottom:-3px;width:100%;height:8px;cursor:row-resize;z-index:6}
td.rownum .rrz:hover,td.rownum .rrz.drag{background:var(--green)}
/* data cells */
td.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 8px;vertical-align:middle;text-align:center;text-transform:uppercase;cursor:cell;
  white-space:pre-wrap;word-break:break-word;line-height:1.42;color:var(--ink-soft);height:26px;background:var(--surface)}
td.cell.editing{text-align:center;cursor:text}
td.cell.sel-rng{background:#d2efde!important;box-shadow:inset 0 0 0 1px rgba(0,143,76,.22)}
.side-toggle{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:8px;cursor:pointer;display:inline-grid;place-items:center;color:var(--muted);margin-right:10px;flex-shrink:0}
.side-toggle:hover{border-color:var(--green);color:var(--green-d)}
.side-toggle svg{width:16px;height:16px}
.selinfo{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:42px}
.toolbar .div{width:1px;height:18px;background:var(--line);margin:0 1px}
td.cell:focus{outline:2px solid var(--green);outline-offset:-2px;background:#fff;box-shadow:0 0 0 3px var(--green-wash);position:relative;z-index:4;border-radius:2px}
tr:hover td.cell{background:#f3faf5}
/* header data row (row 0 of file) */
tr.hdr td.cell{z-index:1;height:30px;background:#e3f1e8;color:#0c3a23;font-weight:600;font-size:10px;border-bottom:2px solid var(--green);border-right-color:#cfe6d8}
tr.hdr:hover td.cell{background:#dcefe3}
tr.hdr td.cell:focus{color:var(--ink);background:#fff}
tr.hdr td.rownum .del{display:none!important}
.empty-row td{padding:5px 8px;color:var(--faint);font-style:italic}
td.cell.bool{text-align:center;vertical-align:middle;background:var(--surface)}
td.cell.bool input{width:16px;height:16px;accent-color:var(--green);cursor:pointer;vertical-align:middle}
/* selection */
thead th[data-col]{cursor:pointer}
thead th.sel{background:var(--green);color:#fff}
td.rownum[data-row]{cursor:pointer}
td.cell.colsel{background:#e3f4ea!important}
tr.rowsel td.cell{background:#e3f4ea!important}
td.rownum.sel{background:var(--green);color:#fff}
/* bulk action bar */
.bulkbar{display:none;align-items:center;gap:11px;padding:9px 22px;background:var(--green-d);color:#fff;font-size:12.5px}
.bulkbar.on{display:flex}
.bulkbar b{font-family:var(--mono);color:#fff;background:rgba(255,255,255,.18);padding:1px 7px;border-radius:6px}
.bulkbar .spacer{flex:1}
.bulkbar button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;
  padding:6px 13px;font-family:var(--sans);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.bulkbar button:hover{background:rgba(255,255,255,.16)}
.bulkbar button svg{width:13px;height:13px}
.bulkbar button.del{color:#ffc4bb;border-color:rgba(255,120,100,.45)}
.bulkbar button.del:hover{background:rgba(255,90,70,.22)}
/* confirm dialog */
.overlay{position:fixed;inset:0;background:rgba(14,21,18,.4);backdrop-filter:blur(2px);display:none;z-index:100;align-items:center;justify-content:center;padding:24px}
.overlay.on{display:flex;animation:fade .14s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.confirm{background:var(--surface);border-radius:14px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(14,21,18,.25);overflow:hidden;animation:pop .18s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.confirm .cmsg{padding:24px 22px 20px;font-size:13.5px;color:var(--ink);line-height:1.5}
.confirm .cbtns{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;background:var(--surface-2);border-top:1px solid var(--line)}
.btn-danger{background:#c0392b;border-color:#c0392b;color:#fff}
.btn-danger:hover{background:#a93226;border-color:#a93226}

.loadmore{padding:14px;text-align:center}
.loadmore button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 18px;
  font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);cursor:pointer}
.loadmore button:hover{border-color:var(--green);color:var(--green-d);background:var(--green-wash)}
.loadmore .info{font-size:11px;color:var(--faint);margin-top:8px}

.note-banner{font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);border-left:3px solid var(--green);
  border-radius:7px;padding:7px 12px;margin:0 22px;display:flex;align-items:center;gap:8px;position:absolute;bottom:14px;left:0;z-index:8;box-shadow:var(--shadow);opacity:.96}
.note-banner svg{width:14px;height:14px;color:var(--green-d);flex-shrink:0}
.note-banner .x{margin-left:6px;cursor:pointer;color:var(--faint);font-size:15px;line-height:1}

.toast{position:fixed;bottom:22px;left:calc(50% + 131px);transform:translateX(-50%) translateY(20px);background:var(--green-d);
  color:#fff;padding:10px 17px;border-radius:10px;font-size:12.5px;box-shadow:0 12px 40px rgba(0,80,40,.25);opacity:0;pointer-events:none;transition:.25s;z-index:90;display:flex;align-items:center;gap:8px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:15px;height:15px;color:#fff}
.dckl-editbtn{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--green-d);background:var(--green-wash);border:1px solid transparent;border-radius:9px;padding:7px 14px;cursor:pointer;transition:.16s}
.dckl-editbtn:hover{filter:brightness(.97)}
.dckl-editbtn.on{background:var(--green);color:#fff}
.dckl-edithint{margin-left:auto;font-size:12px;color:var(--muted);font-style:italic}
.dckl-chead.edit{gap:8px}
.dckl-titin{flex:1;min-width:0;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;text-transform:uppercase;letter-spacing:.02em}
.dckl-titin:focus{outline:none;border-color:var(--green);background:var(--surface)}
.dckl-cardact{display:flex;gap:4px;flex:0 0 auto}
.dckl-ic{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:.14s;font-family:var(--sans)}
.dckl-ic:hover{color:var(--ink);border-color:var(--line-strong);background:var(--surface-2)}
.dckl-ic.del:hover{color:#d63a3a;border-color:#f0c2c2;background:#fdeeee}
.dckl-erow{border:1px solid var(--line);border-radius:10px;padding:8px 9px;margin:6px 0;background:var(--surface-2)}
.dckl-erow-main{display:flex;flex-direction:column;gap:5px}
.dckl-lin,.dckl-din{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%}
.dckl-lin:focus,.dckl-din:focus{outline:none;border-color:var(--green)}
.dckl-din{font-size:11.5px;color:var(--faint)}
.dckl-erow-bar{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.dckl-kindsel{display:flex;gap:3px}
.dckl-kchip{font-family:var(--sans);font-size:11px;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer;transition:.14s}
.dckl-kchip:hover{color:var(--ink);border-color:var(--line-strong)}
.dckl-kchip.on{background:var(--green-wash);color:var(--green-d);border-color:transparent;font-weight:600}
.dckl-hotbtn{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;cursor:pointer;transition:.14s}
.dckl-hotbtn.on{background:#fdeeee;color:#d63a3a;border-color:#f0c2c2}
.dckl-erow-act{margin-left:auto;display:flex;gap:4px}
.dckl-addrow{display:flex;gap:6px;flex-wrap:wrap;padding:8px 2px 4px;margin-top:4px;border-top:1px dashed var(--line)}
.dckl-addbtn{font-family:var(--sans);font-size:11.5px;font-weight:500;color:var(--green-d);background:var(--surface);border:1px dashed var(--line-strong);border-radius:7px;padding:5px 10px;cursor:pointer;transition:.14s}
.dckl-addbtn:hover{background:var(--green-wash);border-color:var(--green)}
.dckl-addcard{display:grid;place-items:center;border:2px dashed var(--line-strong);background:transparent;box-shadow:none;min-height:70px;padding:0}
.dckl-addcard button{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--green-d);background:transparent;border:none;cursor:pointer;padding:18px;width:100%}
.dckl-addcard:hover{border-color:var(--green)}
.cl-tab.sheet{padding-right:9px}
.cl-x{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:5px;border-radius:4px;font-size:10px;color:var(--faint,#a3aca5);transition:.12s}
.cl-x:hover{color:#d63a3a;background:#fdeeee}
.cl-add{font-family:var(--sans,inherit);font-size:12px;font-weight:600;color:var(--green-d,#008F4C);background:transparent;border:1px dashed var(--line-strong,#d3dacf);border-bottom:none;border-radius:8px 8px 0 0;padding:8px 14px;cursor:pointer;transition:.12s;margin-bottom:-1px}
.cl-add:hover{background:var(--green-wash,#e8f8ef);border-color:var(--green,#00C566)}
#regView{display:none;flex-direction:column;flex:1;min-height:0}
.main.regs .toolbar{display:none}
.main.regs .sheetwrap{display:none}
.main.regs .salesframe{display:none}
.main.regs #docsChecklist{display:none}
.main.regs #regView{display:flex;margin:0 22px 18px;border:1px solid var(--line-strong);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.reg-head{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);flex:0 0 auto}
.reg-title{font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--ink);display:flex;align-items:center;gap:9px}
.reg-count{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--green-d);background:var(--green-wash);border-radius:99px;padding:2px 9px}
.reg-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.reg-srch{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 11px}
.reg-srch svg{width:14px;height:14px;color:var(--muted);flex:0 0 auto}
.reg-srch input{border:none;outline:none;background:transparent;font-family:var(--sans);font-size:12.5px;color:var(--ink);width:190px}
.reg-add{font-family:var(--sans);font-size:12.5px;font-weight:600;color:#fff;background:var(--green);border:none;border-radius:9px;padding:8px 15px;cursor:pointer;transition:.15s;white-space:nowrap}
.reg-add:hover{background:var(--green-i)}
.reg-scroll{flex:1;min-height:0;overflow:auto}
.reg-table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.8px}
.reg-table.fixed{table-layout:fixed}
.reg-table thead th{position:sticky;top:0;z-index:2;background:var(--surface);text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line-strong);white-space:nowrap;position:relative}
.reg-rsz{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:5;user-select:none}
.reg-rsz:hover,.reg-rsz.drag{background:var(--green)}
.reg-table tbody td{padding:12px 14px;border-bottom:1px solid var(--line);color:var(--ink-soft);vertical-align:middle;text-align:center;line-height:1.5;overflow:hidden}
.reg-table tbody tr:last-child td{border-bottom:none}
.reg-table tbody tr:hover{background:var(--surface-2)}
.reg-table .mono{font-family:var(--mono);font-size:11.5px;color:var(--ink);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.reg-table td.reg-c{text-align:center;white-space:nowrap}
/* rules tabs */
.reg-tabbar{display:flex;gap:6px;align-items:flex-end;padding:8px 18px 0;border-bottom:1px solid var(--line-strong);background:var(--surface);flex:0 0 auto}
.reg-tab{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--muted);background:transparent;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;padding:8px 16px;cursor:pointer;transition:.12s;margin-bottom:-1px;display:inline-flex;align-items:center;gap:8px}
.reg-tab:hover{color:var(--green-d);background:var(--surface-2)}
.reg-tab.on{color:var(--green-d);background:var(--surface-2);border-color:var(--line-strong);border-bottom:1px solid var(--surface-2)}
.reg-tab .rc{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--green-d);background:var(--green-wash);border-radius:99px;padding:1px 7px}
/* expired-date controls */
.reg-expc,.reg-datec{text-align:center;white-space:nowrap}
.reg-expchk{width:17px;height:17px;cursor:pointer;accent-color:var(--green);margin:0;vertical-align:middle;display:inline-block}
.reg-expdate{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;color:var(--ink);background:var(--surface);outline:none;transition:.14s;cursor:pointer;text-align:center;min-width:128px;white-space:nowrap}
.reg-expdate:hover{border-color:var(--green)}
.reg-expdate:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-wash)}
.reg-nodate{color:var(--faint);font-size:13px}
/* custom English/Gregorian date picker */
.rdp{position:absolute;z-index:9999;width:300px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 16px 40px rgba(16,24,40,.16);padding:12px;font-family:var(--sans);display:none}
.rdp.show{display:block}
.rdp-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.rdp-title{font-size:13.5px;font-weight:700;color:var(--ink);padding:5px 10px;border-radius:8px;cursor:pointer;border:none;background:transparent;font-family:var(--sans);transition:.12s}
.rdp-title:hover{background:var(--green-wash);color:var(--green-d)}
.rdp-nav{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center;transition:.12s}
.rdp-nav:hover{background:var(--surface-2);border-color:var(--line-strong);color:var(--green-d)}
.rdp-wk{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.rdp-wk span{text-align:center;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-family:var(--mono);padding:4px 0}
.rdp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.rdp-d{height:34px;border:none;background:transparent;border-radius:8px;font-size:12.5px;color:var(--ink);cursor:pointer;font-family:var(--mono);transition:.1s}
.rdp-d:hover{background:var(--green-wash);color:var(--green-d)}
.rdp-d.sel{background:var(--green);color:#fff;font-weight:700}
.rdp-d.sel:hover{background:var(--green-d);color:#fff}
.rdp-d.today{box-shadow:inset 0 0 0 1.5px var(--green)}
.rdp-my{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rdp-my-cell{height:46px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:500;color:var(--ink);background:transparent;border:1px solid var(--line);cursor:pointer;font-family:var(--sans);transition:.12s}
.rdp-my-cell:hover{background:var(--green-wash);color:var(--green-d);border-color:transparent}
.rdp-my-cell.sel{background:var(--green);color:#fff;font-weight:600;border-color:transparent}
.rdp-foot{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.rdp-act{background:transparent;border:none;color:var(--green-d);font-weight:600;font-size:12px;cursor:pointer;font-family:var(--sans);padding:4px 8px;border-radius:7px;transition:.12s}
.rdp-act:hover{background:var(--green-wash)}
.rdp-act.clear:hover{color:#d63a3a;background:#fdeeee}
.rdp-time{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.rdp-time-lbl{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.rdp-time input{width:52px;font-family:var(--mono);font-size:14px;font-weight:600;text-align:center;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 4px;outline:none;transition:.12s}
.rdp-time input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-wash)}
.rdp-colon{font-weight:700;color:var(--muted)}
.rdp-now-btn{margin-left:auto;font-size:11px;font-weight:600;color:var(--green-d);background:transparent;border:none;cursor:pointer;padding:5px 8px;border-radius:7px}
.rdp-now-btn:hover{background:var(--green-wash)}
.rdp-foot .rdp-apply{background:var(--green);color:#fff;font-weight:700;padding:6px 16px}
.rdp-foot .rdp-apply:hover{background:var(--green-d)}
.reg-titlec{font-weight:600;color:var(--ink);white-space:normal;word-break:break-word}
.reg-notesc{color:var(--muted);font-size:12px;white-space:normal;word-break:break-word}
.reg-linkc{white-space:nowrap}
.reg-link{display:inline-flex;align-items:center;gap:3px;font-weight:600;color:var(--green-d);text-decoration:none;border-bottom:1px solid transparent;transition:.14s}
.reg-link:hover{border-bottom-color:var(--green-d)}
.reg-dash{color:var(--faint)}
.reg-actc{white-space:nowrap;text-align:center}
.reg-ic{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:.14s;margin-left:4px;font-size:13px;font-family:var(--sans)}
.reg-ic:hover{color:var(--ink);border-color:var(--line-strong);background:var(--surface-2)}
.reg-ic.del:hover{color:#d63a3a;border-color:#f0c2c2;background:#fdeeee}
.reg-empty{padding:64px 24px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.7}
.reg-empty b{color:var(--green-d)}
.reg-modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center}
.reg-modal.show{display:flex}
.reg-backdrop{position:absolute;inset:0;background:rgba(14,21,18,.42)}
.reg-dialog{position:relative;width:min(620px,calc(100vw - 40px));max-height:calc(100vh - 60px);overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;box-shadow:0 24px 70px rgba(14,21,18,.28);display:flex;flex-direction:column}
.reg-dlg-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:700;color:var(--ink)}
.reg-x{margin-left:auto;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-size:13px;font-family:var(--sans)}
.reg-x:hover{color:var(--ink);background:var(--surface-2)}
.reg-dlg-body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:13px 14px}
.reg-f{display:flex;flex-direction:column;gap:5px}
.reg-f-wide{grid-column:1/-1}
.reg-f span{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.reg-f input,.reg-f textarea{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none;transition:.14s;resize:vertical}
.reg-f input:focus,.reg-f textarea:focus{border-color:var(--green);background:var(--surface)}
.reg-dlg-foot{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2)}
.reg-btn{font-family:var(--sans);font-size:13px;font-weight:600;border-radius:10px;padding:9px 18px;cursor:pointer;transition:.15s;border:1px solid transparent}
.reg-btn.ghost{background:var(--surface);border-color:var(--line);color:var(--muted)}
.reg-btn.ghost:hover{color:var(--ink);border-color:var(--line-strong)}
.reg-btn.solid{background:var(--green);color:#fff}
.reg-btn.solid:hover{background:var(--green-i)}
@media(max-width:560px){.reg-dlg-body{grid-template-columns:1fr}}
/* ---- system prompt/confirm dialog ---- */
.sys-dialog{width:min(420px,calc(100vw - 40px))}
.sys-body{padding:18px 20px 4px;display:flex;flex-direction:column;gap:6px}
.sys-body .sys-lbl{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.sys-body .sys-msg{font-size:13.5px;line-height:1.55;color:var(--ink-soft)}
.sys-body input{font-family:var(--sans);font-size:13.5px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 11px;outline:none;transition:.14s}
.sys-body input:focus{border-color:var(--green);background:var(--surface)}
.reg-btn.danger{background:#e5484d;color:#fff}
.reg-btn.danger:hover{background:#d23b40}

/* ============ CHECKLIST redesign ============ */
.main.docs #docsChecklist{border-radius:16px}
.dckl-head{padding:13px 20px;background:linear-gradient(180deg,var(--surface-2),var(--surface));border-bottom:1px solid var(--line)}
.dckl-editbtn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;letter-spacing:.01em;color:var(--green-d);background:var(--green-wash);border:1px solid transparent;border-radius:10px;padding:8px 16px;cursor:pointer;transition:.18s cubic-bezier(.2,.9,.3,1)}
.dckl-editbtn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,158,84,.16)}
.dckl-editbtn.on{background:var(--green);color:#fff;box-shadow:0 4px 16px rgba(0,158,84,.32)}
.dckl-edithint{margin-left:12px;display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--green-d);font-style:normal}
.dckl-edithint::before{content:"";width:8px;height:8px;border-radius:99px;background:var(--green);box-shadow:0 0 0 0 rgba(0,197,102,.5);animation:dcklPulse 1.6s infinite}
@keyframes dcklPulse{0%{box-shadow:0 0 0 0 rgba(0,197,102,.5)}70%{box-shadow:0 0 0 7px rgba(0,197,102,0)}100%{box-shadow:0 0 0 0 rgba(0,197,102,0)}}

.dckl-scroll{padding:20px}
.dckl-grid{column-gap:18px}

/* ---- view-mode cards ---- */
.dckl-card{position:relative;border:1px solid var(--line);border-radius:16px;padding:16px 17px 9px;margin:0 0 18px;background:var(--surface);box-shadow:0 1px 2px rgba(14,21,18,.04);overflow:hidden;transition:box-shadow .2s,transform .2s,border-color .2s}
.dckl-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--green),var(--green-bright));opacity:0;transition:opacity .2s}
.dckl-card:hover{box-shadow:0 8px 30px rgba(14,21,18,.09);transform:translateY(-2px)}
.dckl-card:hover::before{opacity:.5}
.dckl-card.complete::before{opacity:1}
.dckl-card.complete .dckl-badge{background:var(--green);color:#fff}
.dckl-chead{align-items:center;gap:11px;padding-bottom:11px;flex-wrap:wrap}
.dckl-badge{width:27px;height:27px;border-radius:9px;font-size:12.5px;box-shadow:inset 0 0 0 1px rgba(0,158,84,.12);transition:.2s}
.dckl-ctitle{font-size:12.5px;letter-spacing:.04em}
.dckl-cmeta{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--green-d);background:var(--green-wash);border-radius:99px;padding:2px 9px}
.dckl-cprog{flex:1 0 100%;height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:2px}
.dckl-cprog>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--green-bright));transition:width .45s cubic-bezier(.2,.9,.3,1)}

.dckl-item{gap:11px;padding:8px 7px;border-radius:11px}
.dckl-box{width:19px;height:19px;border-radius:6px;border-width:2px}
.dckl-item:hover .dckl-box{border-color:var(--green)}
.dckl-item.done .dckl-box{animation:dcklPop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes dcklPop{0%{transform:scale(.6)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
.dckl-item.done .dckl-box svg{stroke-dasharray:14;stroke-dashoffset:0;animation:dcklDraw .32s ease forwards}
@keyframes dcklDraw{from{stroke-dashoffset:14}to{stroke-dashoffset:0}}
.dckl-txt{font-size:12.8px}

/* ---- edit mode: a "build console" feel ---- */
.dckl-scroll.editmode{background:
  radial-gradient(circle at 1px 1px, rgba(0,158,84,.10) 1px, transparent 0) 0 0/16px 16px,
  var(--surface-2)}
.dckl-grid.editing .dckl-card{border:1.5px dashed var(--line-strong);box-shadow:0 1px 2px rgba(14,21,18,.03);background:rgba(255,255,255,.78);backdrop-filter:blur(1px)}
.dckl-grid.editing .dckl-card::before{display:none}
.dckl-grid.editing .dckl-card:hover{transform:none;box-shadow:0 4px 18px rgba(14,21,18,.07)}
.dckl-chead.edit{padding-bottom:11px;border-bottom:1px dashed var(--line-strong)}
.dckl-titin{border-radius:9px;font-size:12.5px}
.dckl-titin:focus{box-shadow:0 0 0 3px var(--green-wash)}
.dckl-cardact .dckl-ic{border-radius:8px}

.dckl-erow{border:1px solid var(--line);border-left:3px solid var(--green-bright);border-radius:11px;padding:9px 11px;margin:8px 0;background:var(--surface);box-shadow:0 1px 2px rgba(14,21,18,.04);animation:dcklRowIn .26s cubic-bezier(.2,.9,.3,1)}
@keyframes dcklRowIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dckl-lin{font-size:12.8px;border-radius:8px}
.dckl-lin:focus{box-shadow:0 0 0 3px var(--green-wash)}
.dckl-din{border-radius:8px}
.dckl-din:focus{box-shadow:0 0 0 3px var(--green-wash)}
.dckl-erow-bar{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.dckl-kindsel{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.dckl-kchip{border:none;border-radius:7px;padding:5px 11px;background:transparent}
.dckl-kchip:hover{background:rgba(0,158,84,.07);border-color:transparent}
.dckl-kchip.on{background:var(--surface);color:var(--green-d);box-shadow:0 1px 3px rgba(14,21,18,.12);font-weight:600}
.dckl-hotbtn{border-radius:8px}
.dckl-ic{border-radius:8px;transition:.16s}
.dckl-ic:hover{transform:translateY(-1px)}

.dckl-addrow{gap:7px;padding:9px 2px 5px;margin-top:6px;border-top:1px dashed var(--line)}
.dckl-addbtn{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--green-d);background:var(--green-wash);border:1px solid transparent;border-radius:9px;padding:6px 12px;transition:.16s}
.dckl-addbtn:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,158,84,.16);border-color:transparent}
.dckl-addcard{border:2px dashed var(--line-strong);border-radius:16px;transition:.18s}
.dckl-addcard button{font-size:13px;color:var(--green-d)}
.dckl-addcard:hover{border-color:var(--green);background:var(--green-wash)}
.dckl-addcard:hover button{transform:scale(1.03)}
@media(prefers-reduced-motion:reduce){.dckl-item.done .dckl-box,.dckl-item.done .dckl-box svg,.dckl-erow,.dckl-edithint::before{animation:none}}

/* ===== CHECKLIST WORKSHEET (view) ===== */
.main.docs #docsChecklist .ckw{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ckw-bar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.ckw-title{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);flex:0 0 auto}
.ckw-title b{color:var(--green-d)}
.ckw-search{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;flex:1;min-width:150px;max-width:300px}
.ckw-search svg{width:14px;height:14px;color:var(--muted);flex:0 0 auto}
.ckw-search input{border:none;background:none;outline:none;font-family:var(--sans);font-size:12.5px;color:var(--ink);width:100%}
.ckw-seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;flex:0 0 auto}
.ckw-seg button{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--muted);background:none;border:none;border-radius:7px;padding:5px 11px;cursor:pointer;transition:.12s}
.ckw-seg button:hover{color:var(--ink-soft)}
.ckw-seg button.on{background:var(--surface);color:var(--green-d);box-shadow:0 1px 3px rgba(14,21,18,.1)}
.ckw-tools{margin-left:auto;display:flex;gap:8px;flex:0 0 auto}
.ckw-strip{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--surface-2),var(--surface))}
.ckw-pct{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--green-d);font-variant-numeric:tabular-nums;line-height:1;flex:0 0 auto}
.ckw-pct small{font-size:13px;color:var(--muted);font-weight:600}
.ckw-bwrap{flex:1;min-width:0}
.ckw-bar2{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.ckw-bar2>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--green-bright));transition:width .5s cubic-bezier(.2,.9,.3,1)}
.ckw-meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}
.ckw-meta b{color:var(--ink);font-weight:600}
.ckw-meta em{color:var(--green-t);font-style:normal;font-weight:600}
.ckw-colh{display:grid;grid-template-columns:46px 28px 1fr;padding:7px 20px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);background:var(--surface)}
.ckw-table{flex:1;min-height:0;overflow-y:auto}
.ckw-sec{display:flex;align-items:center;gap:11px;padding:13px 20px 9px;position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line)}
.ckw-sec .n{font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:var(--green);border-radius:6px;padding:3px 8px;flex:0 0 auto;letter-spacing:.02em}
.ckw-sec .t{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.ckw-sec .rule{flex:1;height:0;border-top:1px dashed var(--line-strong);min-width:14px}
.ckw-sec .sb{width:58px;height:5px;border-radius:99px;background:var(--line);overflow:hidden;flex:0 0 auto}
.ckw-sec .sb>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s}
.ckw-sec .c{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);flex:0 0 auto;min-width:42px;text-align:right}
.ckw-row{display:grid;grid-template-columns:46px 28px 1fr;align-items:start;cursor:pointer;border-bottom:1px solid var(--line);transition:background .12s;outline:none;position:relative}
.ckw-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:.15s}
.ckw-row:hover{background:var(--surface-2)}
.ckw-row:focus-visible{background:var(--green-wash)}
.ckw-idx{font-family:var(--mono);font-size:10.5px;color:var(--faint);padding:11px 0 11px 20px;font-variant-numeric:tabular-nums}
.ckw-chk{padding-top:10px;padding-left:2px}
.ckw-box{width:17px;height:17px;border-radius:5px;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;transition:.16s}
.ckw-box svg{width:11px;height:11px;color:#fff;opacity:0;transform:scale(.4);transition:.16s}
.ckw-cell{padding:9px 20px 9px 8px;min-width:0}
.ckw-lead{font-size:13px;line-height:1.45;color:var(--ink);font-weight:500}
.ckw-rem{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.ckw-code{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--green-d);background:var(--green-wash);border-radius:5px;padding:1px 7px;margin-right:6px}
.ckw-row.done{background:rgba(0,197,102,.05)}
.ckw-row.done::before{background:var(--green)}
.ckw-row.done .ckw-box{background:var(--green);border-color:var(--green)}
.ckw-row.done .ckw-box svg{opacity:1;transform:scale(1);animation:dcklPop .28s cubic-bezier(.2,1.3,.4,1)}
.ckw-row.done .ckw-idx{color:var(--green-t)}
.ckw-subrow{padding:11px 20px 4px 76px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--green-t);border-bottom:1px solid var(--line)}
.ckw-noterow{padding:9px 20px 9px 76px;font-size:11.5px;color:var(--muted);font-style:italic;line-height:1.45;border-bottom:1px solid var(--line)}
.ckw-noterow.hot{color:var(--green-d);font-style:normal;font-weight:600;background:var(--green-wash)}
.ckw-empty{padding:48px 20px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:760px){.ckw-colh,.ckw-row{grid-template-columns:34px 26px 1fr}.ckw-idx{padding-left:12px}.ckw-cell{padding-right:12px}.ckw-sec{padding-left:12px;padding-right:12px}.ckw-subrow,.ckw-noterow{padding-left:60px}}
/* ----- edit accordion ----- */
.ckl-acc{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ckl-acc.edit .ckl-secs{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 28px}
.main.docs #docsChecklist .dckl-head{display:flex;align-items:center;gap:10px}
.ckl-esec{border:1px solid var(--line);border-left:3px solid var(--green);border-radius:12px;background:var(--surface);margin-bottom:14px;overflow:hidden}
.ckl-ehead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.ckl-ebadge{width:24px;height:24px;border-radius:7px;background:var(--green-wash);color:var(--green-d);font-family:var(--mono);font-weight:700;font-size:12px;display:grid;place-items:center;flex:0 0 auto}
.ckl-ehead .dckl-titin{flex:1;min-width:0}
.ckl-eact{display:flex;gap:4px;flex:0 0 auto}
.ckl-ebody{padding:11px 12px 12px}
.ckl-eadd button{width:100%;padding:12px;border:1.5px dashed var(--line-strong);border-radius:12px;background:var(--surface-2);color:var(--green-d);font-family:var(--mono);font-weight:600;font-size:12px;cursor:pointer;transition:.14s}
.ckl-eadd button:hover{border-color:var(--green);background:var(--green-wash)}


.ckw-cols{display:grid;grid-template-columns:1fr 1fr}
.ckw-col{min-width:0}
.ckw-col:first-child{border-right:1px solid var(--line)}
.ckw-colempty{padding:40px 20px;color:var(--faint);font-size:12px;text-align:center}
.ckw-noterow.pin{color:#d63939;font-weight:700;font-style:normal;background:#fff5f5;border-left:3px solid #d63939;padding:11px 20px}
@media(max-width:900px){.ckw-cols{grid-template-columns:1fr}.ckw-col:first-child{border-right:none;border-bottom:1px solid var(--line)}}

</style>
</head>

rrentColor\" stroke-width=\"1.8\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/><\/svg>',\n  layers:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"m12 2 9 5-9 5-9-5 9-5Z\"/><path d=\"m3 12 9 5 9-5M3 17l9 5 9-5\"/><\/svg>',\n  truck:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M1 6h13v10H1zM14 9h4l3 3v4h-7\"/><circle cx=\"6\" cy=\"18\" r=\"2\"/><circle cx=\"18\" cy=\"18\" r=\"2\"/><\/svg>',\n  tag:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M20 13.5 13.5 20a2 2 0 0 1-2.8 0L3 12.3V3h9.3L20 10.7a2 2 0 0 1 0 2.8Z\"/><circle cx=\"7.5\" cy=\"7.5\" r=\"1.2\"/><\/svg>',\n  cal:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M16 2v4M8 2v4M3 10h18\"/><\/svg>',\n  doc:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z\"/><path d=\"M14 2v6h6\"/><\/svg>',\n  info:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 16v-4M12 8h.01\"/><\/svg>',\n  empty:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2Z\"/><\/svg>',\n  upload:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/><path d=\"M17 8l-5-5-5 5M12 3v12\"/><\/svg>',\n  download:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/><path d=\"M7 10l5 5 5-5M12 15V3\"/><\/svg>',\n  copy:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/><\/svg>',\n  refresh:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6\"/><\/svg>',\n  coin:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M14.5 9.5a2.5 2 0 0 0-2.5-1.5c-1.4 0-2.5.7-2.5 1.8 0 2.4 5 1.2 5 3.6 0 1.1-1.1 1.8-2.5 1.8a2.5 2 0 0 1-2.5-1.5M12 6.5v11\"/><\/svg>',\n};\n\n/* HK & TW use China flag per project convention */\nconst COUNTRIES=[\n  {id:'CN',name:'China',flag:'cn',cur:'USD'},{id:'JP',name:'Japan',flag:'jp',cur:'USD'},\n  {id:'VN',name:'Vietnam',flag:'vn',cur:'USD'},{id:'ID',name:'Indonesia',flag:'id',cur:'USD'},\n  {id:'IN',name:'India',flag:'in',cur:'USD'},{id:'TH',name:'Thailand',flag:'th',cur:'USD'},\n  {id:'KR',name:'South Korea',flag:'kr',cur:'USD'},{id:'MY',name:'Malaysia',flag:'my',cur:'USD'},\n  {id:'BD',name:'Bangladesh',flag:'bd',cur:'USD'},{id:'US',name:'USA',flag:'us',cur:'USD'},\n  {id:'TW',name:'Taiwan',flag:'cn',cur:'USD'},{id:'HK',name:'Hong Kong',flag:'cn',cur:'USD'},\n  {id:'MX',name:'Mexico',flag:'mx',cur:'USD'},\n];\nconst flagURL=c=>`https://flagcdn.com/w40/${c}.png`;\nconst CONTAINERS=['20GP','40GP','40HC','45HC'];\nconst DEFAULT_CURRENCIES=[\n  {code:'USD',name:'US Dollar',sym:'$',rate:1,base:true},\n  {code:'EUR',name:'Euro',sym:'\u20ac',rate:0.92},\n  {code:'CNY',name:'Chinese Yuan',sym:'\u00a5',rate:7.15},\n  {code:'JPY',name:'Japanese Yen',sym:'\u00a5',rate:156},\n  {code:'VND',name:'Vietnamese Dong',sym:'\u20ab',rate:25400},\n];\nconst TRUCKS=[['1T','1 ton'],['2.5T','2.5 ton'],['5T','5 ton'],['8T','8 ton'],['10T','10 ton'],['15T','15 ton'],['18T','18 ton']];\n\nconst DEFAULT_NAV=[\n  {id:'master',label:'Base Data',icon:'db',items:[\n    {id:'ports',label:'International Seaports'},{id:'cfs',label:'CFS Warehouses'},{id:'admin',label:'Postal Code'},{id:'fx',label:'Ex.Rate'}]},\n  {id:'origin',label:'At Origin',icon:'pin',items:[\n    {id:'o_customs',label:'Customs Fee'},{id:'o_inspect',label:'Inspection Fee'},{id:'o_truck',label:'Trucking Fee'},\n    {id:'o_demur',label:'Demurrage Fee'},{id:'o_lift',label:'Lift On/Off Fee'},{id:'o_infra',label:'Port Infrastructure Fee'}]},\n  {id:'sea',label:'Sea Freight',icon:'ship',items:[\n    {id:'ocean',label:'Ocean Freight (OFR)'},{id:'surcharge',label:'Freight Surcharges'},\n    {id:'lc_origin',label:'Local Charge \u2014 Origin'},{id:'lc_dest',label:'Local Charge \u2014 Destination'}]},\n  {id:'dest',label:'At Destination',icon:'layers',items:[\n    {id:'d_handling',label:'Handling Fee'},{id:'d_customs',label:'Customs Fee'},{id:'d_inspect',label:'Inspection Fee'},\n    {id:'d_truck',label:'Trucking Fee'},{id:'d_demur',label:'Demurrage Fee'},{id:'d_lift',label:'Lift On/Off Fee'},\n    {id:'d_infra',label:'Port Infrastructure Fee'}]},\n];\n\nconst LC_ORIGIN=[\n  {v:'THC',label:'THC',fcl:true,lclUnit:'W/M'},{v:'B/L',label:'B/L Fee',flatUnit:'SET'},\n  {v:'Seal',label:'Seal',fcl:true,lclUnit:null},{v:'Telex',label:'Telex Release',flatUnit:'SET'},\n  {v:'Other',label:'Other fee\u2026',fcl:true,lclUnit:'SET',free:true},\n];\nconst LC_DEST=[\n  {v:'THC',label:'THC',fcl:true,lclUnit:'W/M'},{v:'D/O',label:'D/O Fee',flatUnit:'SET'},\n  {v:'Cleaning',label:'Cleaning Fee',fcl:true,lclUnit:'W/M'},{v:'EMC',label:'EMC (Equip. Mgmt)',fcl:true,lclUnit:null},\n  {v:'CFS',label:'CFS Fee',fcl:false,lclUnit:'W/M'},{v:'Other',label:'Other fee\u2026',fcl:true,lclUnit:'W/M',free:true},\n];\n\nconst DEFAULT_PAGES={\n  ports:{kind:'master-ports',title:'International Seaports',group:'master',desc:'Seaport catalog (UN/LOCODE) used as base data for trucking fees and transport lanes.'},\n  cfs:{kind:'master-cfs',title:'CFS Warehouses',group:'master',desc:'CFS consolidation warehouse catalog per country.'},\n  admin:{kind:'master-admin',title:'Postal Code',group:'master',desc:'Province / District / Ward and international-standard postal codes \u2014 the suggestion source for the trucking-fee input.'},\n  fx:{kind:'master-fx',title:'Exchange Rates',group:'master',desc:'Currency catalog and exchange rates (base USD). Add / edit / delete currencies and refresh rates live from the web. Rates here drive the currency options across all fee inputs.'},\n  o_customs:{kind:'fee',title:'Customs Fee \u2014 At Origin',group:'origin',fcl:true,lclUnit:'set',scope:'port',validity:true,desc:'Fixed fee. FCL charged per container; LCL per set.'},\n  o_inspect:{kind:'fee',title:'Inspection Fee \u2014 At Origin',group:'origin',fcl:true,lclUnit:'set',scope:'port',validity:true,inspect:true,desc:'Fixed fee. Additional costs arising from actual inspection: per invoice.'},\n  o_truck:{kind:'trucking',title:'Trucking Fee \u2014 At Origin',group:'origin',validity:true,desc:'Select a port/CFS + postal code (suggested with administrative unit). FCL per container; LCL per truck type (tonnage).'},\n  o_demur:{kind:'fee',title:'Demurrage Fee \u2014 At Origin',group:'origin',fcl:true,lclUnit:'truck/night',scope:'port',validity:true,desc:'Fixed fee. FCL per container; LCL per truck/night.'},\n  o_lift:{kind:'fee',title:'Lift On/Off Fee \u2014 At Origin',group:'origin',fcl:true,lclUnit:null,scope:'port',validity:true,desc:'Fixed fee. FCL per container. Not applicable to LCL.'},\n  o_infra:{kind:'fee',title:'Port Infrastructure Fee \u2014 At Origin',group:'origin',fcl:true,lclUnit:'tons',scope:'port',validity:true,desc:'Fixed fee. FCL per container; LCL per ton.'},\n  ocean:{kind:'ocean',title:'Ocean Freight',group:'sea',validity:true,desc:'FCL per container; LCL per set. Includes sailing schedule (ETD/ETA), transit time, via, freetime at origin & destination.'},\n  surcharge:{kind:'fee',title:'Freight Surcharges',group:'sea',feeTypes:['BAF','YAS','RR'],fcl:true,lclUnit:'W/M',validity:true,desc:'BAF / YAS / RR\u2026 FCL per container; LCL per W/M.'},\n  lc_origin:{kind:'localcharge',title:'Local Charge \u2014 At Origin',group:'sea',lcset:LC_ORIGIN,validity:true,desc:'THC, B/L, Seal, Telex and other fees. Unit is auto-set by fee type.'},\n  lc_dest:{kind:'localcharge',title:'Local Charge \u2014 At Destination',group:'sea',lcset:LC_DEST,validity:true,desc:'THC, D/O, Cleaning, EMC, CFS and other fees. Unit is auto-set by fee type.'},\n  d_handling:{kind:'flat',title:'Handling Fee \u2014 At Destination',group:'dest',flatUnit:'B/L',validity:true,desc:'Charged per B/L for both FCL and LCL.'},\n  d_customs:{kind:'fee',title:'Customs Fee \u2014 At Destination',group:'dest',fcl:true,lclUnit:'set',scope:'port',validity:true,desc:'Fixed fee. FCL per container; LCL per set.'},\n  d_inspect:{kind:'fee',title:'Inspection Fee \u2014 At Destination',group:'dest',fcl:true,lclUnit:'set',scope:'port',validity:true,inspect:true,desc:'Fixed fee. Additional costs from actual inspection: per invoice.'},\n  d_truck:{kind:'trucking',title:'Trucking Fee \u2014 At Destination',group:'dest',validity:true,desc:'Same structure as At Origin trucking: port/CFS + postal code, FCL per container / LCL per truck type.'},\n  d_demur:{kind:'fee',title:'Demurrage Fee \u2014 At Destination',group:'dest',fcl:true,lclUnit:'truck/night',scope:'port',validity:true,desc:'Fixed fee. FCL per container; LCL per truck/night.'},\n  d_lift:{kind:'fee',title:'Lift On/Off Fee \u2014 At Destination',group:'dest',fcl:true,lclUnit:null,scope:'port',validity:true,desc:'Fixed fee. FCL per container. Not applicable to LCL.'},\n  d_infra:{kind:'fee',title:'Port Infrastructure Fee \u2014 At Destination',group:'dest',fcl:true,lclUnit:'tons',scope:'port',validity:true,desc:'Fixed fee. FCL per container; LCL per ton.'},\n};\n\n/* ===== EDITABLE MENU (categories + items) ===== */\nlet META={},NAV,PAGES;\nconst META_KEY='shoptrans_pricing_meta_v1';\nconst LOCKED_GROUPS=['master','origin','sea','dest'];\nfunction groupLocked(id){return LOCKED_GROUPS.includes(id);}\nconst LOCK_SVG='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"/><\/svg>';\nfunction seedMeta(){return {nav:JSON.parse(JSON.stringify(DEFAULT_NAV)),pages:JSON.parse(JSON.stringify(DEFAULT_PAGES))};}\nfunction loadMeta(){let m=null;try{const r=localStorage.getItem(META_KEY);if(r)m=JSON.parse(r);}catch(e){}\n  if(!m||!Array.isArray(m.nav)||!m.pages)m=seedMeta();\n  META=m;NAV=META.nav;PAGES=META.pages;migrateMeta();}\nfunction migrateMeta(){\n  if(!Array.isArray(META.currencies)||!META.currencies.length)META.currencies=JSON.parse(JSON.stringify(DEFAULT_CURRENCIES));\n  if(!META.currencies.some(c=>c.code==='USD'))META.currencies.unshift({code:'USD',name:'US Dollar',sym:'$',rate:1,base:true});\n  if(!PAGES.fx)PAGES.fx={kind:'master-fx',title:'Exchange Rates',group:'master',desc:'Currency catalog and exchange rates (base USD). Add / edit / delete currencies and refresh rates live from the web. Rates here drive the currency options across all fee inputs.'};\n  const mg=NAV.find(g=>g.id==='master');if(mg&&!mg.items.some(i=>i.id==='fx'))mg.items.push({id:'fx',label:'Ex.Rate'});\n  if(!META.fxSource)META.fxSource='https://open.er-api.com/v6/latest/USD';\n  if(!META.fxHistory||typeof META.fxHistory!=='object')META.fxHistory={};\n}\nfunction persistMeta(){try{localStorage.setItem(META_KEY,JSON.stringify(META));}catch(e){}}\nfunction resetMenu(){confirmModal({title:'Reset menu to default?',message:'The whole menu (categories &amp; items) returns to the default structure. Your entered rate data and currencies are kept.',confirmLabel:'Reset menu',onConfirm:()=>{\n  const cur=(META.currencies&&META.currencies.length)?JSON.parse(JSON.stringify(META.currencies)):JSON.parse(JSON.stringify(DEFAULT_CURRENCIES));\n  META=seedMeta();META.currencies=cur;NAV=META.nav;PAGES=META.pages;migrateMeta();ensureDB();persistMeta();persist();state.page=firstPage();state.editMenu=false;renderAll();toast('Menu reset to default');}});}\nfunction findNavItem(pid){for(const g of NAV){const it=g.items.find(x=>x.id===pid);if(it)return it;}return null;}\nfunction removeNavItem(pid){for(const g of NAV){const i=g.items.findIndex(x=>x.id===pid);if(i>=0)return g.items.splice(i,1)[0];}return null;}\nfunction firstPage(){for(const g of NAV){if(g.items.length)return g.items[0].id;}return null;}\nfunction ensureDB(){COUNTRIES.forEach(c=>{if(!DB[c.id])DB[c.id]={};Object.keys(PAGES).forEach(p=>{if(!DB[c.id][p])DB[c.id][p]=[];});});}\n\n/* ===== DUSTBIN (soft-delete store) ===== */\nlet TRASH=[];\nconst TRASH_KEY='shoptrans_pricing_trash_v1';\nfunction loadTrash(){try{const r=localStorage.getItem(TRASH_KEY);TRASH=r?JSON.parse(r):[];}catch(e){TRASH=[];}if(!Array.isArray(TRASH))TRASH=[];}\nfunction persistTrash(){try{localStorage.setItem(TRASH_KEY,JSON.stringify(TRASH));}catch(e){}}\nfunction clone(o){return JSON.parse(JSON.stringify(o));}\nfunction pushTrash(entry){entry.tid='t'+uid().slice(1);entry.deletedAt=new Date().toISOString();TRASH.unshift(entry);persistTrash();}\nfunction recLabel(r){\n  if(!r)return 'record';\n  if(r.code)return r.code+(r.name?' \u00b7 '+r.name:'');\n  if(r.zip&&r.prov)return r.zip+' \u00b7 '+r.prov;\n  if(r.pol)return r.pol+' \u2192 '+(r.pod||'');\n  if(r.port)return r.port+(r.zip?' \u00b7 '+r.zip:'');\n  if(r.feeType)return r.feeType+(r.mode?' \u00b7 '+r.mode:'');\n  if(r.scope)return r.scope+(r.mode?' \u00b7 '+r.mode:'');\n  return (r.mode||'rate')+(r.unit?' /'+r.unit:'');\n}\nfunction fmtWhen(iso){try{const d=new Date(iso);return d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}}\n\nfunction restoreTrash(tid){\n  const i=TRASH.findIndex(t=>t.tid===tid);if(i<0)return;const e=TRASH[i];\n  if(e.type==='record'){\n    if(!PAGES[e.page]){toast('Parent item no longer exists \u2014 restore it first',true);return;}\n    if(!DB[e.country])DB[e.country]={};if(!DB[e.country][e.page])DB[e.country][e.page]=[];\n    DB[e.country][e.page].push(clone(e.payload));persist();\n  }else if(e.type==='item'){\n    const pid=e.page;PAGES[pid]=clone(e.config);\n    let g=NAV.find(x=>x.id===e.group)||NAV[0];if(!g){toast('No category to restore into',true);return;}\n    if(!findNavItem(pid))g.items.push({id:pid,label:e.label});\n    COUNTRIES.forEach(c=>{if(!DB[c.id])DB[c.id]={};DB[c.id][pid]=clone((e.data&&e.data[c.id])||[]);});\n    persistMeta();persist();\n  }else if(e.type==='group'){\n    const G=clone(e.group);\n    if(!NAV.find(x=>x.id===G.id))NAV.push(G);else NAV.find(x=>x.id===G.id).items=G.items;\n    Object.keys(e.pages).forEach(pid=>PAGES[pid]=clone(e.pages[pid]));\n    COUNTRIES.forEach(c=>{if(!DB[c.id])DB[c.id]={};Object.keys((e.data&&e.data[c.id])||{}).forEach(pid=>DB[c.id][pid]=clone(e.data[c.id][pid]));});\n    persistMeta();persist();\n  }\n  TRASH.splice(i,1);persistTrash();renderAll();toast('Restored');\n}\nfunction purgeTrash(tid){const i=TRASH.findIndex(t=>t.tid===tid);if(i<0)return;const e=TRASH[i];\n  confirmModal({title:'Delete permanently?',message:`\u201c${esc(e.label||'this entry')}\u201d will be permanently removed from the Dustbin. This cannot be undone.`,confirmLabel:'Delete forever',onConfirm:()=>{\n    const j=TRASH.findIndex(t=>t.tid===tid);if(j>=0)TRASH.splice(j,1);persistTrash();renderAll();toast('Permanently deleted',true);}});}\nfunction emptyTrash(){if(!TRASH.length)return;\n  confirmModal({title:'Empty the Dustbin?',message:`All ${TRASH.length} item(s) in the Dustbin will be permanently deleted. This cannot be undone.`,confirmLabel:'Empty dustbin',onConfirm:()=>{\n    TRASH=[];persistTrash();renderAll();toast('Dustbin emptied',true);}});}\nfunction openTrash(){state.view='trash';renderAll();}\nfunction closeTrash(){state.view='data';renderAll();}\n\n/* ===== STATE + STORAGE ===== */\nlet DB={};\nconst STORE_KEY='shoptrans_pricing_v2';\nfunction loadDB(){try{const r=localStorage.getItem(STORE_KEY);if(r){DB=JSON.parse(r);ensureDB();return;}}catch(e){}DB=seedDB();persist();}\nfunction persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(DB));}catch(e){}}\nlet state={country:'VN',page:'ports',search:'',modeFilter:'ALL',pageSize:25,pageIndex:0,editMenu:false,view:'data',selected:new Set(),fxDate:null,sort:{col:null,dir:1}};\nfunction uid(){return 'r'+Math.random().toString(36).slice(2,9)}\nlet _seq=0;function nowTs(){return Date.now()+(++_seq)/1e6;}\nfunction rec(o){return Object.assign({id:uid()},o)}\nconst fee=rec,truck=rec,ocean=rec,lc=rec,flat=rec;\n\n\nfunction seedDB(){\n  const d={};COUNTRIES.forEach(c=>{d[c.id]={};Object.keys(PAGES).forEach(p=>d[c.id][p]=[]);});\n  d.VN.ports=[{id:uid(),code:'VNSGN',name:'Cat Lai',city:'Ho Chi Minh City'},{id:uid(),code:'VNHPH',name:'Hai Phong Port',city:'Hai Phong'},{id:uid(),code:'VNCMT',name:'Cai Mep \u2014 Thi Vai',city:'Ba Ria\u2013Vung Tau'}];\n  d.VN.cfs=[{id:uid(),code:'VN-CFS-SNP',name:'Tan Cang CFS \u2014 Cat Lai',addr:'Nguyen Thi Dinh, HCMC',port:'VNSGN'},{id:uid(),code:'VN-CFS-HPH',name:'Green Logistics CFS',addr:'Dinh Vu, Hai Phong',port:'VNHPH'}];\n  d.VN.admin=[{id:uid(),prov:'Ho Chi Minh City',dist:'District 7',ward:'Tan Thuan Dong',zip:'72915'},{id:uid(),prov:'Ho Chi Minh City',dist:'Thu Duc City',ward:'Linh Trung',zip:'71308'},{id:uid(),prov:'Binh Duong',dist:'Di An',ward:'Tan Dong Hiep',zip:'75358'},{id:uid(),prov:'Hai Phong',dist:'Hai An',ward:'Dong Hai 2',zip:'04211'},{id:uid(),prov:'Dong Nai',dist:'Bien Hoa',ward:'Long Binh',zip:'76105'}];\n  d.VN.o_customs=[fee({scope:'VNSGN',mode:'FCL',r:{'20GP':35,'40GP':50,'40HC':50,'45HC':55},cur:'USD'}),fee({scope:'VNSGN',mode:'LCL',r:{val:25},unit:'set',cur:'USD'})];\n  d.VN.o_inspect=[fee({scope:'VNSGN',mode:'FCL',r st ${state.view==='trash'?'active':''}\" onclick=\"openTrash()\">${I.trash}<span>Dustbin<\/span>${TRASH.length?`<span class=\"dust-badge\">${TRASH.length}<\/span>`:''}<\/button>`;\n  sb.classList.toggle('edit',ed);\n  sb.innerHTML=top+groups+addGroupBtn+dust;\n}\nfunction toggleEditMenu(){state.editMenu=!state.editMenu;renderSidebar();}\nfunction toggleGroup(gid){const g=NAV.find(x=>x.id===gid);if(!g)return;const cur=PAGES[state.page];if(state.view!=='data'||!cur||cur.group!==gid){if(g.items.length)setPage(g.items[0].id);else renderAll();return;}renderAll();}\nfunction setPage(p){state.page=p;state.search='';state.modeFilter='ALL';state.pageIndex=0;state.view='data';renderAll();}\nfunction groupLabel(g){const x=NAV.find(n=>n.id===g);return x?x.label:'\u2014'}\n\n/* ===== main ===== */\nfunction renderMain(){\n  state.selected.clear();state.sort={col:null,dir:1};\n  if(state.view==='trash'){renderTrash();return;}\n  const def=PAGES[state.page];const c=cc();\n  if(def&&def.kind==='master-fx'){renderFxPage(def);return;}\n  if(!def){document.getElementById('main').innerHTML=`<div class=\"page-head\"><div><div class=\"page-title\">No items<\/div><div class=\"page-desc\">The menu is empty. Turn on <b>Edit<\/b> in the sidebar and add a category or item to start.<\/div><\/div><\/div><div class=\"card\"><div class=\"empty\">${I.empty}<p>Nothing to show<\/p><span>Use the sidebar \u201cEdit\u201d button to create your first item.<\/span><\/div><\/div>`;return;}\n  const inspectCallout=def.inspect?`<div class=\"callout\">${I.info}<div><b>Inspection note:<\/b> Additional costs arising from inspection are billed <b>per actual invoice<\/b>, not fixed in this rate table.<\/div><\/div>`:'';\n  const truckNote=def.kind==='trucking'?`<div class=\"callout green\">${I.info}<div>Select the origin <b>port / CFS<\/b>, then type a <b>postal code<\/b> \u2014 suggestions show the administrative unit name for precise selection. Enter FCL per container, LCL per truck type (tonnage).<\/div><\/di
