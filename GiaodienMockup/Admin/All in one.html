c(e.label||'\u2014')}<\/b><\/td>\n      <td class=\"note-text\" style=\"max-width:280px\">${trashContext(e)}<\/td>\n      <td class=\"valid\">${fmtWhen(e.deletedAt)}<\/td>\n      <td><div class=\"row-actions\">\n        <button class=\"btn btn-ghost btn-sm\" onclick=\"restoreTrash('${e.tid}')\">${I.upload} Restore<\/button>\n        <button class=\"icon-btn del\" title=\"Delete permanently\" onclick=\"purgeTrash('${e.tid}')\">${I.trash}<\/button>\n      <\/div><\/td>\n    <\/tr>`).join('');\n  const table=TRASH.length\n    ? `<div class=\"tbl-wrap\"><table><thead><tr><th>Type<\/th><th>Name<\/th><th>Origin<\/th><th>Deleted<\/th><th><\/th><\/tr><\/thead><tbody>${rowsHtml}<\/tbody><\/table><\/div>\n       <div class=\"tbl-foot\"><span>${TRASH.length} item(s) in Dustbin<\/span><span>Restored items return to their original place<\/span><\/div>`\n    : `<div class=\"empty\">${I.trash}<p>Dustbin is empty<\/p><span>Deleted records, items and categories are kept here so you can restore them.<\/span><\/div>`;\n  document.getElementById('main').innerHTML=`\n    <div class=\"crumb\">Menu <b>\u203a<\/b> Dustbin<\/div>\n    <div class=\"page-head\">\n      <div><div class=\"page-title\">Dustbin<\/div><div class=\"page-desc\">Anything you delete \u2014 a single rate, a whole fee item, or a category \u2014 is kept here and can be restored or removed permanently.<\/div><\/div>\n      <div class=\"spacer\"><\/div>\n      <button class=\"btn btn-ghost\" onclick=\"closeTrash()\">${I.chev} Back to data<\/button>\n    <\/div>\n    <div class=\"toolbar\">\n      <div style=\"flex:1\"><\/div>\n      <button class=\"btn ${TRASH.length?'btn-ghost':''}\" ${TRASH.length?'':'disabled style=\"opacity:.4;cursor:not-allowed\"'} onclick=\"emptyTrash()\">${I.trash} Empty dustbin<\/button>\n    <\/div>\n    <div class=\"card\">${table}<\/div>`;\n}\nfunction modeFilterHTML(def){\n  if(!['fee','trucking','ocean'].includes(def.kind))return'';\n  if(def.kind==='fee'&&def.lclUnit===null)return'';\n  const mk=(v,l)=>`<button class=\"${state.modeFilter===v?'on':''}\" onclick=\"setMode('${v}')\">${l}<\/button>`;\n  return `<div class=\"seg\">${mk('ALL','All')}${mk('FCL','FCL')}${mk('LCL','LCL')}<\/div>`;\n}\nfunction setMode(m){state.modeFilter=m;state.pageIndex=0;renderMain();}\nfunction onSearch(v){state.search=v;state.pageIndex=0;renderTableOnly();}\nfunction setPageSize(v){state.pageSize=v==='all'?'all':Number(v);state.pageIndex=0;renderTableOnly();}\nfunction gotoPage(i){state.pageIndex=i;renderTableOnly();const w=document.querySelector('.tbl-wrap');if(w)w.scrollIntoView({block:'nearest'});}\nfunction renderTableOnly(){document.querySelector('.card').innerHTML=renderTable(PAGES[state.page]);}\n\n/* ===== multi-select + bulk actions ===== */\nconst SELECTABLE=['fee','trucking','ocean','localcharge','flat','master-ports','master-cfs','master-admin'];\nfunction isSelectable(){const d=PAGES[state.page];return d&&SELECTABLE.includes(d.kind);}\nfunction selCell(id){const on=state.selected.has(id);return `<td class=\"sel-col\"><input type=\"checkbox\" class=\"rsel\" ${on?'checked':''} onclick=\"toggleSel('${id}')\"><\/td>`;}\nfunction selAllInner(){const ids=filtered().map(x=>x.id);const on=ids.length&&ids.every(i=>state.selected.has(i));return `<span class=\"sel-all\"><input type=\"checkbox\" ${on?'checked':''} onclick=\"toggleSelAll()\"><\/span>`;}\nfunction toggleSel(id){if(state.selected.has(id))state.selected.delete(id);else state.selected.add(id);renderTableOnly();renderBulkTools();}\nfunction toggleSelAll(){const ids=filtered().map(x=>x.id);const allOn=ids.length&&ids.every(i=>state.selected.has(i));if(allOn)ids.forEach(i=>state.selected.delete(i));else ids.forEach(i=>state.selected.add(i));renderTableOnly();renderBulkTools();}\nfunction clearSel(){state.selected.clear();renderTableOnly();renderBulkTools();}\nfunction bulkToolsHTML(){if(!isSelectable())return'';const n=state.selected.size;const dis=n?'':'disabled';\n  return `${n?`<span class=\"bb-count\">${n} selected<\/span>`:''}\n    <button class=\"btn btn-ghost\" ${dis} onclick=\"bulkCopy()\">${I.copy} Copy<\/button>\n    <button class=\"btn bb-del\" ${dis} onclick=\"bulkDelete()\">${I.trash} Delete<\/button>\n    <button class=\"btn btn-ghost\" ${dis} onclick=\"clearSel()\">${I.x} Clear<\/button>`;}\nfunction renderBulkTools(){const el=document.getElementById('bulkTools');if(el)el.innerHTML=bulkToolsHTML();}\nfunction selectedRows(){const set=state.selected;return rows().filter(r=>set.has(r.id));}\nfunction bulkCopy(){const sel=selectedRows();if(!sel.length)return;const list=rows();\n  const copies=sel.map(r=>{const c=clone(r);c.id=uid();c.ts=nowTs();return c;});\n  list.unshift(...copies);\n  persist();state.selected.clear();state.pageIndex=0;renderAll();toast(`${sel.length} record(s) copied to top`);}\nfunction bulkDelete(){const sel=selectedRows();if(!sel.length)return;const def=PAGES[state.page];\n  confirmModal({title:`Move ${sel.length} record(s) to Dustbin?`,message:`The selected ${sel.length} record(s) will be moved to the Dustbin. You can restore them later.`,confirmLabel:'Move to Dustbin',onConfirm:()=>{\n    const ids=new Set(state.selected);\n    rows().filter(r=>ids.has(r.id)).forEach(r=>pushTrash({type:'record',country:state.country,page:state.page,pageTitle:def?def.title:state.page,label:recLabel(r),payload:clone(r)}));\n    DB[state.country][state.page]=rows().filter(r=>!ids.has(r.id));\n    state.selected.clear();persist();renderAll();toast(`${ids.size} record(s) moved to Dustbin`);}});}\n\n/* ===== Exchange Rates page ===== */\nfunction fxToday(){return new Date().toISOString().slice(0,10);}\nfunction fxDatesList(){const h=META.fxHistory||{};const s=new Set(Object.keys(h));s.add(fxToday());return [...s].sort().reverse();}\nfunction snapshotFx(){const snap={};(META.currencies||[]).forEach(c=>snap[c.code]=c.base?1:c.rate);META.fxHistory=META.fxHistory||{};META.fxHistory[fxToday()]=snap;}\nfunction setFxDate(d){state.fxDate=d;renderFxPage(PAGES.fx);}\nfunction copyFxSource(){const v=(document.getElementById('fxSrc')||{}).value||META.fxSource||'';\n  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(()=>toast('Source link copied')).catch(()=>toast('Copy failed \u2014 select & copy manually',true));}\n  else{const i=document.getElementById('fxSrc');if(i){i.removeAttribute('readonly');i.select();try{document.execCommand('copy');toast('Source link copied');}catch(e){toast('Copy failed',true);}i.setAttribute('readonly','');}}}\nfunction saveFxSource(v){META.fxSource=(v||'').trim();persistMeta();}\nfunction renderFxPage(def){\n  const list=META.currencies||[];\n  const today=fxToday();\n  const dates=fxDatesList();\n  if(!state.fxDate||(state.fxDate!==today&&!(META.fxHistory||{})[state.fxDate]))state.fxDate=today;\n  const live=state.fxDate===today;\n  const snap=live?null:(META.fxHistory||{})[state.fxDate]||{};\n  const rateOf=c=>c.base?1:(live?c.rate:(snap[c.code]!=null?snap[c.code]:null));\n  const dateOpts=dates.map(d=>`<option value=\"${d}\" ${d===state.fxDate?'selected':''}>${d}${d===today?' \u00b7 today (live)':''}<\/option>`).join('');\n  const body=list.map(c=>{const rt=rateOf(c);const has=rt!=null;return `<tr>\n      <td class=\"code-cell\">${esc(c.code)}<\/td>\n      <td>${esc(c.name||'')}<\/td>\n      <td class=\"fx-sym\">${esc(c.sym||'')}<\/td>\n      <td class=\"fx-rate\">${c.base?'1.000000':(has?fmt6(rt):'<span style=\"color:var(--g300)\">\u2014<\/span>')}<\/td>\n      <td>${c.base?'<span class=\"fx-base\">BASE<\/span>':(has?'<span class=\"note-text\">1 USD = '+fmt6(rt)+' '+esc(c.code)+'<\/span>':'<span class=\"note-text\" style=\"color:var(--g300)\">no rate on this date<\/span>')}<\/td>\n      ${live?`<td><div class=\"row-actions\"><button class=\"icon-btn\" title=\"Edit\" onclick=\"openFxForm('${esc(c.code)}')\">${I.edit}<\/button>${c.base?'':`<button class=\"icon-btn del\" title=\"Delete\" onclick=\"delFx('${esc(c.code)}')\">${I.trash}<\/button>`}<\/div><\/td>`:'<td><span class=\"note-text\" style=\"color:var(--g300)\">read-only<\/span><\/td>'}\n    <\/tr>`;}).join('');\n  const table=list.length?`<div class=\"tbl-wrap\"><table><thead><tr><th>Code<\/th><th>Currency<\/th><th>Symbol<\/th><th>Rate (1 USD =)<\/th><th>Note<\/th><th><\/th><\/tr><\/thead><tbody>${body}<\/tbody><\/table><\/div>\n     <div class=\"tbl-foot\"><span>${list.length} currency(ies) \u00b7 base USD<\/span><span class=\"fx-meta\">${live?(META.fxUpdated?'<span class=\"fx-dot\"><\/span>Last fetch '+fmtWhen(META.fxUpdated):'Live / manual rates'):'Historical snapshot \u00b7 '+state.fxDate}<\/span><\/div>`\n    :`<div class=\"empty\">${I.coin}<p>No currencies<\/p><span>Add a currency to start.<\/span><\/div>`;\n  const histNote=live?'':`<div class=\"callout\">${I.info}<div>Viewing the saved snapshot for <b>${state.fxDate}<\/b>. Switch back to <b>today<\/b> to edit, add or delete currencies.<\/div><\/div>`;\n  document.getElementById('main').innerHTML=`\n    <div class=\"crumb\">${groupLabel(def.group)} <b>\u203a<\/b> ${def.title}<\/div>\n    <div class=\"page-head\">\n      <div><div class=\"page-title\">${def.title}<\/div><\/div>\n      <div class=\"spacer\"><\/div>\n      <div class=\"fx-datepick\">${I.cal}<span>Rates as of<\/span><select class=\"fx-date\" onchange=\"setFxDate(this.value)\">${dateOpts}<\/select><\/div>\n    <\/div>\n    <div class=\"fx-bar\">\n      <span class=\"fx-bar-label\">${I.refresh} Source<\/span>\n      <input id=\"fxSrc\" type=\"text\" value=\"${esc(META.fxSource||'')}\" placeholder=\"https://\u2026 (JSON with a \u201crates\u201d object, base USD)\" spellcheck=\"false\" onchange=\"saveFxSource(this.value)\">\n      <button class=\"btn btn-ghost\" onclick=\"copyFxSource()\">${I.copy} Copy link<\/button>\n    <\/div>\n    ${histNote}\n    <div class=\"toolbar\">\n      <div style=\"flex:1\"><\/div>\n      <button class=\"btn btn-ghost\" id=\"fxFetchBtn\" ${live?'':'disabled'} onclick=\"fetchRates()\">${I.refresh} Fetch &amp; save today<\/button>\n      <button class=\"btn btn-primary\" ${live?'':'disabled'} onclick=\"openFxForm()\">${I.plus} Add currency<\/button>\n    <\/div>\n    <div class=\"card\">${table}<\/div>`;\n}\nfunction fmt6(v){const n=Number(v);if(!isFinite(n))return'\u2014';return n>=100?n.toLocaleString('en-US',{maximumFractionDigits:2}):n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:6});}\nfunction openFxForm(code){\n  const c=code?(META.currencies.find(x=>x.code===code)||null):null;editFxCode=code||null;\n  const base=c&&c.base;\n  const b=`<div class=\"fgrid\">\n      <div class=\"field\"><label>Currency code<span class=\"req\">*<\/span><\/label><input id=\"x_code\" value=\"${c?esc(c.code):''}\" placeholder=\"EUR / CNY / JPY\u2026\" maxlength=\"6\" ${base?'disabled style=\"background:var(--g50)\"':''}><\/div>\n      <div class=\"field\"><label>Symbol<span class=\"req\">*<\/span><\/label><input id=\"x_sym\" value=\"${c?esc(c.sym):''}\" placeholder=\"\u20ac / \u00a5 / \u20ab\" maxlength=\"4\"><\/div>\n    <\/div>\n    <div class=\"fgrid\">\n      <div class=\"field\"><label>Currency name<\/label><input id=\"x_name\" value=\"${c?esc(c.name||''):''}\" placeholder=\"Euro / Chinese Yuan\u2026\"><\/div>\n      <div class=\"field\"><label>Rate \u2014 1 USD =${base?' (base)':''}<span class=\"req\">*<\/span><\/label><input id=\"x_rate\" type=\"number\" step=\"0.000001\" min=\"0\" inputmode=\"decimal\" data-num=\"money\" value=\"${c?c.rate:''}\" placeholder=\"0.00\" ${base?'disabled style=\"background:var(--g50)\"':''}><\/div>\n    <\/div>\n    ${base?'<div class=\"callout green\" style=\"margin-top:6px\">'+I.info+'<div>USD is the base currency. Its code and rate are fixed at 1.<\/div><\/div>':''}`;\n  document.getElementById('modalHost').innerHTML=modalShell((c?'Edit':'Add')+' currency','Exchange rates \u00b7 base USD',b,true,'saveFx()');\n  document.getElementById('overlay').classList.add('show');\n  setTimeout(()=>{const f=document.querySelector('.modal input:not([disabled])');if(f)f.focus();},50);\n}\nlet editFxCode=null;\nfunction saveFx(){\n  const list=META.currencies;const editing=editFxCode?list.find(x=>x.code===editFxCode):null;\n  if(editing&&editing.base){const sym=gv('x_sym');if(sym)editing.sym=sym;editing.name=gv('x_name')||editing.name;snapshotFx();persistMeta();closeForm();renderAll();toast('Base currency updated');return;}\n  const code=gv('x_code').toUpperCase();const sym=gv('x_sym');const rate=gnum('x_rate');\n  if(!code){toast('Enter a currency code',true);return;}\n  if(!sym){toast('Enter a symbol',true);return;}\n  if(rate==null||!(rate>0)){toast('Enter a rate greater than 0',true);return;}\n  const dup=list.find(x=>x.code===code&&x.code!==editFxCode);\n  if(dup){toast('That currency code already exists',true);return;}\n  if(editing){editing.code=code;editing.sym=sym;editing.name=gv('x_name');editing.rate=rate;toast('Currency updated');}\n  else{list.push({code,sym,name:gv('x_name'),rate});toast('Currency added');}\n  snapshotFx();persistMeta();closeForm();renderAll();\n}\nfunction delFx(code){const c=META.currencies.find(x=>x.code===code);if(!c||c.base)return;\n  const used=fxUsageCount(code);\n  confirmModal({title:'Delete currency?',message:`\u201c${esc(code)}\u201d will be removed from the currency list.${used?` It is currently used by <b>${used}<\/b> rate record(s); those keep their stored code but it will no longer appear as an option.`:''}`,confirmLabel:'Delete currency',onConfirm:()=>{\n    META.currencies=META.currencies.filter(x=>x.code!==code);persistMeta();renderAll();toast('Currency deleted',true);}});}\nfunction fxUsageCount(code){let n=0;Object.keys(DB).forEach(cn=>Object.keys(DB[cn]||{}).forEach(p=>{(DB[cn][p]||[]).forEach(r=>{if(r&&r.cur===code)n++;});}));return n;}\nfunction parseFxJson(d){\n  if(!d||typeof d!=='object')return null;\n  let rates=d.rates||d.conversion_rates||d.data||d.quotes||null;\n  if(!rates||typeof rates!=='object')return null;\n  const out={};Object.keys(rates).forEach(k=>{const code=k.length===6&&k.slice(0,3)==='USD'?k.slice(3):k;const v=Number(rates[k]);if(isFinite(v))out[code]=v;});\n  if(out.USD&&out.USD!==1){const u=out.USD;Object.keys(out).forEach(k=>out[k]=out[k]/u);}\n  return out;\n}\nfunction fetchRates(){\n  const url=(META.fxSource||'').trim();\n  if(!url){toast('Enter a source link first',true);return;}\n  if(!/^https?:\\/\\//i.test(url)){toast('Source must be a valid http(s) link',true);return;}\n  const btn=document.getElementById('fxFetchBtn');if(btn){btn.disabled=true;btn.style.opacity='.6';btn.innerHTML=I.refresh+' Fetching\u2026';}\n  fetch(url).then(r=>r.json()).then(d=>{\n    const rates=parseFxJson(d);if(!rates||!Object.keys(rates).length)throw new Error('bad');\n    let upd=0,miss=[];META.currencies.forEach(c=>{if(c.base){c.rate=1;return;}const v=rates[c.code];if(v!=null&&isFinite(v)){c.rate=v;upd++;}else miss.push(c.code);});\n    META.fxUpdated=new Date().toISOString();state.fxDate=fxToday();snapshotFx();persistMeta();renderAll();\n    toast(`Rates saved for ${fxToday()} \u00b7 ${upd} updated${miss.length?' \u00b7 no data for '+miss.join(', '):''}`);\n  }).catch(()=>{\n    if(btn){btn.disabled=false;btn.style.opacity='';btn.innerHTML=I.refresh+' Fetch &amp; save today';}\n    toast('Could not fetch from that source \u2014 check the link/connection, or edit rates manually',true);\n  });\n}\nfunction filtered(){let r=rows().slice();const q=state.search.trim().toLowerCase();\n  if(q)r=r.filter(x=>JSON.stringify(x).toLowerCase().includes(q));\n  if(state.modeFilter!=='ALL'&&PAGES[state.page].kind!=='localcharge'&&PAGES[state.page].kind!=='flat')r=r.filter(x=>x.mode===state.modeFilter);\n  return r;}\n\n/* ===== table ===== */\nconst curSym=c=>{const m=(META.currencies||[]).find(x=>x.code===c);return m?m.sym:(c?c+' ':'')};\nfunction fmt(v){return Number(v).toLocaleString('en-US',{maximumFractionDigits:2})}\nfunction ratesChips(r){\n  if(r.mode==='FLAT'||!r.mode)return `<div class=\"rates\"><span class=\"rate-chip\">${curSym(r.cur)}<b>${fmt(r.r.val)}<\/b> /${r.unit}<\/span><\/div>`;\n  if(r.mode==='FCL')return `<div class=\"rates\">${CONTAINERS.map(k=>r.r[k]!=null?`<span class=\"rate-chip\">${k} <b>${curSym(r.cur)}${fmt(r.r[k])}<\/b><\/span>`:'').join('')}<\/div>`;\n  if(r.r&&r.r.val!=null)return `<div class=\"rates\"><span class=\"rate-chip\">${curSym(r.cur)}<b>${fmt(r.r.val)}<\/b> /${r.unit}<\/span><\/div>`;\n  return `<div class=\"rates\">${TRUCKS.map(([k])=>r.r[k]!=null?`<span class=\"rate-chip\">${k} <b>${curSym(r.cur)}${fmt(r.r[k])}<\/b><\/span>`:'').join('')}<\/div>`;\n}\nfunction modeTag(m){if(m==='FLAT'||!m)return`<span class=\"tag tag-flat\">FLAT<\/span>`;return `<span class=\"tag tag-${m.toLowerCase()}\">${m}<\/span>`}\nfunction validCell(r){if(!r.from&&!r.to)return'<span class=\"valid\">\u2014<\/span>';return `<span class=\"valid\"><b>${r.from||'\u2026'}<\/b> \u2192 <b>${r.to||'\u2026'}<\/b><\/span>`}\nfunction scopeName(code){const p=masterPorts().find(x=>x.code===code);if(p)return p.name+` <small style=\"color:var(--g300)\">(${code})<\/small>`;\n  const f=masterCFS().find(x=>x.code===code);if(f)return f.name+` <small style=\"color:var(--g300)\">(CFS)<\/small>`;\n  return code||'<span style=\"color:var(--green-dd);font-weight:600\">All ports<\/span>';}\nfunction actions(id){return `<div class=\"row-actions\"><button class=\"icon-btn\" title=\"Edit\" onclick=\"openForm('${id}')\">${I.edit}<\/button><button class=\"icon-btn del\" title=\"Delete\" onclick=\"delRow('${id}')\">${I.trash}<\/button><\/div>`}\nfunction emptyState(){return `<div class=\"empty\">${I.empty}<p>No data yet<\/p><span>Click \u201cAdd new\u201d or \u201cImport Excel\u201d to start entering data for ${cc().name}.<\/span><\/div>`}\n\n/* ===== sorting ===== */\nconst _txt=get=>({num:false,get});\nconst _num=get=>({num:true,get});\nfunction _numv(x){const v=parseFloat(x);return isFinite(v)?v:null;}\nfunction scopeSortKey(code){if(!code)return '';const p=masterPorts().find(x=>x.code===code);if(p)return p.name;const f=masterCFS().find(x=>x.code===code);if(f)return f.name;return code;}\nfunction rateSortVal(r){if(!r||!r.r)return null;if(r.r.val!=null)return Number(r.r.val);const vs=Object.values(r.r).map(Number).filter(isFinite);return vs.length?Math.min(...vs):null;}\nfunction sortDefs(def){switch(def.kind){\n  case 'master-ports':return [_txt(r=>r.code),_txt(r=>r.name),_txt(r=>r.city)];\n  case 'master-cfs':return [_txt(r=>r.code),_txt(r=>r.name),_txt(r=>r.addr),_txt(r=>r.port)];\n  case 'master-admin':return [_txt(r=>r.zip),_txt(r=>r.prov),_txt(r=>r.dist),_txt(r=>r.ward)];\n  case 'fee':{const a=[];if(def.feeTypes)a.push(_txt(r=>r.feeType));if(def.scope)a.push(_txt(r=>scopeSortKey(r.scope)));a.push(_txt(r=>r.mode));a.push(_num(r=>rateSortVal(r)));a.push(_txt(r=>r.from||''));if(def.inspect)a.push(_txt(r=>r.note));return a;}\n  case 'trucking':return [_txt(r=>scopeSortKey(r.port)),_txt(r=>r.zip),_txt(r=>r.mode),_num(r=>rateSortVal(r)),_txt(r=>r.from||'')];\n  case 'ocean':return [_txt(r=>(r.pol||'')+'\u2192'+(r.pod||'')),_txt(r=>r.carrier),_txt(r=>r.mode),_num(r=>rateSortVal(r)),_num(r=>_numv(r.transit)),_num(r=>_numv(r.ftO)),_txt(r=>r.from||'')];\n  case 'localcharge':return [_txt(r=>r.feeType),_txt(r=>r.mode),_num(r=>rateSortVal(r)),_txt(r=>r.from||'')];\n  case 'flat':return [_txt(r=>r.unit),_num(r=>rateSortVal(r)),_txt(r=>r.from||'')];\n}return [];}\nfunction sortRows(arr,def){const s=state.sort;if(!s||s.col==null)return arr;\n  const order=new Map(rows().map((r,i)=>[r.id,i]));let getter,num;\n  if(s.col==='ts'){getter=r=>(r.ts!=null?r.ts:order.get(r.id));num=true;}\n  else{const d=sortDefs(def)[s.col];if(!d)return arr;getter=d.get;num=d.num;}\n  const dir=s.dir;return arr.slice().sort((x,y)=>{\n    let vx=getter(x),vy=getter(y);const ex=(vx==null||vx===''),ey=(vy==null||vy==='');\n    if(ex&&ey)return order.get(x.id)-order.get(y.id);\n    if(ex)return 1;if(ey)return -1;\n    let c=num?(Number(vx)-Number(vy)):String(vx).localeCompare(String(vy),unde ){return rows().find(r=>r.id===id)}\nfunction fldDate(label,id,val){return `<div class=\"field\"><label>${label}<\/label>\n  <div class=\"dp\">\n    <input id=\"${id}\" class=\"dp-input\" type=\"text\" readonly value=\"${val?esc(val):''}\" placeholder=\"yyyy-mm-dd\" title=\"Click to open calendar \u00b7 double-click to type\" onclick=\"if(this.readOnly)dpOpen('${id}')\" ondblclick=\"dpEdit('${id}')\" onblur=\"dpCommit('${id}')\" onkeydown=\"dpKey(event,'${id}')\">\n    <span class=\"dp-ico\" onclick=\"dpOpen('${id}')\">${I.cal}<\/span>\n    <div class=\"dp-pop\" id=\"${id}_pop\"><\/div>\n  <\/div><\/div>`;}\n/* ===== Custom date picker \u2014 always English month/weekday names + Gregorian, value stored as ISO yyyy-mm-dd (locale-independent) ===== */\nconst DP={\n  MON:['January','February','March','April','May','June','July','August','September','October','November','December'],\n  DOW:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],   /* ISO week start = Monday */\n  CHEVL:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"15 18 9 12 15 6\"/><\/svg>',\n  CHEVR:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 18 15 12 9 6\"/><\/svg>',\n  id:null,y:0,m:0,view:'days',decadeStart:0\n};\nfunction dpPad(n){return n<10?'0'+n:''+n}\nfunction dpClose(){document.querySelectorAll('.dp-pop.show').forEach(p=>{p.classList.remove('show');p.style.left='';p.style.right=''});DP.id=null}\nfunction dpOpen(id){\n  const _inp=document.getElementById(id);if(_inp&&!_inp.readOnly)dpCommit(id);\n  if(DP.id===id){dpClose();return}\n  if(id==='f_to'){const f=document.getElementById('f_from');if(_inp)_inp.dataset.dpmin=(f&&f.value)?f.value:'';}\n  if(id==='f_from'){const tEl=document.getElementById('f_to');if(_inp)_inp.dataset.dpmax=(tEl&&tEl.value)?tEl.value:'';}\n  dpClose();DP.id=id;\n  const inp=document.getElementById(id);const v=(inp.value||'').trim();let d=new Date();\n  const mt=/^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(v);if(mt)d=new Date(+mt[1],+mt[2]-1,+mt[3]);\n  DP.y=d.getFullYear();DP.m=d.getMonth();DP.view='days';\n  dpRender();\n  const pop=document.getElementById(id+'_pop');pop.classList.add('show');\n  const r=pop.getBoundingClientRect();\n  if(r.right>window.innerWidth-8){pop.style.left='auto';pop.style.right='0'}\n}\nfunction dpShift(n){\n  if(DP.view==='months'){DP.y+=n;}\n  else if(DP.view==='years'){DP.decadeStart+=n*12;}\n  else{DP.m+=n;if(DP.m<0){DP.m=11;DP.y--}else if(DP.m>11){DP.m=0;DP.y++}}\n  dpRender();\n}\nfunction dpToMonths(){DP.view='months';dpRender();}\nfunction dpToYears(){DP.decadeStart=DP.y-((DP.y%12+12)%12);DP.view='years';dpRender();}\nfunction dpPickMonth(m){DP.m=m;DP.view='days';dpRender();}\nfunction dpPickYear(y){DP.y=y;DP.view='months';dpRender();}\nfunction dpRender(){\n  const pop=document.getElementById(DP.id+'_pop');if(!pop)return;\n  const sel=((document.getElementById(DP.id)||{}).value||'').trim();\n  const smt=/^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(sel);\n  const selY=smt?+smt[1]:null,selM=smt?+smt[2]-1:null;\n  const t=new Date();const tY=t.getFullYear(),tM=t.getMonth();\n  const tIso=tY+'-'+dpPad(tM+1)+'-'+dpPad(t.getDate());\n\n  if(DP.view==='months'){\n    let cells='';for(let i=0;i<12;i++){\n      let c='dp-my-cell';if(DP.y===selY&&i===selM)c+=' sel';if(DP.y===tY&&i===tM)c+=' today';\n      cells+=`<div class=\"${c}\" onclick=\"dpPickMonth(${i})\">${DP.MON[i].slice(0,3)}<\/div>`;\n    }\n    pop.innerHTML=`\n     <div class=\"dp-head\">\n       <button type=\"button\" class=\"dp-nav\" onclick=\"dpShift(-1)\">${DP.CHEVL}<\/button>\n       <button type=\"button\" class=\"dp-title\" onclick=\"dpToYears()\">${DP.y}<\/button>\n       <button type=\"button\" class=\"dp-nav\" onclick=\"dpShift(1)\">${DP.CHEVR}<\/button>\n     <\/div>\n     <div class=\"dp-grid-my\">${cells}<\/div>`;\n    return;\n  }\n  if(DP.view==='years'){\n    const start=DP.decadeStart;let cells='';\n    for(let i=0;i<12;i++){const y=start+i;let c='dp-my-cell';if(y===selY)c+=' sel';if(y===tY)c+=' today';\n      cells+=`<div class=\"${c}\" onclick=\"dpPickYear(${y})\">${y}<\/div>`;}\n    pop.innerHTML=`\n     <div class=\"dp-head\">\n       <button type=\"button\" class=\"dp-nav\" onclick=\"dpShift(-1)\">${DP.CHEVL}<\/button>\n       <div class=\"dp-title\">${start} \u2013 ${start+11}<\/div>\n       <button type=\"button\" class=\"dp-nav\" onclick=\"dpShift(1)\">${DP.CHEVR}<\/button>\n     <\/div>\n     <div class=\"dp-grid-my\">${cells}<\/div>`;\n    return;\n  }\n\n  const inpEl=document.getElementById(DP.id)||{};const dmin=(inpEl.dataset&&inpEl.dataset.dpmin)||'';const dmax=(inpEl.dataset&&inpEl.dataset.dpmax)||'';\n  const lead=(new Date(DP.y,DP.m,1).getDay()+6)%7;          /* shift so Monday=0 */\n  const days=new Date(DP.y,DP.m+1,0).getDate();\n  let cells='';\n  for(let d=1;d<=days;d++){\n    const iso=DP.y+'-'+dpPad(DP.m+1)+'-'+dpPad(d);\n    const off=(dmin&&iso<dmin)||(dmax&&iso>dmax);\n    let c='dp-cell';if(iso===sel)c+=' sel';if(iso===tIso)c+=' today';if(off)c+=' off';\n    const st=d===1?` style=\"grid-column:${lead+1}\"`:'';\n    cells+=off?`<div class=\"${c}\"${st}>${d}<\/div>`:`<div class=\"${c}\"${st} onclick=\"dpPick('${iso}')\">${d}<\/div>`;\n  }\n  pop.innerHTML=`\n   <div class=\"dp-head\">\n     <button type=\"button\" class=\"dp-nav\" onclick=\"dpShift(-1)\">${DP.CHEVL}<\/button>\n     <button type=\"button\" class=\"dp-title\" onclick=\"dpToMonths()\">${DP.MON[DP.m]} ${DP.y}<\/button>\n     <button type=\"button\" class=\"dp-nav\" onclick=\"dpShift(1)\">${DP.CHEVR}<\/button>\n   <\/div>\n   <div class=\"dp-dow\">${DP.DOW.map(x=>`<span>${x}<\/span>`).join('')}<\/div>\n   <div class=\"dp-grid\">${cells}<\/div>\n   <div class=\"dp-foot\">\n     <button type=\"button\" class=\"dp-clear\" onclick=\"dpClear()\">Clear<\/button>\n     <button type=\"button\" class=\"dp-now\" onclick=\"dpPick('${tIso}')\">Today<\/button>\n   <\/div>`;\n}\n/* ===== manual typing (double-click) ===== */\nfunction dpEdit(id){\n  dpClose();\n  const inp=document.getElementById(id);if(!inp)return;\n  inp.dataset.prev=inp.value;\n  inp.readOnly=false;inp.classList.add('editing');\n  inp.focus();inp.select();\n}\nfunction dpNormalize(s){\n  s=(s||'').trim();if(s==='')return '';\n  let m=/^(\\d{4})[-/.](\\d{1,2})[-/.](\\d{1,2})$/.exec(s);          /* yyyy-mm-dd */\n  if(!m){const d=/^(\\d{1,2})[-/.](\\d{1,2})[-/.](\\d{4})$/.exec(s); /* dd-mm-yyyy (year last = day first) */\n    if(d)m=[null,d[3],d[2],d[1]];}\n  if(!m)return null;\n  const y=+m[1],mo=+m[2],dd=+m[3];\n  if(mo<1||mo>12||dd<1||dd>31)return null;\n  const dt=new Date(y,mo-1,dd);\n  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==dd)return null;\n  return y+'-'+dpPad(mo)+'-'+dpPad(dd);\n}\nfunction dpCommit(id){\n  const inp=document.getElementById(id);if(!inp||inp.readOnly)return;\n  const norm=dpNormalize(inp.value);\n  const mn=inp.dataset.dpmin||'',mx=inp.dataset.dpmax||'';\n  if(norm===null){inp.value=inp.dataset.prev||'';toast('Invalid date \u2014 use yyyy-mm-dd',true);}\n  else if(norm!==''&&((mn&&norm<mn)||(mx&&norm>mx))){inp.value=inp.dataset.prev||'';toast('Date is outside the allowed range',true);}\n  else inp.value=norm;\n  inp.readOnly=true;inp.classList.remove('editing');delete inp.dataset.prev;\n}\nfunction dpKey(e,id){\n  if(e.key==='Enter'){e.preventDefault();document.getElementById(id).blur();}\n  else if(e.key==='Escape'){const inp=document.getElementById(id);inp.value=inp.dataset.prev||'';inp.blur();}\n}\nfunction dpPick(iso){\n  const inp=document.getElementById(DP.id);\n  if(inp&&inp.dataset){const mn=inp.dataset.dpmin||'',mx=inp.dataset.dpmax||'';\n    if((mn&&iso<mn)||(mx&&iso>mx)){toast('Date is outside the allowed range',true);return;}}\n  if(inp)inp.value=iso;dpClose();\n}\nfunction dpClear(){const inp=document.getElementById(DP.id);if(inp)inp.value='';dpClose()}\ndocument.addEventListener('click',e=>{if(DP.id&&!e.target.closest('.dp'))dpClose()},true);\n/* ===== numeric input guards: block impossible values (negatives, exponent, decimals on integers) ===== */\ndocument.addEventListener('keydown',function(e){\n  const t=e.target;if(!t||t.tagName!=='INPUT'||!t.dataset||!t.dataset.num)return;\n  if(['e','E','+','-'].includes(e.key))e.preventDefault();\n  if(t.dataset.num==='int'&&(e.key==='.'||e.key===','))e.preventDefault();\n});\ndocument.addEventListener('input',function(e){\n  const t=e.target;const kind=t&&t.dataset&&t.dataset.num;if(!kind)return;\n  let v=t.value;\n  if(kind==='int'){v=v.replace(/[^\\d]/g,'');}\n  else{v=v.replace(/[^\\d.]/g,'');const i=v.indexOf('.');if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\\./g,'');}\n  if(v!==t.value)t.value=v;\n},true);\nfunction fld(label,id,val,type='text',ph='',req=false,attrs=''){\n  if(type==='date')return fldDate(label,id,val);\n  return `<div class=\"field\"><label>${label}${req?'<span class=\"req\">*<\/span>':''}<\/label><input id=\"${id}\" type=\"${type}\" value=\"${val!=null?esc(String(val)):''}\" placeholder=\"${esc(ph)}\" autocomplete=\"off\" ${attrs}><\/div>`;}\n/* combobox: type freely + suggestions (datalist) */\nfunction combo(label,id,opts,val,ph,req,onchange){\n  const lid=id+'_dl';\n  return `<div class=\"field\"><label>${label}${req?'<span class=\"req\">*<\/span>':''}<\/label>\n   <input id=\"${id}\" list=\"${lid}\" value=\"${val!=null?esc(String(val)):''}\" placeholder=\"${esc(ph||'Type or pick\u2026')}\" autocomplete=\"off\" ${onchange?`onchange=\"${onchange}\" oninput=\"${onchange}\"`:''}>\n   <datalist id=\"${lid}\">${opts.map(o=>`<option value=\"${esc(o.v)}\">${esc(o.l||o.v)}<\/option>`).join('')}<\/datalist><\/div>`;}\nconst curOpts=()=>(META.currencies||[]).map(c=>({v:c.code,l:`${c.code} (${c.sym})`}));\nconst curCombo=(val)=>combo('Currency','f_cur',curOpts(),val||cc().cur,'USD');\nconst validBlock=(r)=>`<div class=\"modal-section\"><h4>${I.cal} Rate Validity<\/h4><div class=\"fgrid\">${fld('Valid from','f_from',r?.from,'date')}${fld('Valid to','f_to',r?.to,'date')}<\/div><\/div>`;\nfunction portScopeOpts(includeNationwide){\n  const o=[];if(includeNationwide)o.push({v:'',l:'Nationwide (all ports)'});\n  masterPorts().forEach(p=>o.push({v:`${p.code} \u00b7 ${p.name}`,l:`Port \u00b7 ${p.code}`}));\n  masterCFS().forEach(c=>o.push({v:`${c.code} \u00b7 ${c.name}`,l:`CFS \u00b7 ${c.name}`}));\n  return o;}\nfunction parseCode(s){if(!s)return'';return String(s).split(' \u00b7 ')[0].trim();}\nfunction findScopeLabel(code){if(!code)return'';const p=masterPorts().find(x=>x.code===code);if(p)return`${p.code} \u00b7 ${p.name}`;\n  const f=masterCFS().find(x=>x.code===code);if(f)return`${f.code} \u00b7 ${f.name}`;return code;}\n\nfunction openForm(id){\n  editId=id||null;const def=PAGES[state.page];const r=id?recById(id):null;let html;\n  switch(def.kind){\n    case 'master-ports':html=formPorts(r);break;\n    case 'master-cfs':html=formCFS(r);break;\n    case 'master-admin':html=formAdmin(r);break;\n    case 'fee':html=formFee(def,r);break;\n    case 'trucking':html=formTruck(def,r);break;\n    case 'ocean':html=formOcean(def,r);break;\n    case 'localcharge':html=formLC(def,r);break;\n    case 'flat':html=formFlat(def,r);break;\n  }\n  document.getElementById('modalHost').innerHTML=html;\n  document.getElementById('overlay').classList.add('show');\n  if(def.kind==='trucking')initTruckForm(r);\n  if(def.kind==='fee'&&def.scope)scopeMode=(r&&r.scope)?'port':'all';\n  if(def.kind==='localcharge')initLCForm(def,r);\n  if(['fee','ocean'].includes(def.kind))initModeForm(def,r);\n  setTimeout(()=>{const f=document.querySelector('.modal input');if(f)f.focus();},50);\n}\nfunction closeForm(){document.getElementById('overlay').classList.remove('show');editId=null;editFxCode=null;}\ndocument.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeForm();});\n\n/* ===== MENU EDITOR: category + item CRUD ===== */\nconst ICON_CHOICES=[['db','Database'],['pin','Origin / Pin'],['ship','Ship / Freight'],['layers','Destination / Layers'],['truck','Truck'],['box','Box'],['tag','Tag'],['doc','Document'],['cal','Calendar']];\nconst TEMPLATES=[\n  ['fee','Standard fee \u2014 FCL per container / LCL per unit'],\n  ['trucking','Trucking \u2014 port/CFS + postal code'],\n  ['ocean','Ocean freight \u2014 lane + schedule'],\n  ['localcharge','Local charge set \u2014 multiple fee types'],\n  ['flat','Flat fee \u2014 single unit (e.g. per B/L)'],\n];\nfunction metaModal(title,sub,body,onSave){\n  document.getElementById('modalHost').innerHTML=`<div class=\"modal\"><div class=\"modal-head\"><div><h3>${esc(title)}<\/h3><p>${esc(sub)}<\/p><\/div><button class=\"x\" onclick=\"closeForm()\">${I.x}<\/button><\/div>\n    <div class=\"modal-body\">${body}<\/div>\n    <div class=\"modal-foot\"><button class=\"btn btn-ghost\" onclick=\"closeForm()\">Cancel<\/button><button class=\"btn btn-primary\" id=\"metaSaveBtn\">${I.check} Save<\/button><\/div><\/div>`;\n  document.getElementById('overlay').classList.add('show');\n  document.getElementById('metaSaveBtn').onclick=onSave;\n  setTimeout(()=>{const f=document.querySelector('.modal input,.modal select');if(f)f.focus();},50);}\n\n/* in-app confirmation dialog (replaces native confirm) */\nfunction confirmModal(opts){\n  const danger=opts.danger!==false;\n  document.getElementById('modalHost').innerHTML=`<div class=\"modal modal-confirm\"><div class=\"modal-head\"><div><h3>${esc(opts.title||'Are you sure?')}<\/h3><\/div><button class=\"x\" onclick=\"closeForm()\">${I.x}<\/button><\/div>\n    <div class=\"modal-body\"><p class=\"confirm-msg\">${opts.message||''}<\/p><\/div>\n    <div class=\"modal-foot\"><button class=\"btn btn-ghost\" onclick=\"closeForm()\">Cancel<\/button><button class=\"btn ${danger?'btn-danger':'btn-primary'}\" id=\"confirmOkBtn\">${danger?I.trash:I.check} ${esc(opts.confirmLabel||'Confirm')}<\/button><\/div><\/div>`;\n  document.getElementById('overlay').classList.add('show');\n  document.getElementById('confirmOkBtn').onclick=()=>{closeForm();if(opts.onConfirm)opts.onConfirm();};\n  setTimeout(()=>{const b=document.getElementById('confirmOkBtn');if(b)b.focus();},50);}\nfunction groupModal(gid){\n  if(gid&&groupLocked(gid)){toast('Core category cannot be edited',true);return;}\n  const g=gid?NAV.find(x=>x.id===gid):null;\n  const iconOpts=ICON_CHOICES.map(([k,l])=>`<option value=\"${k}\" ${(g?g.icon===k:k==='tag')?'selected':''}>${esc(l)}<\/option>`).join('');\n  const body=`<div class=\"fgrid\">\n    <div class=\"field span2\"><label>Category name<span class=\"req\">*<\/span><\/label><input id=\"m_gname\" value=\"${g?esc(g.label):''}\" placeholder=\"e.g. At Transshipment\" autocomplete=\"off\"><\/div>\n    <div class=\"field span2\"><label>Icon<\/label><select id=\"m_gicon\" class=\"m-select\">${iconOpts}<\/select><\/div>\n  <\/div>`;\n  metaModal(gid?'Rename category':'Add category',gid?'Update the category name & icon':'Create a new sidebar category',body,()=>saveGroup(gid));}\nfunction saveGroup(gid){\n  if(gid&&groupLocked(gid)){toast('Core category cannot be edited',true);return;}\n  const name=document.getElementById('m_gname').value.trim();if(!name){toast('Enter a category name',true);return;}\n  const icon=document.getElementById('m_gicon').value;\n  if(gid){const g=NAV.find(x=>x.id===gid);g.label=name;g.icon=icon;}\n  else NAV.push({id:'g_'+uid().slice(1),label:name,icon:icon,items:[]});\n  persistMeta();closeForm();renderAll();toast(gid?'Category updated':'Category added');}\nfunction delGroup(gid){const g=NAV.find(x=>x.id===gid);if(!g)return;\n  if(groupLocked(gid)){toast('Core category cannot be deleted',true);return;}\n  confirmModal({title:'Move category to Dustbin?',message:`Category \u201c${esc(g.label)}\u201d with ${g.items.length} item(s) and all their data will be moved to the Dustbin. Everything can be restored later.`,confirmLabel:'Move to Dustbin',onConfirm:()=>{\n    const pages={},data={};\n    g.items.forEach(it=>{pages[it.id]=clone(PAGES[it.id]);COUNTRIES.forEach(c=>{(data[c.id]=data[c.id]||{})[it.id]=clone((DB[c.id]&&DB[c.id][it.id])||[]);});});\n    pushTrash({type:'group',label:g.label,group:clone(g),pages:pages,data:data});\n    g.items.forEach(it=>{delete PAGES[it.id];COUNTRIES.forEach(c=>{if(DB[c.id])delete DB[c.id][it.id];});});\n    const i=NAV.findIndex(x=>x.id===gid);if(i>=0)NAV.splice(i,1);\n    if(!findNavItem(state.page))state.page=firstPage();\n    persistMeta();persist();renderAll();toast('Moved to Dustbin');}});}\n\n/* --- item (page) --- */\nfunction itemModal(groupId,pageId){\n  const p=pageId?PAGES[pageId]:null;const navItem=pageId?findNavItem(pageId):null;\n  const curGroup=p?p.group:groupId;\n  const grpOpts=NAV.map(g=>`<option value=\"${g.id}\" ${curGroup===g.id?'selected':''}>${esc(g.label)}<\/option>`).join('');\n  const tplOpts=TEMPLATES.map(([k,l])=>`<option value=\"${k}\" ${(p?p.kind===k:k==='fee')?'selected':''}>${esc(l)}<\/option>`).join('');\n  const lock=!!p;\n  const body=`<div class=\"fgrid\">\n    <div class=\"field span2\"><label>Item name<span class=\"req\">*<\/span><\/label><input id=\"m_iname\" value=\"${navItem?esc(navItem.label):''}\" placeholder=\"e.g. Quarantine Fee\" autocomplete=\"off\"><\/div>\n    <div class=\"field\"><label>Category<\/label><select id=\"m_igroup\" class=\"m-select\">${grpOpts}<\/select><\/div>\n    <div class=\"field\"><label>Fee type / template${lock?' (locked)':''}<\/label><select id=\"m_itype\" class=\"m-select\" ${lock?'disabled':''} onchange=\"itemTypeOpts()\">${tplOpts}<\/select><\/div>\n    <div class=\"field span2\"><label>Description (optional)<\/label><input id=\"m_idesc\" value=\"${p?esc(p.desc||''):''}\" placeholder=\"Short note shown under the page title\" autocomplete=\"off\"><\/div>\n  <\/div>\n  <div id=\"m_typeopts\"><\/div>`;\n  metaModal(pageId?'Edit item':'Add item',pageId?'Update name, category, description & options':'Create a new fee / item',body,()=>saveItem(pageId));\n  itemTypeOpts(p);}\nfunction itemTypeOpts(p){\n  const t=document.getElementById('m_itype').value;const host=document.getElementById('m_typeopts');let h='';\n  if(t==='fee'){const fee=p&&p.kind==='fee';\n    h=`<div class=\"modal-section\"><h4>${I.box} Standard fee options<\/h4><div class=\"fgrid\">\n      <div class=\"field\"><label>LCL unit<\/label><input id=\"m_lclunit\" value=\"${fee?(p.lclUnit==null?'':esc(p.lclUnit)):'set'}\" placeholder=\"set / W/M / tons \u2014 leave blank for FCL only\"><span class=\"hint\">Blank = FCL only (no LCL row).<\/span><\/div>\n      <div class=\"field\"><label>Behaviour<\/label>\n        <label style=\"display:flex;align-items:center;gap:8px;font-weight:500;color:var(--g600)\"><input type=\"checkbox\" id=\"m_scope\" ${(fee?p.scope:true)?'checked':''} style=\"width:auto;flex:none\"> Port / scope selector<\/label>\n        <label style=\"display:flex;align-items:center;gap:8px;font-weight:500;color:var(--g600);margin-top:6px\"><input type=\"checkbox\" id=\"m_inspect\" ${fee&&p.inspect?'checked':''} style=\"width:auto;flex:none\"> Inspection note column<\/label><\/div>\n    <\/div><\/div>`;\n  }else if(t==='flat'){const fl=p&&p.kind==='flat';\n    h=`<div class=\"modal-section\"><h4>${I.tag} Flat fee options<\/h4><div class=\"fgrid\"><div class=\"field\"><label>Charging unit<span class=\"req\">*<\/span><\/label><input id=\"m_flatunit\" value=\"${fl?esc(p.flatUnit||''):'B/L'}\" placeholder=\"B/L / SET\"><\/div><\/div><\/div>`;\n  }else if(t==='localcharge'){\n    h=`<div class=\"hint\" style=\"margin-top:6px;color:var(--g400)\">A flexible \u201cOther fee\u2026\u201d set is created \u2014 you can record FCL or LCL (W/M) entries with custom names from the entry form.<\/div>`;\n  }else{\n    h=`<div class=\"hint\" style=\"margin-top:6px;color:var(--g400)\">Fixed structure \u2014 no extra options.<\/div>`;\n  }\n  host.innerHTML=h;}\nfunction saveItem(pageId){\n  const name=document.getElementById('m_iname').value.trim();if(!name){toast('Enter an item name',true);return;}\n  const groupId=document.getElementById('m_igroup').value;const desc=document.getElementById('m_idesc').value.trim();\n  if(pageId){\n    const p=PAGES[pageId];const oldGroup=p.group;\n    p.title=name;p.desc=desc;p.group=groupId;\n    if(p.kind==='fee'){const u=document.getElementById('m_lclunit').value.trim();p.lclUnit=u===''?null:u;\n      if(document.getElementById('m_scope').checked)p.scope='port';else delete p.scope;\n      if(document.getElementById('m_inspect').checked)p.inspect=true;else delete p.inspect;}\n    if(p.kind==='flat')p.flatUnit=document.getElementById('m_flatunit').value.trim()||'unit';\n    const item=findNavItem(pageId);item.label=name;\n    if(oldGroup!==groupId){removeNavItem(pageId);NAV.find(g=>g.id===groupId).items.push(item);}\n    persistMeta();closeForm();state.page=pageId;renderAll();toast('Item updated');return;\n  }\n  const type=document.getElementById('m_itype').value;const pid='p_'+uid().slice(1);\n  const cfg={kind:type,title:name,desc:desc,group:groupId,validity:true};\n  if(type==='fee'){const u=document.getElementById('m_lclunit').value.trim();cfg.fcl=true;cfg.lclUnit=u===''?null:u;\n    if(document.getElementById('m_scope').checked)cfg.scope='port';\n    if(document.getElementById('m_inspect').checked)cfg.inspect=true;}\n  if(type==='flat')cfg.flatUnit=document.getElementById('m_flatunit').value.trim()||'unit';\n  if(type==='localcharge')cfg.lcset=[{v:'Other',label:'Other fee\u2026',fcl:true,lclUnit:'W/M',free:true}];\n  PAGES[pid]=cfg;NAV.find(g=>g.id===groupId).items.push({id:pid,label:name});\n  ensureDB();persistMeta();persist();closeForm();state.page=pid;state.pageIndex=0;state.editMenu=false;renderAll();toast('Item added');}\nfunction delItem(pid){const it=findNavItem(pid);if(!it)return;\n  confirmModal({title:'Move item to Dustbin?',message:`\u201c${esc(it.label)}\u201d and its data in every country will be moved to the Dustbin. You can restore it later.`,confirmLabel:'Move to Dustbin',onConfirm:()=>{\n    const data={};COUNTRIES.forEach(c=>{data[c.id]=clone((DB[c.id]&&DB[c.id][pid])||[]);});\n    pushTrash({type:'item',page:pid,label:it.label,group:PAGES[pid]?PAGES[pid].group:null,config:clone(PAGES[pid]),data:data});\n    removeNavItem(pid);delete PAGES[pid];COUNTRIES.forEach(c=>{if(DB[c.id])delete DB[c.id][pid];});\n    if(state.page===pid)state.page=firstPage();\n    persistMeta();persist();renderAll();toast('Moved to Dustbin');}});}\n\nfunction modalShell(title,sub,body,wide,saveFn){\n  return `<div class=\"modal ${wide?'wide':''}\"><div class=\"modal-head\"><div><h3>${title}<\/h3><p>${sub}<\/p><\/div><button class=\"x\" onclick=\"closeForm()\">${I.x}<\/button><\/div>\n    <div class=\"modal-body\">${body}<\/div>\n    <div class=\"modal-foot\"><button class=\"btn btn-ghost\" onclick=\"closeForm()\">Cancel<\/button><button class=\"btn btn-primary\" onclick=\"${saveFn||'saveForm()'}\">${I.check} Save<\/button><\/div><\/div>`;}\n\n/* master forms */\nfunction formPorts(r){const b=`<div class=\"fgrid three\">\n  ${fld('UN/LOCODE','f_code',r?.code,'text','VNSGN',true)}${fld('City','f_city',r?.city,'text','Ho Chi Minh City')}\n  <div class=\"field\"><label>Port name<span class=\"req\">*<\/span><\/label><input id=\"f_name\" value=\"${r?.name?esc(r.name):''}\" placeholder=\"Cat Lai\" autocomplete=\"off\"><\/div><\/div>`;\n  return modalShell((r?'Edit':'Add')+' seaport',`Country: ${cc().name}`,b);}\nfunction formCFS(r){const b=`<div class=\"fgrid\">\n  ${fld('CFS Code','f_code',r?.code,'text','VN-CFS-SNP',true)}\n  ${combo('Linked port','f_port',[{v:'',l:'\u2014 No link \u2014'},...masterPorts().map(p=>({v:p.code,l:p.name}))],r?.port||'','Type or pick a port')}\n  <div class=\"field span2\"><label>CFS warehouse name<span class=\"req\">*<\/span><\/label><input id=\"f_name\" value=\"${r?.name?esc(r.name):''}\" placeholder=\"Tan Cang CFS\" autocomplete=\"off\"><\/div>\n  <div class=\"field span2\"><label>Address<\/label><input id=\"f_addr\" value=\"${r?.addr?esc(r.addr):''}\" placeholder=\"Nguyen Thi Dinh, HCMC\" autocomplete=\"off\"><\/div><\/div>`;\n  return modalShell((r?'Edit':'Add')+' CFS warehouse',`Country: ${cc().name}`,b);}\nfunction formAdmin(r){const provs=[...new Set(masterAdmin().map(a=>a.prov))].map(p=>({v:p}));\n  const dists=[...new Set(masterAdmin().map(a=>a.dist))].map(p=>({v:p}));\n  const b=`<div class=\"fgrid\">\n  ${combo('Province','f_prov',provs,r?.prov,'Type or pick\u2026',true)}\n  ${combo('District','f_dist',dists,r?.dist,'Type or pick\u2026',true)}\n  ${fld('Ward','f_ward',r?.ward,'text','Tan Thuan Dong')}${fld('Postal Code','f_zip',r?.zip,'text','72915',true)}\n  <\/div><div class=\"field full\" style=\"margin-top:4px\"><span class=\"hint\">International-standard postal code \u2014 used as the suggestion source for the trucking-fee input.<\/span><\/div>`;\n  return modalShell((r?'Edit':'Add')+' postal code',`Country: ${cc().name}`,b);}\n\n/* rate groups */\nfunction rateGroupFCL(r){return `<div class=\"rate-grid\">${CONTAINERS.map(k=>`<div class=\"rate-input\"><label>${k}<\/label><div class=\"wrap\"><span class=\"cur\">$<\/span><input id=\"r_${k}\" type=\"number\" step=\"0.01\" min=\"0\" inputmode=\"decimal\" data-num=\"money\" value=\"${r&&r.mode==='FCL'&&r.r[k]!=null?r.r[k]:''}\" placeholder=\"0.00\"><\/div><\/div>`).join('')}<\/div>`;}\nfunction rateGroupLCL(unit,r){return `<div class=\"rate-input\" style=\"max-width:280px\"><label>Unit price (/${unit})<\/label><div class=\"wrap\"><span class=\"cur\">$<\/span><input id=\"r_val\" type=\"number\" step=\"0.01\" min=\"0\" inputmode=\"decimal\" data-num=\"money\" value=\"${r&&r.r&&r.r.val!=null?r.r.val:''}\" placeholder=\"0.00\"><\/div><\/div>`;}\nfunction rateGroupTruck(r){return `<div class=\"rate-grid\">${TRUCKS.map(([k,l])=>`<div class=\"rate-input\"><label>${l}<\/label><div class=\"wrap\"><span class=\"cur\">$<\/span><input id=\"r_${k}\" type=\"number\" step=\"0.01\" min=\"0\" inputmode=\"decimal\" data-num=\"money\" value=\"${r&&r.mode==='LCL'&&r.r[k]!=null?r.r[k]:''}\" placeholder=\"0.00\"><\/div><\/div>`).join('')}<\/div>`;}\nfunction modeToggle(active){return `<div class=\"mode-toggle\" id=\"modeToggle\"><button data-m=\"FCL\" class=\"${active==='FCL'?'on':''}\" onclick=\"switchMode('FCL')\">FCL<\/button><button data-m=\"LCL\" class=\"${active==='LCL'?'on':''}\" onclick=\"switchMode('LCL')\">LCL<\/button><\/div>`;}\n\n/* fee form */\nfunction formFee(def,r){\n  const mode=r?.mode||'FCL';\n  const typeBlock=def.feeTypes?combo('Surcharge type','f_feeType',def.feeTypes.map(t=>({v:t})),r?.feeType||def.feeTypes[0],'BAF / YAS / RR\u2026',true):'';\n  const sm=(r&&r.scope)?'port':'all';\n  const scopeSection=def.scope?`\n    <div class=\"modal-section\"><h4>${I.pin} Applicable scope<\/h4>\n      <div class=\"tick-group\" id=\"scopeTicks\">\n        <button type=\"button\" class=\"tick-opt ${sm==='all'?'on':''}\" data-sm=\"all\" onclick=\"setScopeMode('all')\">\n          <span class=\"tick-box\">${I.check}<\/span><span class=\"tk-txt\"><span class=\"tk-title\">Apply to all ports<\/span><span class=\"tk-sub\">One shared rate &amp; validity for every port<\/span><\/span><\/button>\n        <button type=\"button\" class=\"tick-opt ${sm==='port'?'on':''}\" data-sm=\"port\" onclick=\"setScopeMode('port')\">\n          <span class=\"tick-box\">${I.check}<\/span><span class=\"tk-txt\"><span class=\"tk-title\">Per port<\/span><span class=\"tk-sub\">A separate rate for one specific port / CFS<\/span><\/span><\/button>\n      <\/div>\n      <div id=\"scopePortWrap\" style=\"${sm==='port'?'':'display:none'}\">${combo('Port / CFS','f_scope',portScopeOpts(false),r?.scope?findScopeLabel(r.scope):'','Type or pick a port / CFS',true)}<\/div>\n    <\/div>`:'';\n  const b=`<div class=\"fgrid three\">${typeBlock}${curCombo(r?.cur)}<div><\/div><\/div>\n    ${scopeSection}\n    <div class=\"modal-section\"><h4>${I.box} Rate Table<\/h4>${def.lclUnit!==null?modeToggle(mode):'<div class=\"hint\" style=\"margin-bottom:10px\">FCL only.<\/div>'}<div id=\"rateArea\"><\/div><\/div>\n    ${def.inspect?`<div class=\"modal-section\"><h4>${I.doc} Notes<\/h4><div class=\"field full\"><label>Other inspection costs (per invoice)<\/label><textarea id=\"f_note\">${r?.note?esc(r.note):''}<\/textarea><\/div><\/div>`:''}\n    ${def.validity?validBlock(r):''}`;\n  return modalShell((r?'Edit':'Add')+' '+def.title.split('\u2014')[0].trim().toLowerCase(),`${cc().name}${def.scope?' \u00b7 choose how the rate applies':''}`,b,true);\n}\nlet scopeMode='all';\nfunction setScopeMode(m){scopeMode=m;\n  document.querySelectorAll('#scopeTicks .tick-opt').forEach(b=>b.classList.toggle('on',b.dataset.sm===m));\n  const w=document.getElementById('scopePortWrap');if(w)w.style.display=(m==='port')?'':'none';}\nlet currentMode='FCL';\nfunction initModeForm(def,r){currentMode=r?.mode||'FCL';renderRateArea(def,r);}\nfunction renderRateArea(def,r){\n  if(def.kind==='ocean'){renderOceanRate(def,r);return;}\n  const area=document.getElementById('rateArea');if(!area)return;const lclUnit=def.lclUnit||'set';\n  if(def.lclUnit===null){area.innerHTML=rateGroupFCL(r);currentMode='FCL';return;}\n  area.innerHTML=currentMode==='FCL'?rateGroupFCL(r):rateGroupLCL(lclUnit,r);\n}\nfunction switchMode(m){const def=PAGES[state.page];currentMode=m;\n  document.querySelectorAll('#modeToggle button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));\n  const r=editId?recById(editId):null;\n  if(def.kind==='trucking'){renderTruckRate(r);return;}\n  renderRateArea(def,r);}\n\n/* trucking form */\nfunction formTruck(def,r){\n  const locOpts=[{v:'',l:'\u2014 Select port / CFS \u2014'},...masterPorts().map(p=>({v:`${p.code} \u00b7 ${p.name}`,l:`Port \u00b7 ${p.code}`})),...masterCFS().map(c=>({v:`${c.code} \u00b7 ${c.name}`,l:`CFS \u00b7 ${c.name}`}))];\n  const b=`<div class=\"fgrid\">\n    ${combo('Origin port / CFS','f_port',locOpts,r?.port?findScopeLabel(r.port):'','Type or pick\u2026',true)}${curCombo(r?.cur)}<\/div>\n  <div class=\"modal-section\"><h4>${I.pin} Delivery / pickup point (postal code)<\/h4>\n    <div class=\"field full ac\" style=\"position:relative\"><label>Postal Code<span class=\"req\">*<\/span><\/label>\n      <input id=\"f_zip\" autocomplete=\"off\" placeholder=\"Type a postal code or administrative unit name\u2026\" value=\"${r?.zip?esc(r.zip):''}\" oninput=\"acFilter(this.value)\" onfocus=\"acFilter(this.value)\">\n      <div class=\"ac-list\" id=\"acList\"><\/div><input type=\"hidden\" id=\"f_adm\" value=\"${r?.adm?esc(r.adm):''}\">\n      <span class=\"hint\" id=\"acHint\">${r?.adm?'Selected: '+esc(r.adm):'Suggestions show the postal code with the Province/District/Ward name.'}<\/span><\/div><\/div>\n  <div class=\"modal-section\"><h4>${I.truck} Trucking Rate Table<\/h4>${modeToggle(r?.mode||'FCL')}<div id=\"rateArea\"><\/div><\/div>\n  ${validBlock(r)}`;\n  return modalShell((r?'Edit':'Add')+' trucking fee',`${cc().name} \u00b7 ${def.title.includes('Origin')?'At Origin':'At Destination'}`,b,true);\n}\nfunction initTruckForm(r){currentMode=r?.mode||'FCL';renderTruckRate(r);}\nfunction renderTruckRate(r){const area=document.getElementById('rateArea');if(!area)return;area.innerHTML=currentMode==='FCL'?rateGroupFCL(r):rateGroupTruck(r);}\nfunction acFilter(q){const list=document.getElementById('acList');if(!list)return;q=(q||'').toLowerCase().trim();\n  const items=masterAdmin().filter(a=>!q||a.zip.toLowerCase().includes(q)||`${a.prov} ${a.dist} ${a.ward}`.toLowerCase().includes(q)).slice(0,12);\n  if(!items.length){list.innerHTML=`<div class=\"ac-empty\">No suggestions \u2014 check the \u201cPostal Code\u201d section for ${cc().name}.<\/div>`;list.classList.add('show');return;}\n  list.innerHTML=items.map(a=>`<div class=\"ac-item\" onclick=\"acPick('${a.id}')\"><span class=\"ac-zip\">${esc(a.zip)}<\/span><span class=\"ac-name\">${esc(a.ward?a.ward+', ':'')}${esc(a.dist)}, ${esc(a.prov)}<\/span><\/div>`).join('');\n  list.classList.add('show');}\nfunction acPick(id){const a=masterAdmin().find(x=>x.id===id);if(!a)return;\n  document.getElementById('f_zip').value=a.zip;const label=`${a.ward?a.ward+', ':''}${a.dist}, ${a.prov}`;\n  document.getElementById('f_adm').value=label;document.getElementById('acHint').textContent='Selected: '+label;\n  document.getElementById('acList').classList.remove('show');}\ndocument.addEventListener('click',e=>{const l=document.getElementById('acList');if(l&&!e.target.closest('.ac'))l.classList.remove('show');});\n\n/* ocean form */\nfunction formOcean(def,r){\n  const polOpts=[{v:'',l:'\u2014 Select POL \u2014'},...masterPorts().map(p=>({v:p.code,l:p.name}))];\n  const b=`<div class=\"fgrid three\">${combo('POL (origin port)','f_pol',polOpts,r?.pol||'','Type or pick\u2026',true)}${fld('POD (destination port)','f_pod',r?.pod,'text','USLAX',true)}${fld('Carrier','f_carrier',r?.carrier,'text','ONE / COSCO')}<\/div>\n  <div class=\"modal-section\"><h4>${I.ship} Ocean Freight<\/h4>${modeToggle(r?.mode||'FCL')}<div id=\"rateArea\"><\/div><div style=\"max-width:280px;margin-top:10px\">${curCombo(r?.cur)}<\/div><\/div>\n  <div class=\"modal-section\"><h4>${I.cal} Schedule & Transit<\/h4><div class=\"fgrid three\">${fld('ETD','f_etd',r?.etd,'text','Mon/Thu')}${fld('Transit time (days)','f_transit',r?.transit,'number','0',false,'min=\"0\" step=\"1\" inputmode=\"numeric\" data-num=\"int\"')}${fld('Via (transshipment)','f_via',r?.via,'text','Direct / SGSIN')}${fld('Freetime at origin (days)','f_ftO',r?.ftO,'number','0',false,'min=\"0\" step=\"1\" inputmode=\"numeric\" data-num=\"int\"')}${fld('Freetime at destination (days)','f_ftD',r?.ftD,'number','0',false,'min=\"0\" step=\"1\" inputmode=\"numeric\" data-num=\"int\"')}<\/div><\/div>\n  ${validBlock(r)}`;\n  return modalShell((r?'Edit':'Add')+' ocean freight',`${cc().name} \u00b7 origin lane`,b,true);\n}\nfunction renderOceanRate(def,r){const area=document.getElementById('rateArea');if(!area)return;area.innerHTML=currentMode==='FCL'?rateGroupFCL(r):rateGroupLCL('set',r);}\n\n/* local charge form */\nfunction formLC(def,r){\n  const b=`<div class=\"fgrid three\">${combo('Fee type','f_feeType',def.lcset.map(t=>({v:t.v,l:t.label})),r?.feeType||def.lcset[0].v,'Type or pick\u2026',true,'onLCType()')}${curCombo(r?.cur)}<div><\/div><\/div>\n  <div class=\"modal-section\"><h4>${I.tag} Rate Table <span id=\"lcUnitTag\" style=\"font-weight:600;color:var(--g400);text-transform:none;letter-spacing:0\"><\/span><\/h4><div id=\"lcModeWrap\"><\/div><div id=\"rateArea\"><\/div><\/div>\n  ${validBlock(r)}`;\n  return modalShell((r?'Edit':'Add')+' local charge',`${cc().name} \u00b7 ${def.title.includes('Origin')?'At Origin':'At Destination'}`,b,true);\n}\nlet _lcEditRec=null;\nfunction initLCForm(def,r){_lcEditRec=r;renderLC(def,r);}\nfunction lcDescriptor(def,v){let t=def.lcset.find(x=>x.v.toLowerCase()===String(v||'').toLowerCase());\n  if(!t)t={v:v||'',label:v||'',fcl:true,lclUnit:'SET',free:true};return t;}\nfunction onLCType(){renderLC(PAGES[state.page],_lcEditRec);}\nfunction renderLC(def,r){\n  const v=document.getElementById('f_feeType').value;const t=lcDescriptor(def,v);\n  const wrap=document.getElementById('lcModeWrap');const tag=document.getElementById('lcUnitTag');\n  if(t.flatUnit){currentMode='FLAT';wrap.innerHTML='';tag.textContent=`(fixed / ${t.flatUnit})`;\n    document.getElementById('rateArea').innerHTML=rateGroupLCL(t.flatUnit,r&&r.mode==='FLAT'?{r:r.r}:null);return;}\n  const m=(r&&['FCL','LCL'].includes(r.mode))?r.mode:(t.fcl?'FCL':'LCL');currentMode=m;\n  let toggle='';\n  if(t.fcl&&t.lclUnit!==null)toggle=modeToggle(m);\n  else if(t.fcl)toggle='<div class=\"hint\" style=\"margin-bottom:10px\">FCL only.<\/div>';\n  else toggle='<div class=\"hint\" style=\"margin-bottom:10px\">LCL only.<\/div>';\n  wrap.innerHTML=toggle;tag.textContent=t.lclUnit?`(FCL: container \u00b7 LCL: /${t.lclUnit})`:'';\n  wrap.querySelectorAll('#modeToggle button').forEach(b=>b.onclick=()=>{currentMode=b.dataset.m;\n    wrap.querySelectorAll('#modeToggle button').forEach(x=>x.classList.toggle('on',x.dataset.m===currentMode));drawLCRate(t,r);});\n  drawLCRate(t,r);\n}\nfunction drawLCRate(t,r){const area=document.getElementById('rateArea');\n  if(currentMode==='FCL')area.innerHTML=rateGroupFCL(r&&r.mode==='FCL'?r:null);\n  else area.innerHTML=rateGroupLCL(t.lclUnit||'unit',r&&r.mode==='LCL'?{r:r.r}:null);}\n\n/* flat form */\nfunction formFlat(def,r){const b=`<div class=\"fgrid\"><div class=\"field\"><label>Unit<\/label><input value=\"${def.flatUnit}\" disabled style=\"background:var(--g50)\"><\/div>${curCombo(r?.cur)}<\/div>\n  <div class=\"modal-section\"><h4>${I.tag} Rate Table<\/h4>${rateGroupLCL(def.flatUnit,r?{r:r.r}:null)}<\/div>${validBlock(r)}`;\n  return modalShell((r?'Edit':'Add')+' fee',`${cc().name}`,b);}\n\n/* ===== save ===== */\nfunction gv(id){const e=document.getElementById(id);return e?e.value.trim():''}\nfunction gnum(id){const v=gv(id);return v===''?null:Number(v)}\nfunction collectFCL(){const o={};CONTAINERS.forEach(k=>{const v=gnum('r_'+k);if(v!=null)o[k]=v;});return o;}\nfunction collectTruck(){const o={};TRUCKS.forEach(([k])=>{const v=gnum('r_'+k);if(v!=null)o[k]=v;});return o;}\nfunction saveForm(){\n  const def=PAGES[state.page];const list=rows();let r={};let ok=true;\n  const need=(v,msg)=>{if(!v){toast(msg,true);ok=false;}return v;};\n  switch(def.kind){\n    case 'master-ports':need(gv('f_code'),'Enter UN/LOCODE');need(gv('f_name'),'Enter port name');\n      r={code:gv('f_code').toUpperCase(),name:gv('f_name'),city:gv('f_city')};break;\n    case 'master-cfs':need(gv('f_code'),'Enter CFS code');need(gv('f_name'),'Enter warehouse name');\n      r={code:gv('f_code').toUpperCase(),name:gv('f_name'),addr:gv('f_addr'),port:gv('f_port')};break;\n    case 'master-admin':need(gv('f_prov'),'Enter province');need(gv('f_dist'),'Enter district');need(gv('f_zip'),'Enter postal code');\n      r={prov:gv('f_prov'),dist:gv('f_dist'),ward:gv('f_ward'),zip:gv('f_zip')};break;\n    case 'fee':r={mode:def.lclUnit===null?'FCL':currentMode,cur:gv('f_cur')};\n      if(def.scope){if(scopeMode==='port'){r.scope=parseCode(gv('f_scope'));need(r.scope,'Select a port / CFS, or switch to \u201cApply to all ports\u201d');}else r.scope='';}if(def.feeTypes)r.feeType=gv('f_feeType');\n      if(r.mode==='FCL'){r.r=collectFCL();need(Object.keys(r.r).length,'Enter at least 1 container rate');}\n      else{r.r={val:gnum('r_val')};r.unit=def.lclUnit;need(r.r.val!=null,'Enter LCL unit price');}\n      if(def.inspect)r.note=gv('f_note');r.from=gv('f_from');r.to=gv('f_to');break;\n    case 'trucking':need(gv('f_port'),'Select port/CFS');need(gv('f_zip'),'Enter/select postal code');\n      r={port:parseCode(gv('f_port')),zip:gv('f_zip'),adm:gv('f_adm'),mode:currentMode,cur:gv('f_cur')};\n      if(currentMode==='FCL'){r.r=collectFCL();need(Object.keys(r.r).length,'Enter container rate');}\n      else{r.r=collectTruck();need(Object.keys(r.r).length,'Enter rate per truck type');}\n      r.from=gv('f_from');r.to=gv('f_to');break;\n    case 'ocean':need(gv('f_pol'),'Select POL');need(gv('f_pod'),'Enter POD');\n      r={pol:parseCode(gv('f_pol')).toUpperCase(),pod:gv('f_pod').toUpperCase(),carrier:gv('f_carrier'),mode:currentMode,cur:gv('f_cur'),etd:gv('f_etd'),transit:gv('f_transit'),via:gv('f_via'),ftO:gv('f_ftO'),ftD:gv('f_ftD')};\n      if(currentMode==='FCL'){r.r=collectFCL();need(Object.keys(r.r).length,'Enter container freight');}\n      else{r.r={val:gnum('r_val')};r.unit='set';need(r.r.val!=null,'Enter LCL freight');}\n      r.from=gv('f_from');r.to=gv('f_to');break;\n    case 'localcharge':{const t=lcDescriptor(def,gv('f_feeType'));need(gv('f_feeType'),'Enter fee type');r={feeType:gv('f_feeType'),cur:gv('f_cur')};\n      if(t.flatUnit){r.mode='FLAT';r.unit=t.flatUnit;r.r={val:gnum('r_val')};need(r.r.val!=null,'Enter rate');}\n      else if(currentMode==='FCL'){r.mode='FCL';r.r=collectFCL();need(Object.keys(r.r).length,'Enter container rate');}\n      else{r.mode='LCL';r.unit=t.lclUnit;r.r={val:gnum('r_val')};need(r.r.val!=null,'Enter LCL unit price');}\n      r.from=gv('f_from');r.to=gv('f_to');break;}\n    case 'flat':r={mode:'FLAT',unit:def.flatUnit,cur:gv('f_cur'),r:{val:gnum('r_val')}};need(r.r.val!=null,'Enter rate');r.from=gv('f_from');r.to=gv('f_to');break;\n  }\n  if(r.r){const vals=(r.r.val!=null)?[r.r.val]:Object.values(r.r);\n    if(vals.some(v=>v!=null&&!(Number(v)>0))){toast('Rates must be greater than 0',true);ok=false;}}\n  if(r.from&&r.to&&r.to<r.from){toast('\u201cValid to\u201d cannot be earlier than \u201cValid from\u201d',true);ok=false;}\n  if(!ok)return;\n  if(editId){const i=list.findIndex(x=>x.id===editId);const old=list[i]||{};list[i]=Object.assign({id:editId,ts:old.ts},r);toast('Record updated');}\n  else{list.push(Object.assign({id:uid(),ts:nowTs()},r));toast('New record added');}\n  persist();closeForm();renderAll();\n}\nfunction delRow(id){const list=rows();const i=list.findIndex(x=>x.id===id);if(i<0)return;\n  const r=list[i];const def=PAGES[state.page];\n  confirmModal({title:'Move to Dustbin?',message:`\u201c${esc(recLabel(r))}\u201d will be moved to the Dustbin. You can restore it later.`,confirmLabel:'Move to Dustbin',onConfirm:()=>{\n    const lst=rows();const j=lst.findIndex(x=>x.id===id);if(j<0)return;\n    pushTrash({type:'record',country:state.country,page:state.page,pageTitle:def?def.title:state.page,label:recLabel(r),payload:clone(r)});\n    lst.splice(j,1);persist();renderAll();toast('Moved to Dustbin');}});}\n\n/* ===== EXCEL import / template ===== */\nfunction excelCols(def){\n  const rateFCL=CONTAINERS.map(k=>({k,h:k}));\n  const truckCols=TRUCKS.map(([k])=>({k,h:k}));\n  switch(def.kind){\n    case 'master-ports':return [{k:'code',h:'code'},{k:'name',h:'name'},{k:'city',h:'city'}];\n    case 'master-cfs':return [{k:'code',h:'code'},{k:'name',h:'name'},{k:'addr',h:'address'},{k:'port',h:'linked_port'}];\n    case 'master-admin':return [{k:'prov',h:'province'},{k:'dist',h:'district'},{k:'ward',h:'ward'},{k:'zip',h:'zipcode'}];\n    case 'fee':return [...(def.feeTypes?[{k:'feeType',h:'fee_type'}]:[]),...(def.scope?[{k:'scope',h:'scope_code'}]:[]),{k:'mode',h:'mode'},...rateFCL,{k:'val',h:'lcl_value'},{k:'unit',h:'unit'},{k:'cur',h:'currency'},...(def.inspect?[{k:'note',h:'note'}]:[]),{k:'from',h:'valid_from'},{k:'to',h:'valid_to'}];\n    case 'trucking':return [{k:'port',h:'port_or_cfs_code'},{k:'zip',h:'zipcode'},{k:'adm',h:'admin_unit'},{k:'mode',h:'mode'},...rateFCL,...truckCols,{k:'cur',h:'currency'},{k:'from',h:'valid_from'},{k:'to',h:'valid_to'}];\n    case 'ocean':return [{k:'pol',h:'pol'},{k:'pod',h:'pod'},{k:'carrier',h:'carrier'},{k:'mode',h:'mode'},...rateFCL,{k:'val',h:'lcl_value'},{k:'cur',h:'currency'},{k:'etd',h:'etd'},{k:'transit',h:'transit_days'},{k:'via',h:'via'},{k:'ftO',h:'freetime_origin'},{k:'ftD',h:'freetime_dest'},{k:'from',h:'valid_from'},{k:'to',h:'valid_to'}];\n    case 'localcharge':return [{k:'feeType',h:'fee_type'},{k:'mode',h:'mode'},...rateFCL,{k:'val',h:'lcl_value'},{k:'unit',h:'unit'},{k:'cur',h:'currency'},{k:'from',h:'valid_from'},{k:'to',h:'valid_to'}];\n    case 'flat':return [{k:'unit',h:'unit'},{k:'val',h:'value'},{k:'cur',h:'currency'},{k:'from',h:'valid_from'},{k:'to',h:'valid_to'}];\n  }\n  return [];\n}\nfunction ensureXLSX(){if(typeof XLSX==='undefined'){toast('Excel library not loaded \u2014 needs internet access',true);return false;}return true;}\nfunction downloadTemplate(){\n  if(!ensureXLSX())return;const def=PAGES[state.page];const cols=excelCols(def);\n  const ex=sampleRow(def);\n  const aoa=[cols.map(c=>c.h),cols.map(c=>ex[c.k]!=null?ex[c.k]:'')];\n  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=cols.map(()=>({wch:16}));\n  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Template');\n  XLSX.writeFile(wb,`SHOPTRANS_${state.country}_${state.page}_template.xlsx`);\n  toast('Template downloaded');\n}\nfunction sampleRow(def){\n  const s={mode:'FCL','20GP':100,'40GP':150,'40HC':150,'45HC':170,val:'',unit:'',cur:cc().cur,from:'2026-01-01',to:'2026-12-31'};\n  if(def.kind==='master-ports')return {code:'VNSGN',name:'Cat Lai',city:'Ho Chi Minh City'};\n  if(def.kind==='master-cfs')return {code:'VN-CFS-SNP',name:'Tan Cang CFS',addr:'Nguyen Thi Dinh, HCMC',port:'VNSGN'};\n  if(def.kind==='master-admin')return {prov:'Ho Chi Minh City',dist:'District 7',ward:'Tan Thuan Dong',zip:'72915'};\n  if(def.scope)s.scope='VNSGN';if(def.feeTypes)s.feeType=def.feeTypes[0];\n  if(def.kind==='trucking'){s.port='VNSGN';s.zip='75358';s.adm='Tan Dong Hiep, Di An, Binh Duong';TRUCKS.forEach(([k])=>s[k]='');}\n  if(def.kind==='ocean'){s.pol='VNSGN';s.pod='USLAX';s.carrier='ONE';s.etd='Mon/Thu';s.transit=18;s.via='Direct';s.ftO=7;s.ftD=14;}\n  if(def.kind==='localcharge')s.feeType=def.lcset[0].v;\n  if(def.kind==='flat'){return {unit:def.flatUnit,val:30,cur:cc().cur,from:'2026-01-01',to:'2026-12-31'};}\n  if(def.inspect)s.note='per invoice';\n  return s;\n}\nfunction triggerImport(){if(!ensureXLSX())return;const inp=document.getElementById('xlsxFile');inp.value='';inp.click();}\ndocument.getElementById('xlsxFile').addEventListener('change',handleImport);\nfunction handleImport(e){\n  const file=e.target.files[0];if(!file)return;const reader=new FileReader();\n  reader.onload=ev=>{try{\n    const wb=XLSX.read(ev.target.result,{type:'array'});\n    const ws=wb.Sheets[wb.SheetNames[0]];\n    const json=XLSX.utils.sheet_to_json(ws,{defval:''});\n    const def=PAGES[state.page];const cols=excelCols(def);const list=rows();let added=0;\n    json.forEach(row=>{\n      const norm={};Object.keys(row).forEach(h=>norm[h.toString().trim().toLowerCase()]=row[h]);\n      const get=hk=>{const c=cols.find(c=>c.h===hk);return c?(norm[hk]!==undefined?norm[hk]:''):'';};\n      const rec=rowToRec(def,norm);if(rec){list.push(Object.assign({id:uid(),ts:nowTs()},rec));added++;}\n    });\n    persist();renderAll();toast(`Imported <b>${added}<\/b> record(s) from Excel`);\n  }catch(err){console.error(err);toast('Import failed \u2014 check the file format',true);}};\n  reader.readAsArrayBuffer(file);\n}\nfunction val(norm,h){const v=norm[h];return v===undefined||v===null?'':String(v).trim();}\nfunction numOrNull(norm,h){const v=norm[h];if(v===''||v===undefined||v===null)return null;const n=Number(v);return isNaN(n)?null:n;}\nfunction rowToRec(def,norm){\n  const r={};\n  const fclRates=()=>{const o={};CONTAINERS.forEach(k=>{const n=numOrNull(norm,k.toLowerCase());if(n!=null)o[k]=n;});return o;};\n  const truckRates=()=>{const o={};TRUCKS.forEach(([k])=>{const n=numOrNull(norm,k.toLowerCase());if(n!=null)o[k]=n;});return o;};\n  switch(def.kind){\n    case 'master-ports':if(!val(norm,'code'))return null;return {code:val(norm,'code').toUpperCase(),name:val(norm,'name'),city:val(norm,'city')};\n    case 'master-cfs':if(!val(norm,'code'))return null;return {code:val(norm,'code').toUpperCase(),name:val(norm,'name'),addr:val(norm,'address'),port:val(norm,'linked_port').toUpperCase()};\n    case 'master-admin':if(!val(norm,'zipcode'))return null;return {prov:val(norm,'province'),dist:val(norm,'district'),ward:val(norm,'ward'),zip:val(norm,'zipcode')};\n    case 'fee':{const mode=def.lclUnit===null?'FCL':(val(norm,'mode').toUpperCase()||'FCL');r.mode=mode;r.cur=val(norm,'currency')||cc().cur;\n      if(def.scope)r.scope=val(norm,'scope_code').toUpperCase();if(def.feeTypes)r.feeType=val(norm,'fee_type');\n      if(mode==='FCL'){r.r=fclRates();if(!Object.keys(r.r).length)return null;}else{const v=numOrNull(norm,'lcl_value');if(v==null)return null;r.r={val:v};r.unit=val(norm,'unit')||def.lclUnit;}\n      if(def.inspect)r.note=val(norm,'note');r.from=val(norm,'valid_from');r.to=val(norm,'valid_to');return r;}\n    case 'trucking':{const mode=val(norm,'mode').toUpperCase()||'FCL';r.mode=mode;r.cur=val(norm,'currency')||cc().cur;\n      r.port=val(norm,'port_or_cfs_code').toUpperCase();r.zip=val(norm,'zipcode');r.adm=val(norm,'admin_unit');if(!r.port)return null;\n      if(mode==='FCL'){r.r=fclRates();if(!Object.keys(r.r).length)return null;}else{r.r=truckRates();if(!Object.keys(r.r).length)return null;}\n      r.from=val(norm,'valid_from');r.to=val(norm,'valid_to');return r;}\n    case 'ocean':{const mode=val(norm,'mode').toUpperCase()||'FCL';r.mode=mode;r.cur=val(norm,'currency')||cc().cur;\n      r.pol=val(norm,'pol').toUpperCase();r.pod=val(norm,'pod').toUpperCase();if(!r.pol||!r.pod)return null;r.carrier=val(norm,'carrier');\n      r.etd=val(norm,'etd');r.transit=val(norm,'transit_days');r.via=val(norm,'via');r.ftO=val(norm,'freetime_origin');r.ftD=val(norm,'freetime_dest');\n      if(mode==='FCL'){r.r=fclRates();if(!Object.keys(r.r).length)return null;}else{const v=numOrNull(norm,'lcl_value');if(v==null)return null;r.r={val:v};r.unit='set';}\n      r.from=val(norm,'valid_from');r.to=val(norm,'valid_to');return r;}\n    case 'localcharge':{const t=lcDescriptor(def,val(norm,'fee_type'));if(!val(norm,'fee_type'))return null;r.feeType=val(norm,'fee_type');r.cur=val(norm,'currency')||cc().cur;\n      let mode=val(norm,'mode').toUpperCase();if(t.flatUnit)mode='FLAT';else if(!mode)mode=t.fcl?'FCL':'LCL';r.mode=mode;\n      if(mode==='FCL'){r.r=fclRates();if(!Object.keys(r.r).length)return null;}\n      else if(mode==='FLAT'){const v=numOrNull(norm,'lcl_value');if(v==null)return null;r.r={val:v};r.unit=t.flatUnit;}\n      else{const v=numOrNull(norm,'lcl_value');if(v==null)return null;r.r={val:v};r.unit=val(norm,'unit')||t.lclUnit;}\n      r.from=val(norm,'valid_from');r.to=val(norm,'valid_to');return r;}\n    case 'flat':{const v=numOrNull(norm,'value');if(v==null)return null;return {mode:'FLAT',unit:def.flatUnit,cur:val(norm,'currency')||cc().cur,r:{val:v},from:val(norm,'valid_from'),to:val(norm,'valid_to')};}\n  }\n  return null;\n}\n\n/* ===== util + boot ===== */\nfunction esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}\nlet toastT;\nfunction toast(msg,warn){const t=document.getElementById('toast');t.className='toast show'+(warn?' warn':'');\n  t.innerHTML=(warn?I.info:I.check)+'<span>'+msg+'<\/span>';clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}\nfunction renderAll(){renderCountryDropdown();renderSidebar();renderMain();}\nloadMeta();loadDB();loadTrash();renderAll();\n<\/script>\n<\/body>\n<\/html>"</script>
<script>

/* ===== custom checklist sheet-tabs (persisted, full sheet behavior) ===== */

let CKL_TABS=[];try{CKL_TABS=JSON.parse(localStorage.getItem(CKL_TABS_KEY))||[];if(!Array.isArray(CKL_TABS))CKL_TABS=[];}catch(e){CKL_TABS=[];}
function cklTabsSave(){try{localStorage.setItem(CKL_TABS_KEY,JSON.stringify(CKL_TABS))}catch(e){}}
function cklBlankGrid(cols){const g=[];const hdr=[];for(let c=0;c<cols;c++)hdr.push('Column '+(c+1));g.push(hdr);for(let r=1;r<120;r++)g.push(new Array(cols).fill(''));return g;}
CKL_TABS.forEach(t=>{const cols=t.cols||8;if(!(t.key in RAW))RAW[t.key]=cklBlankGrid(cols);if(!SHEETS.includes(t.key))SHEETS.push(t.key);RENAME[t.key]=t.label;});

  ['dest','AT DESTINATION',[['d_handling','Handling Fee'],['d_customs','Customs Fee'],['d_inspect','Inspection Fee'],['d_truck','Trucking Fee'],['d_demur','Demurrage Fee'],['d_lift','Lift On/Off Fee'],['d_infra','Port Infrastructure Fee']]],

  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){let d=+m[1],mo=+m[2],y=+m[3];if(y<100)y+=2000;const dt=new Date(y,mo-1,d);return isNaN(dt)?null:dt}
  const t=Date.parse(s);return isNaN(t)?null:new Date(t)}

  if(f.type==='number'){const num=Number(s.replace(/,/g,''));return(s.trim()!==''&&!isNaN(num))?num.toLocaleString('en-US'):s}

        const on=page==='sheet'&&isCklTab(active);
        html+=`<div class="sheet-item ${on?'active':''}" data-checklist="1"><span class="nm">CHECKLIST</span></div>`;

      }

  }

function cklNormRow(r,base,ri){

  else if(Array.isArray(r)){lead=r[0]||'';detail=r[1]||'';}
  else{lead=r==null?'':String(r);}
  return {id:base+'r'+ri,kind:kind,lead:lead,detail:detail,hot:hot};
}
function cklNormCard(c,base,ci){

function cklBuildDefaults(){
  const m={};
  for(const k of Object.keys(CKL_DEFAULTS)){
    const b=k.replace(/[^A-Za-z0-9]/g,'')+'_';

  const idx=filteredRows();
  const shown=idx.slice(0,Math.max(visible,1));
  let cols='';for(let c=0;c<n;c++)cols+=`<col style="width:${W[c]}px">`;
  // frozen column-letter bar
  let head='<tr>';
  for(let c=0;c<n;c++)head+=`<th data-col="${c}">${colLetter(c)}<span class="rsz" data-rsz="${c}"></span></th>`;
  head+='</tr>';
  $('#colbar').innerHTML=`<table style="width:${totalW}px"><colgroup>${cols}</colgroup><thead>${head}</thead></table>`;
  // frozen row-number bar + data body
  const shownSet=new Set(shown);
  const validMerges=query?[]:(MERGES[active]||[]).filter(m=>{for(let r=m[0];r<=m[2];r++)if(!shownSet.has(r))return false;return true;});
  const regAt=(r,c)=>{for(const m of validMerges){if(r>=m[0]&&r<=m[2]&&c>=m[1]&&c<=m[3])return m}return null};
  let rb='',body='';
  for(const ri of shown){
    const r=DATA[active][ri];const isHdr=ri===0;
    const rh=(ROWH[active]&&ROWH[active][ri]!=null)?ROWH[active][ri]:null;
    rb+=`<tr><td class="rownum ${isHdr?'hdrn':''}"${isHdr?'':` data-row="${ri}"`}>${ri+1}<span class="rrz" data-rrz="${ri}" title="Resize row"></span></td></tr>`;
    body+=`<tr class="${isHdr?'hdr':''}">`;
    for(let c=0;c<n;c++){
      const reg=regAt(ri,c);
      if(reg&&!(ri===reg[0]&&c===reg[1]))continue;
      let span='';if(reg){const rs=reg[2]-reg[0]+1,cs=reg[3]-reg[1]+1;if(rs>1)span+=` rowspan="${rs}"`;if(cs>1)span+=` colspan="${cs}"`;}
      const val=r[c];const f=fmtOf(ri,c);
      let st='';if(rh)st+=`height:${rh}px;max-height:${rh}px;overflow:hidden;`;
      if(f&&f.color)st+='color:'+f.color+';';
      if(f&&f.bg)st+='background:'+f.bg+';';
      if(!isHdr&&(val==='TRUE'||val==='FALSE')){
        body+=`<td class="cell bool" data-r="${ri}" data-c="${c}"${span}${st?` style="${st}"`:''}><input type="checkbox" class="bchk" data-r="${ri}" data-c="${c}" ${val==='TRUE'?'checked':''}></td>`;
      }else{
        const al=cellAlign(f);if(al!=='center')st+=`text-align:${al};`;
        body+=`<td class="cell" data-r="${ri}" data-c="${c}"${span}${st?` style="${st}"`:''}>${esc(fmtDisplay(val,f))}</td>`;
      }
    }
    body+='</tr>';
  }
  $('#rowbar').innerHTML=`<table><tbody>${rb}</tbody></table>`;
  let lm='<div class="loadmore">';const remain=idx.length-shown.length;
  lm+=`<button id="loadMore">Load ${remain>0?Math.min(PAGE,remain):PAGE} more rows</button>`;
  lm+=`<div class="info">Showing ${shown.length} / ${idx.length} rows${query?' (filtered)':''}</div></div>`;
  $('#ssheet').innerHTML=`<table style="width:${totalW}px"><colgroup>${cols}</colgroup><tbody>${body}</tbody></table>${lm}`;
  $('#ssheet').scrollTop=0;$('#ssheet').scrollLeft=0;$('#colbar').scrollLeft=0;$('#rowbar').scrollTop=0;
  syncRowHeights();
  const lmb=document.getElementById('loadMore');if(lmb)lmb.onclick=()=>{
    const i2=filteredRows();
    if(i2.length>visible){visible+=PAGE}
    else{const n2=normalize(active);for(let i=0;i<PAGE;i++)DATA[active].push(new Array(n2).fill(''));if(ROWH[active])ROWH[active].length=DATA[active].length;visible+=PAGE;save()}
    renderSheet();
  };
  highlight();
}
function syncRowHeights(){
  const bt=$('#ssheet').querySelector('table'),rt=$('#rowbar').querySelector('table');if(!bt||!rt||!bt.tBodies[0]||!rt.tBodies[0])return;
  const br=bt.tBodies[0].rows,rr=rt.tBodies[0].rows;
  for(let i=0;i<rr.length&&i<br.length;i++){const h=br[i].offsetHeight;rr[i].style.height=h+'px';if(rr[i].cells[0])rr[i].cells[0].style.height=h+'px'}
}

/* ---------- SELECTION (Excel-like: drag cells/rows/cols, select-all) ---------- */
function selRect(){
  if(!sel)return null;
  const R=DATA[active].length, n=ncols(active);
  let r1,r2,c1,c2;
  if(sel.kind==='all'){r1=0;r2=R-1;c1=0;c2=n-1}
  else if(sel.kind==='col'){c1=Math.min(sel.a.c,sel.f.c);c2=Math.max(sel.a.c,sel.f.c);r1=0;r2=R-1}
  else if(sel.kind==='row'){r1=Math.min(sel.a.r,sel.f.r);r2=Math.max(sel.a.r,sel.f.r);c1=0;c2=n-1}
  else{r1=Math.min(sel.a.r,sel.f.r);r2=Math.max(sel.a.r,sel.f.r);c1=Math.min(sel.a.c,sel.f.c);c2=Math.max(sel.a.c,sel.f.c)}
  return{r1,r2,c1,c2};
}
function highlight(){
  const ss=$('#ssheet'),cb=$('#colbar'),rbw=$('#rowbar');if(!ss.querySelector('table')){$('#selInfo').textContent='';return}
  ss.querySelectorAll('td.cell.sel-rng').forEach(td=>td.classList.remove('sel-rng'));
  rbw.querySelectorAll('td.rownum.sel').forEach(el=>el.classList.remove('sel'));
  cb.querySelectorAll('th.sel').forEach(el=>el.classList.remove('sel'));
  const rect=selRect();
  if(!rect){$('#selInfo').textContent='';updateFmtToolbar();return}
  ss.querySelectorAll('td.cell').forEach(td=>{const r=+td.dataset.r,c=+td.dataset.c;if(r>=rect.r1&&r<=rect.r2&&c>=rect.c1&&c<=rect.c2)td.classList.add('sel-rng')});
  cb.querySelectorAll('th[data-col]').forEach(th=>{const c=+th.dataset.col;if(c>=rect.c1&&c<=rect.c2)th.classList.add('sel')});
  rbw.querySelectorAll('td.rownum[data-row]').forEach(rn=>{const r=+rn.dataset.row;if(r>=rect.r1&&r<=rect.r2)rn.classList.add('sel')});
  const rr=rect.r2-rect.r1+1,cc=rect.c2-rect.c1+1;
  $('#selInfo').textContent=(rr*cc>1)?`${rr}×${cc}`:'';
  updateFmtToolbar();
}
function setActiveBtn(id,on){const el=$('#'+id);if(el)el.classList.toggle('active',on)}
function updateFmtToolbar(){
  let f={};const rect=selRect();
  if(rect)f=fmtOf(rect.r1,rect.c1)||{};
  else if(lastRC)f=fmtOf(lastRC.r,lastRC.c)||{};
  const type=f.type||'text';
  const align=f.align||(type==='number'?'right':'center');
  setActiveBtn('fmtText',type==='text');setActiveBtn('fmtNum',type==='number');setActiveBtn('fmtDate',type==='date');
  setActiveBtn('alLeft',align==='left');setActiveBtn('alCenter',align==='center');setActiveBtn('alRight',align==='right');
}

/* clipboard */
function copyText(t){const done=()=>toast('Copied to clipboard');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fbCopy(t,done))}else fbCopy(t,done)}
function fbCopy(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);ok?done():toast('Copy not allowed here')}
function copySel(){
  const rect=selRect();if(!rect){toast('Nothing selected');return}
  const out=[];for(let r=rect.r1;r<=rect.r2;r++){const a=[];for(let c=rect.c1;c<=rect.c2;c++){const v=DATA[active][r][c];a.push(v==null?'':v)}out.push(a.join('\t'))}
  copyText(out.join('\n'));
}
function deleteSel(){
  const rect=selRect();if(!rect||!sel){toast('Nothing selected');return}
  if(sel.kind==='col'){const what=`${rect.c2-rect.c1+1} column(s)`;confirmBox(`Delete ${what}?`,()=>{for(let c=rect.c2;c>=rect.c1;c--){DATA[active].forEach(row=>row.splice(c,1));if(COLW[active])COLW[active].splice(c,1)}sel=null;save();saveW();renderSheet();toast(`Deleted ${what}`)})}
  else if(sel.kind==='row'){const what=`${rect.r2-rect.r1+1} row(s)`;confirmBox(`Delete ${what}?`,()=>{for(let r=rect.r2;r>=rect.r1;r--){if(r===0)continue;DATA[active].splice(r,1);if(ROWH[active])ROWH[active].splice(r,1)}sel=null;save();saveH();renderSidebar();renderSheet();toast(`Deleted ${what}`)})}
  else{confirmBox('Clear contents of the selected cells?',()=>{for(let r=rect.r1;r<=rect.r2;r++)for(let c=rect.c1;c<=rect.c2;c++)DATA[active][r][c]='';save();renderSheet();toast('Selection cleared')})}
}
